/* Shelf Pop tokens (the Standard design system) */
:root{
  --cocoa:#4b2a22; --cream:#f4e6cf; --cobalt:#1f5bb5; --paper:#fffaf2; --mocha:#7a5648; --sand:#d9c3a3;
  --grammar:#ffd23a; --grammarInk:#1f47b8; --vocab:#7b3cbf; --vocabInk:#f4e6cf; --review:#6e2438; --reviewInk:#f4e6cf;
  --p1:#9fd63c; --p2:#ffd23a; --p3:#f07ccb;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --sans:Barlow,Arial,sans-serif; --serif:"Playfair Display",Georgia,serif;
  --rSm:6px; --rMd:16px; --rLid:48px; --rPill:999px;
  --elev1:0 1px 0 rgba(75,42,34,.08),0 3px 8px -4px rgba(75,42,34,.14);
  --elev2:0 2px 0 rgba(75,42,34,.10),0 10px 20px -10px rgba(75,42,34,.24);
  --elev3:0 4px 0 rgba(75,42,34,.12),0 18px 32px -14px rgba(75,42,34,.32);
  --press:0 4px 0 rgba(75,42,34,.28); --pressed:0 1px 0 rgba(75,42,34,.28);
  --ease:cubic-bezier(0.2,0,0,1); --spring:cubic-bezier(0.34,1.56,0.64,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--cream);color:var(--cocoa);font-family:var(--sans);font-size:18px;line-height:1.55}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;line-height:1.05}
button,select{font-family:var(--sans)}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100vh}
/* header */
header{position:relative;z-index:5;display:flex;align-items:center;gap:24px;min-height:70px;padding:10px 32px;background:var(--cream);border-bottom:1px solid var(--sand);box-shadow:var(--elev2);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.brand img{height:30px;width:auto;display:block}
.brand .home{display:block;flex:none}
.brand .back{text-decoration:none}
.brand .back:hover{color:var(--cobalt)}
.brand .divider{width:1px;height:34px;background:var(--sand)}
.brand .ttl{display:flex;flex-direction:column}
.stamp{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--mocha);line-height:1.2}
.brand h1{font-size:26px;font-weight:800;color:var(--cocoa)}
.tabs{display:flex;gap:4px;margin-left:auto;padding:4px;background:var(--paper);border-radius:var(--rPill);box-shadow:var(--elev1);flex-wrap:wrap}
.tab{min-height:44px;border:none;background:transparent;color:var(--cocoa);font-weight:600;font-size:16px;padding:8px 18px;border-radius:var(--rPill);transition:background .25s var(--ease),color .25s var(--ease),transform .1s}
.tab:hover{background:var(--cream)}
.tab:active{transform:scale(.97)}
.tab.active{background:var(--cobalt);color:var(--cream)}
main{flex:1;display:flex;min-height:0}
.stage-wrap{position:relative;flex:1;min-width:0}
#scene{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#scene.dragging{cursor:grabbing}
#scene.hover{cursor:pointer}
.card{background:var(--paper);border-radius:var(--rMd);box-shadow:var(--elev2)}
.hint{position:absolute;left:16px;top:16px;padding:10px 14px;font-size:15px;color:var(--mocha);max-width:340px}
.hint b{color:var(--cocoa)}
.legend{position:absolute;right:16px;top:16px;padding:8px 14px;font-size:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 380px)}
.legend div{display:flex;align-items:center;gap:6px;line-height:1.4}
.legend .stamp{margin:0}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none;border:1.5px solid var(--cocoa)}
.view-btns{position:absolute;left:16px;bottom:72px;display:flex;gap:8px}
.view-btns button{min-height:44px;background:var(--paper);border:1.5px solid var(--mocha);border-radius:var(--rMd);padding:6px 14px;color:var(--cocoa);font-weight:600;font-size:15px;box-shadow:var(--elev1)}
.view-btns button:hover{border-color:var(--cobalt);color:var(--cobalt)}
.strip{pointer-events:none;position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;padding:12px 16px;overflow-x:auto;background:linear-gradient(transparent,rgba(244,230,207,.96) 35%)}
.chip{pointer-events:auto;flex:none;min-height:44px;border:2px solid transparent;background:var(--paper);border-radius:var(--rPill);padding:4px 14px 4px 6px;font-size:15px;font-weight:600;color:var(--cocoa);white-space:nowrap;box-shadow:var(--elev1);transition:transform .45s var(--spring),box-shadow .25s}
.chip:hover{transform:translateY(-2px);box-shadow:var(--elev3)}
.chip .n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-family:var(--display);font-size:15px;margin-right:8px;border:1.5px solid var(--cocoa)}
.chip.active{border-color:var(--cobalt);background:#eaf0fa}
/* side panel */
aside{width:460px;max-width:46vw;background:var(--paper);border-left:1px solid var(--sand);overflow-y:auto;padding:24px 24px 48px}
aside h2{font-size:40px;font-weight:700;color:var(--cocoa);margin:4px 0 8px}
aside h3{font-size:24px;color:var(--cocoa);margin:32px 0 8px}
aside p{margin:8px 0}
.stagehead{border-left:10px solid var(--ph);padding-left:14px;margin-bottom:8px}
.pill{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;border:1.5px solid var(--cocoa);border-radius:var(--rPill);padding:3px 12px;margin:4px 0 8px}
.box{background:var(--cream);border-radius:var(--rMd);padding:14px 16px;margin:8px 0}
.box.note{background:var(--paper);border:1.5px dashed var(--mocha)}
.box.write{background:var(--paper);border:1.5px solid var(--mocha);border-left:6px solid var(--cobalt)}
.box.warn{background:var(--cream);border-left:6px solid var(--cocoa);font-size:16px}
.label{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--mocha);margin-bottom:4px}
.lid{border-radius:var(--rLid) var(--rLid) var(--rMd) var(--rMd);padding:18px 24px 16px;margin:32px 0 12px}
.lid h3{margin:2px 0 0;font-size:30px;font-weight:800;text-transform:uppercase}
.lid.vocab{background:var(--vocab);color:var(--vocabInk)} .lid.vocab .stamp{color:var(--vocabInk)} .lid.vocab h3{color:var(--vocabInk)}
.lid.grammar{background:var(--grammar)} .lid.grammar .stamp{color:var(--cocoa)} .lid.grammar h3{color:var(--grammarInk)}
.lid.review{background:var(--review);color:var(--reviewInk)} .lid.review .stamp,.lid.review h3{color:var(--reviewInk)}
.lid .inner{background:var(--paper);color:var(--cocoa);border-radius:var(--rMd);padding:6px 12px;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--sand);vertical-align:top}
th{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--mocha)}
td.w{font-weight:600;color:var(--cobalt);white-space:nowrap}
td.pos{color:var(--mocha);font-style:italic;white-space:nowrap}
td.vi{color:var(--mocha)}
/* teaching marks */
.seq{font-weight:600;background:linear-gradient(transparent 55%,var(--sand) 55%);padding:0 2px}
.pas{color:var(--cobalt);font-weight:600}
.ov{background:var(--cream);border-radius:4px;padding:0 2px;box-shadow:inset 0 0 0 1.5px var(--mocha)}
.exp{font-style:italic;text-decoration:underline;text-decoration-color:var(--mocha);text-decoration-thickness:2px;text-underline-offset:4px}
.exbox .seq{background:none;font-weight:inherit;padding:0}
.keyrow{display:flex;flex-wrap:wrap;gap:8px;font-size:15px;margin:8px 0 12px}
.keyrow span{padding:2px 10px;border-radius:var(--rPill);background:var(--cream)}
/* buttons */
.navrow{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{min-height:44px;border:none;border-radius:var(--rMd);padding:9px 18px;font-weight:600;font-size:16px;background:var(--cobalt);color:var(--cream);box-shadow:var(--press);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(3px);box-shadow:var(--pressed)}
.btn.alt{background:var(--paper);color:var(--cocoa);border:1.5px solid var(--mocha)}
.btn:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none}
.progress{height:8px;background:var(--sand);border-radius:var(--rPill);overflow:hidden;margin:8px 0}
.progress span{display:block;height:100%;background:var(--cobalt);transition:width .25s var(--ease)}
.prog-text{font-size:15px;color:var(--mocha)}
/* practice */
.q{border:1.5px solid var(--sand);border-radius:var(--rMd);padding:12px 14px;margin:10px 0;background:var(--paper);transition:border-color .2s}
.q select{font-size:17px;min-height:40px;padding:4px 8px;border:1.5px solid var(--mocha);border-radius:var(--rSm);background:var(--paper);color:var(--cocoa);margin:0 2px}
.q .num{font-family:var(--display);font-weight:700;color:var(--mocha);margin-right:6px}
.q .fb{font-size:15px;margin-top:8px;color:var(--mocha);display:none}
.q.ok,.q.no{border-color:var(--cocoa)}
.q.ok .fb,.q.no .fb{display:block}
.fstamp{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;border-radius:var(--rPill);padding:2px 10px;margin-right:6px;color:var(--cream);animation:pop .45s var(--spring)}
.fstamp.ok{background:var(--cobalt)} .fstamp.no{background:var(--review)}
@keyframes pop{from{transform:scale(.9)}to{transform:scale(1)}}
.score{font-family:var(--serif);font-size:44px;color:var(--cocoa);margin-top:12px;line-height:1}
.score small{font-family:var(--sans);font-size:15px;color:var(--mocha);display:block;margin-top:4px}
/* model answer */
.model{background:var(--paper);border:1.5px solid var(--mocha);border-radius:var(--rMd);padding:16px 18px}
.essay p{margin:0 0 12px}
.essay span[data-stage]{cursor:pointer;border-radius:4px;transition:background .2s}
.essay span[data-stage]:hover{background:var(--cream)}
.essay:not(.show-seq) .seq{background:none;font-weight:inherit;padding:0}
.essay:not(.show-pas) .pas{color:inherit;font-weight:inherit}
.essay:not(.show-exp) .exp{font-style:inherit;text-decoration:none}
.essay:not(.show-ov) .ov{background:none;box-shadow:none}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.filters button{min-height:40px;border:1.5px solid var(--mocha);background:var(--paper);color:var(--cocoa);border-radius:var(--rPill);padding:4px 14px;font-weight:600;font-size:15px}
.filters button.on{background:var(--cobalt);border-color:var(--cobalt);color:var(--cream)}
ul.tight{margin:6px 0;padding-left:20px}
ul.tight li{margin:4px 0}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--mocha);font-size:16px}
@media (max-width:1024px){
  header{padding:8px 16px;gap:10px}
  .brand img{height:24px}
  .brand h1{font-size:22px}
  .tabs{margin-left:0;width:100%;justify-content:space-between}
  .tab{padding:8px 10px;font-size:15px;flex:1}
}
@media (max-width:860px){
  main{flex-direction:column}
  .stage-wrap{flex:none;height:56vh}
  aside{width:100%;max-width:none;border-left:none;border-top:1px solid var(--sand);padding:20px 16px 48px}
  .legend{display:none}
  .hint{font-size:14px;max-width:250px}
  .brand .divider{display:none}
}
@media (max-width:640px){
  header{padding:8px 12px 10px}
  .brand{flex-direction:column;align-items:flex-start;gap:8px;width:100%}
  .brand img{height:22px}
  .brand .ttl .stamp{display:none}
  .brand h1{font-size:20px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;scrollbar-width:none}
  .tab{flex:none;padding:8px 12px}
  aside h2{font-size:32px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

      <div class="ttl"><a class="stamp back" href="writing.html">&larr; IELTS Writing · Task 1 · Process</a><h1>How aluminium cans are recycled</h1></div>

    <nav class="tabs" aria-label="Modes">

        <div><span class="dot" style="background:var(--p1)"></span>Phase 1 (stages 1 to 5)</div>
        <div><span class="dot" style="background:var(--p2)"></span>Phase 2 (6 to 9)</div>
        <div><span class="dot" style="background:var(--p3)"></span>Phase 3 (10 to 12)</div>
      </div>
      <div class="view-btns">
        <button id="btnOverview">Overview</button>

<script src="assets/three-r128.min.js"></script>
<script>
/* ===================== CONTENT ===================== */
const PHASES = {
  1:{name:'Phase 1 · Collection and preparation', color:'#9fd63c', ink:'#4b2a22'},
  2:{name:'Phase 2 · Melting and purification', color:'#ffd23a', ink:'#4b2a22'},
  3:{name:'Phase 3 · Manufacturing', color:'#f07ccb', ink:'#4b2a22'}
};
const STAGES = [
 {n:1,name:'Waste Collection',phase:1,
  diagram:'A truck collects used aluminium cans.',
  vocab:[['collect','v','to gather things from different places','thu gom'],
         ['waste truck','n','a vehicle that carries rubbish or recycling','xe chở rác'],
         ['used cans','n','cans that people have already emptied','lon đã qua sử dụng']],
  write:'<span class="seq">First</span>, used aluminium cans <span class="pas">are collected</span> by a waste truck.',
  real:'Cans usually come from household recycling bins and public collection points. Trucks then take them to a recycling centre.',
  expand:'<span class="seq">First</span>, used aluminium cans <span class="pas">are collected</span> by a waste truck <span class="exp">and transported to a recycling centre</span>.'},
 {n:2,name:'Consolidation',phase:1,
  diagram:'The cans are brought together at a large facility.',
  vocab:[['consolidate','v','to bring many small loads together into one large load','gom lại, tập kết'],
         ['facility','n','a building used for a special purpose','cơ sở, nhà máy'],
         ['transport','v','to move goods from one place to another','vận chuyển']],
  write:'<span class="seq">Next</span>, the cans <span class="pas">are consolidated</span> at a recycling facility.',
  real:'Bringing small loads together makes it cheaper and faster to move the metal to the processing plant.',
  expand:'<span class="seq">Next</span>, the cans <span class="pas">are consolidated</span> at a recycling facility <span class="exp">so that they can be processed in large quantities</span>.'},
 {n:3,name:'Advanced Sorting',phase:1,
  diagram:'Machines sort the waste on a conveyor belt, and iron is taken out.',
  vocab:[['sort','v','to put things into groups by type','phân loại'],
         ['separate','v','to take one thing away from another','tách ra'],
         ['magnet','n','an object that pulls iron and steel towards it','nam châm'],
         ['conveyor belt','n','a moving band that carries objects','băng chuyền']],
  write:'<span class="seq">After that</span>, the waste <span class="pas">is sorted</span> and iron <span class="pas">is removed</span>.',
  real:'Magnets pull out iron and steel. Other machines (eddy current separators) push aluminium away from the rest of the waste.',
  expand:'<span class="seq">After that</span>, the waste <span class="pas">is sorted</span>, and iron <span class="pas">is removed</span> <span class="exp">by magnets in order to leave only aluminium</span>.'},
 {n:4,name:'Shredding',phase:1,
  diagram:'The cans are cut into small pieces.',
  vocab:[['shred','v','to cut or tear into small pieces','cắt vụn, băm nhỏ'],
         ['shredder','n','a machine that cuts things into small pieces','máy băm'],
         ['fragment','n','a small piece broken off something','mảnh vụn']],
  write:'The sorted cans <span class="pas">are</span> <span class="seq">then</span> <span class="pas">shredded</span> into small pieces.',
  real:'Pieces of a similar size melt faster and more evenly than whole cans.',
  expand:'The sorted cans <span class="pas">are</span> <span class="seq">then</span> <span class="pas">shredded</span> into small pieces, <span class="exp">which makes them easier to handle</span>.'},
 {n:5,name:'Baling',phase:1,
  diagram:'The shredded metal is pressed into compact blocks called bales.',
  vocab:[['bale','n / v','a large, tightly pressed block; to press into such a block','kiện; ép thành kiện'],
         ['compress','v','to press something so it takes up less space','nén'],
         ['compact','adj','closely packed together','chặt, gọn']],
  write:'<span class="seq">Following this</span>, the shredded aluminium <span class="pas">is compressed</span> into bales.',
  real:'Bales are easy to stack, store and move. In many real systems, cans are baled earlier, before they are shipped to the plant.',
  expand:'<span class="seq">Following this</span>, the shredded aluminium <span class="pas">is compressed</span> into bales, <span class="exp">which can be stored and moved easily</span>.'},
 {n:6,name:'Induction Melting',phase:2,
  diagram:'The aluminium is melted in a furnace.',
  vocab:[['melt','v','to change from solid to liquid by heating','nung chảy'],
         ['furnace','n','a very hot oven used to heat metal','lò nung'],
         ['molten','adj','melted; in liquid form because of great heat','nóng chảy'],
         ['induction','n','heating with an electromagnetic field','cảm ứng (điện từ)']],
  write:'<span class="seq">In the next stage</span>, the aluminium <span class="pas">is melted</span> in an induction furnace.',
  real:'An induction furnace heats metal with an electromagnetic field. Aluminium melts at about 660°C.',
  expand:'<span class="seq">In the next stage</span>, the aluminium <span class="pas">is melted</span> in an induction furnace, <span class="exp">where it turns into liquid metal</span>.'},
 {n:7,name:'Thermal Decoating',phase:2,
  diagram:'Heat is used to remove the coating from the metal.',
  vocab:[['coating','n','a thin layer that covers a surface','lớp phủ'],
         ['thermal','adj','connected with heat','thuộc về nhiệt'],
         ['remove','v','to take something away','loại bỏ'],

let renderer,scene,camera,stations=[],selRing=null,hovered=-1,autoSpin=false;
const GX=[-9.5,0,9.5], GZ=[-15,-5,5,15];
function stagePos(i){ return new THREE.Vector3(GX[i%3],0,GZ[Math.floor(i/3)]); } // same grid as the exam diagram
const view={theta:0,phi:0.62,radius:56,target:new THREE.Vector3(0,0,1)};
const goal={theta:0,phi:0.62,radius:56,target:new THREE.Vector3(0,0,1)};
function focusStage(i){
  current=i; updateStrip(); highlight(i);
  if(!stations[i]) return;
  const p=stagePos(i);
  goal.target.set(p.x,1.4,p.z);
  goal.theta=nearestAngle(view.theta,0); goal.phi=1.0; goal.radius=14;
}
function overviewRadius(){ return camera && camera.aspect<1 ? 72 : (camera && camera.aspect<1.3 ? 54 : 45); }
function goOverview(){ goal.theta=nearestAngle(view.theta,0); goal.target.set(0,0,1); goal.phi=0.62; goal.radius=overviewRadius(); }
function nearestAngle(from,to){ let d=((to-from)%(Math.PI*2)+Math.PI*3)%(Math.PI*2)-Math.PI; return from+d; }

function init3D(){

/* ---------- conveyor path, cycle path and time bracket ---------- */
let movers=[], loop=[], loopLen=0, signs=[], cum=[];
const V=(x,z)=>new THREE.Vector3(x,0,z);
function mainPath(){
  const P=[];
  for(let r=0;r<4;r++){
    for(let c=0;c<3;c++) P.push(stagePos(r*3+c));
    if(r<3){ const lane=(GZ[r]+GZ[r+1])/2; P.push(V(GX[2],lane),V(GX[0],lane)); }
  }
  return P;
}
const RET_X=15, RET_Z=-21;
function cyclePath(){ return [stagePos(11),V(RET_X,GZ[3]),V(RET_X,RET_Z),V(GX[0],RET_Z),stagePos(0)]; }
function belt(a,b,mat,w,dashed){
  const d=b.clone().sub(a), L=d.length(), ang=Math.atan2(d.x,d.z);
  if(!dashed){ const m=mesh(new THREE.BoxGeometry(w,.16,L+w),mat,(a.x+b.x)/2,.08,(a.z+b.z)/2,scene); m.rotation.y=ang; m.castShadow=false; return; }
  const n=Math.floor(L/1.4);
  for(let k=0;k<n;k++){ const t=(k+.5)/n; const m=mesh(new THREE.BoxGeometry(w,.12,.8),mat,a.x+d.x*t,.07,a.z+d.z*t,scene); m.rotation.y=ang; m.castShadow=false; }
}
function arrow(a,b,mat,size){
  const d=b.clone().sub(a); const L=d.length(); d.normalize();
  let pt=null;
  for(const t of [.5,.75,.25,.85,.15]){ const q=a.clone().addScaledVector(d,L*t); if(STAGES.every((_,i)=>stagePos(i).distanceTo(q)>3.9)){pt=q;break;} }
  if(!pt) return;
  const c=mesh(new THREE.ConeGeometry(.75*size,1.6*size,3),mat,pt.x,.55,pt.z,scene);
  c.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d); c.scale.z=.45;
}
function buildTrack(){
  const P=mainPath(), C=cyclePath();
  const beltMat=M.dark, arrowMat=new THREE.MeshLambertMaterial({color:'#1f5bb5',emissive:'#0d2a5c',emissiveIntensity:.6});
  const cycMat=new THREE.MeshStandardMaterial({color:'#7a5648',roughness:.6});
  for(let k=0;k<P.length-1;k++){ belt(P[k],P[k+1],beltMat,1.1); arrow(P[k],P[k+1],arrowMat,1); }
  for(let k=0;k<C.length-1;k++){ belt(C[k],C[k+1],cycMat,.8,true); arrow(C[k],C[k+1],cycMat,.8); }
  loop=P.concat(C.slice(1,-1)); loop.push(P[0].clone());
  loopLen=0; for(let k=0;k<loop.length-1;k++) loopLen+=loop[k].distanceTo(loop[k+1]);
  cum=[0]; for(let k=0;k<loop.length-1;k++) cum.push(cum[k]+loop[k].distanceTo(loop[k+1]));
  const ingMat=M.metal, molten=M.glow;
  for(let k=0;k<40;k++){
    const g=new THREE.Group(); scene.add(g); g.userData.t=k/40;
    const fm={can:can(0,0,0,g,.9), bale:bale(0,0,0,g), melt:mesh(new THREE.SphereGeometry(.35,12,10),molten,0,.3,0,g),
      ingot:(()=>{const m=mesh(new THREE.CylinderGeometry(.3,.42,1.1,4),ingMat,0,.25,0,g); m.rotation.set(0,Math.PI/4,Math.PI/2); m.scale.set(1,1,.55); return m;})(),
      sheet:box(1,.06,.8,M.metal,0,.1,0,g)};
    fm.bale.scale.setScalar(.6);
    g.userData.forms=fm; movers.push(g);
  }
  const cyc=textSprite(['↻ Cycle: back','to stage 1'],'#7a5648',2.6); cyc.position.set(RET_X+2.4,1.6,RET_Z+1); scene.add(cyc); signs.push(cyc);
}
function pointOnLoop(u){
  let d=u*loopLen;
  for(let k=0;k<loop.length-1;k++){ const L=loop[k].distanceTo(loop[k+1]); if(d<=L) return loop[k].clone().lerp(loop[k+1],d/L); d-=L; }
  return loop[0].clone();
}
function textSprite(lines,color,h){

  g.fillStyle=color; g.textAlign='center'; g.textBaseline='middle'; lines.forEach((l,k)=>g.fillText(l,W/2,22+33+k*66));

   box(1.3,2.6,1.4,M.body,1.1,1.3,-.6,g); box(.8,.5,.05,M.glass,1.1,1.9,.12,g); box(.4,.4,.06,phaseMat(3),1.1,1.2,.12,g);
   const press=box(.5,.6,.5,M.mid,1.1,2.9,-.6,g); anims.push(t=>{press.position.y=2.9+Math.abs(Math.sin(t*3))*.3;});
   const cs=[]; for(let k=0;k<4;k++){ cs.push(can(-1.6+k*.8,.9,.7,g,.85)); }
   anims.push(t=>cs.forEach((c,k)=>{c.position.x=-1.6+(((t*.4)+k/4)%1)*3.2;})); },
 // 12 new cans pallet
 g=>{ box(3,.25,3,M.mid,0,.12,0,g); for(let x=-1;x<=1;x++) box(.25,.15,3,M.dark,x*1.2,-.0,0,g);
   for(let x=0;x<4;x++)for(let z=0;z<4;z++){ const c=can(-1.05+x*.7,.25,-1.05+z*.7,g,1.5); }
   const ring=mesh(new THREE.TorusGeometry(.5,.06,8,30,Math.PI*1.6),phaseMat(3),0,3,0,g);
   anims.push(t=>{ring.rotation.y=t;});
 }
];

function highlight(i){
  if(!selRing) return;
  if(i<0){ selRing.visible=false; return; }
  const st=stations[i]; selRing.visible=true;
  selRing.position.set(st.group.position.x,.35,st.group.position.z);
}

/* ---------- controls ---------- */
function setupControls(canvas){
  const pts=new Map(); let downPos=null, moved=false, pinch0=0, rad0=0;
  const ray=new THREE.Raycaster(), mv=new THREE.Vector2();
  function pick(e){
    const r=canvas.getBoundingClientRect();
    mv.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
    ray.setFromCamera(mv,camera);
    const hits=ray.intersectObjects(stations.map(s=>s.group),true);
    for(const h of hits){ if(h.object.userData.stage!==undefined) return h.object.userData.stage; }
    return -1;
  }
  canvas.addEventListener('pointerdown',e=>{
    document.getElementById('hint').style.display='none';
    canvas.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    downPos={x:e.clientX,y:e.clientY}; moved=false;
    if(pts.size===2){ const [a,b]=[...pts.values()]; pinch0=Math.hypot(a.x-b.x,a.y-b.y); rad0=goal.radius; }
  });
  canvas.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId)){
      if(e.pointerType==='mouse'){ hovered=pick(e); canvas.classList.toggle('hover',hovered>=0); }
      return;
    }
    const p=pts.get(e.pointerId); const dx=e.clientX-p.x, dy=e.clientY-p.y;
    p.x=e.clientX; p.y=e.clientY;
    if(Math.hypot(e.clientX-downPos.x,e.clientY-downPos.y)>5) moved=true;
    if(pts.size===2){ const [a,b]=[...pts.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); if(pinch0>0) goal.radius=clamp(rad0*pinch0/d,7,75); return; }
    if(moved){ canvas.classList.add('dragging');
      goal.theta-=dx*0.006; goal.phi=clamp(goal.phi-dy*0.005,0.25,1.45); }
  });
  const end=e=>{
    if(!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId); canvas.classList.remove('dragging');
    if(!moved && pts.size===0 && e.type==='pointerup'){
      const s=pick(e); if(s>=0) selectStage(s,mode==='tour');
    }
    if(pts.size<2) pinch0=0;
  };
  canvas.addEventListener('pointerup',end); canvas.addEventListener('pointercancel',end);
  canvas.addEventListener('wheel',e=>{ e.preventDefault(); goal.radius=clamp(goal.radius*(1+Math.sign(e.deltaY)*0.1),7,75); },{passive:false});
  document.getElementById('btnOverview').onclick=()=>{goOverview(); highlight(-1);};
  document.getElementById('btnSpin').onclick=e=>{autoSpin=!autoSpin; e.target.textContent='Auto rotate: '+(autoSpin?'on':'off');};
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){
  const c=renderer.domElement, w=c.parentElement.clientWidth, h=c.parentElement.clientHeight;
  renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
}
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.1); const t=clock.elapsedTime;
  if(autoSpin) goal.theta+=0.15*dt;
  const k=1-Math.pow(0.006,dt);
  view.theta+=(goal.theta-view.theta)*k; view.phi+=(goal.phi-view.phi)*k; view.radius+=(goal.radius-view.radius)*k;
  view.target.lerp(goal.target,k);
  camera.position.set(
    view.target.x+view.radius*Math.sin(view.phi)*Math.sin(view.theta),
    view.target.y+view.radius*Math.cos(view.phi),
    view.target.z+view.radius*Math.sin(view.phi)*Math.cos(view.theta));
  camera.lookAt(view.target);
  anims.forEach(f=>f(t));
  movers.forEach(m=>{ const u=(m.userData.t+t*0.008)%1; const q=pointOnLoop(u); m.position.set(q.x,.18,q.z);
    const d=u*loopLen; // what the material looks like on this part of the belt
    const f = d>=cum[6]&&d<cum[7]?'bale' : d>=cum[7]&&d<cum[11]?'melt' : d>=cum[11]&&d<cum[15]?'ingot' : d>=cum[15]&&d<cum[16]?'sheet' : 'can';
    const fm=m.userData.forms; for(const k in fm) fm[k].visible=(k===f); });
  const zoomed=view.radius<26;
  signs.forEach(sp=>{ if(!sp.userData.b) sp.userData.b=sp.scale.clone(); const f=zoomed?0.35:1; sp.scale.set(sp.userData.b.x*f,sp.userData.b.y*f,1); });
  stations.forEach((s,i)=>{ const on=i===hovered||i===current; s.plat.scale.y=on?1.6:1;
    const f=zoomed?(i===current?0.48:0.34):1; s.label.scale.set(s.label.userData.base*f,1.85*f,1); s.label.material.opacity=(zoomed&&i!==current)?0.75:1; });
  if(selRing&&selRing.visible){ selRing.scale.setScalar(1+Math.sin(t*4)*.04); }
  renderer.render(scene,camera);
}

/* start */
current=-1; renderPanel();
if(window.innerWidth<860) setTimeout(()=>{const h=document.getElementById('hint'); if(h) h.style.display='none';},5000);
(document.fonts&&document.fonts.load ? Promise.all(['700 50px "Barlow Condensed"','400 40px "Playfair Display"','400 18px Barlow'].map(f=>document.fonts.load(f))).catch(()=>{}) : Promise.resolve()).then(init3D);
</script>
