<script id="ssData" type="application/json">{"C":{"tiers":{"A":{"en":"Basic (A1 to A2)","vi":"Cơ bản (A1 đến A2)"},"B":{"en":"Intermediate (B1 to B2)","vi":"Trung cấp (B1 đến B2)"},"C":{"en":"Advanced (C1)","vi":"Nâng cao (C1)"}},"areas":[{"id":"elements","en":"Sentence elements","vi":"Thành phần câu","topics":[{"id":"el-sv","tier":"A","src":"bc-clause","title":{"en":"Subject and verb","vi":"Chủ ngữ và động từ"},"explain":{"en":"A clause needs a subject and a verb. The subject is the noun phrase that does the action. The verb is the action or state.","vi":"Một mệnh đề cần có chủ ngữ và động từ. Chủ ngữ là cụm danh từ thực hiện hành động. Động từ là hành động hoặc trạng thái."},"examples":[[["The children","S"],["laughed","V"]],[["Birds","S"],["fly","V"]]],"exercise":{"type":"label","prompt":{"en":"Tap the subject.","vi":"Chạm vào chủ ngữ."},"sample":"The dog barked. Answer: The dog"}},{"id":"el-svo","tier":"A","src":"bc-clause","title":{"en":"Object (S V O)","vi":"Tân ngữ (S V O)"},"explain":{"en":"The object receives the action. It follows a transitive verb.","vi":"Tân ngữ nhận hành động. Nó đứng sau ngoại động từ."},"examples":[[["John","S"],["wanted","V"],["a new bicycle","O"]],[["She","S"],["reads","V"],["books","O"]]],"exercise":{"type":"build","prompt":{"en":"Drag the parts into the correct order.","vi":"Kéo các phần vào đúng thứ tự."},"sample":"Parts: books / my sister / loves. Answer: My sister loves books."}},{"id":"el-svca","tier":"A","src":"bc-clause","title":{"en":"Complement and adverbial (S V C, S V A)","vi":"Bổ ngữ và trạng ngữ (S V C, S V A)"},"explain":{"en":"A complement describes the subject after a linking verb. An adverbial shows time, place or manner.","vi":"Bổ ngữ mô tả chủ ngữ sau động từ nối. Trạng ngữ chỉ thời gian, nơi chốn hoặc cách thức."},"examples":[[["This soup","S"],["tastes","V"],["awful","C"]],[["Mary and her family","S"],["were driving","V"],["to Madrid","A"]]],"exercise":{"type":"label","prompt":{"en":"Label each part: S, V, C or A.","vi":"Gắn nhãn từng phần: S, V, C hoặc A."},"sample":"The room (S) felt (V) cold (C)."}},{"id":"el-svoo","tier":"B","src":"std","title":{"en":"Two objects and object complement (S V O O, S V O C)","vi":"Hai tân ngữ và bổ ngữ cho tân ngữ (S V O O, S V O C)"},"explain":{"en":"Some verbs take an indirect object and a direct object. Others take an object and a complement that describes the object.","vi":"Một số động từ nhận tân ngữ gián tiếp và tân ngữ trực tiếp. Số khác nhận một tân ngữ và một bổ ngữ mô tả tân ngữ đó."},"examples":[[["She","S"],["gave","V"],["me","IO"],["a book","DO"]],[["They","S"],["made","V"],["him","O"],["captain","OC"]]],"exercise":{"type":"label","prompt":{"en":"Tap the indirect object.","vi":"Chạm vào tân ngữ gián tiếp."},"sample":"He sent his teacher an email. Answer: his teacher"}},{"id":"el-dummy","tier":"C","src":"bc-clause","title":{"en":"Dummy subjects: it and there","vi":"Chủ ngữ giả: it và there"},"explain":{"en":"English clauses always have a subject, except commands. When there is no other subject, use it or there.","vi":"Mệnh đề tiếng Anh luôn có chủ ngữ, trừ câu mệnh lệnh. Khi không có chủ ngữ khác, dùng it hoặc there."},"examples":[[["There","S"],["were","V"],["twenty people","S2"],["at the meeting","A"]],[["It","S"],["is","V"],["a lovely day","C"]]],"exercise":{"type":"fill","prompt":{"en":"Choose it or there.","vi":"Chọn it hoặc there."},"sample":"___ is raining. Answer: It"}},{"id":"el-clause-subject","tier":"C","src":"std","title":{"en":"A clause as the subject","vi":"Mệnh đề làm chủ ngữ"},"explain":{"en":"A whole clause can be the subject. It often starts with what, that or whether.","vi":"Cả một mệnh đề có thể làm chủ ngữ. Nó thường bắt đầu bằng what, that hoặc whether."},"examples":[[["What she said","S"],["surprised","V"],["everyone","O"]],[["Whether we win","S"],["does not matter","V"]]],"exercise":{"type":"build","prompt":{"en":"Drag the parts into the correct order.","vi":"Kéo các phần vào đúng thứ tự."},"sample":"Parts: shocked / what he did / us. Answer: What he did shocked us."}},{"id":"el-inversion","tier":"C","src":"bc-emphasis","title":{"en":"Inversion after negative adverbials","vi":"Đảo ngữ sau trạng từ phủ định"},"explain":{"en":"Put a negative adverbial such as never, rarely or not only at the start. Then put the auxiliary before the subject. If there is no auxiliary, add do, does or did.","vi":"Đặt trạng từ phủ định như never, rarely hoặc not only ở đầu câu. Sau đó đặt trợ động từ trước chủ ngữ. Nếu không có trợ động từ, thêm do, does hoặc did."},"examples":[[["Rarely","A"],["have","AUX"],["I","S"],["read","V"],["such an original story","O"]],[["Not only","A"],["do","AUX"],["they","S"],["have","V"],["live reptiles","O"]]],"exercise":{"type":"build","prompt":{"en":"Drag the parts into the correct order.","vi":"Kéo các phần vào đúng thứ tự."},"sample":"Parts: seen / I / have / never / such a film. Answer: Never have I seen such a film."}}]},{"id":"types","en":"Sentence types","vi":"Các loại câu","topics":[{"id":"ty-clause","tier":"A","src":"purdue","title":{"en":"Clause and phrase","vi":"Mệnh đề và cụm từ"},"explain":{"en":"An independent clause forms a complete sentence on its own. A dependent clause needs another clause to make a complete sentence. A phrase is a group of words without its own subject and verb.","vi":"Mệnh đề độc lập tự tạo thành một câu hoàn chỉnh. Mệnh đề phụ thuộc cần một mệnh đề khác để thành câu hoàn chỉnh. Cụm từ là nhóm từ không có chủ ngữ và động từ riêng."},"examples":[[["I missed the bus","IC"]],[["because I woke up late","DC"]],[["after school","PHRASE"]]],"exercise":{"type":"classify","prompt":{"en":"Choose: independent clause, dependent clause or phrase.","vi":"Chọn: mệnh đề độc lập, mệnh đề phụ thuộc hoặc cụm từ."},"sample":"when the bell rang. Answer: dependent clause"}},{"id":"ty-simple","tier":"A","src":"purdue","title":{"en":"Simple sentence","vi":"Câu đơn"},"explain":{"en":"A simple sentence has one independent clause and no dependent clauses. It can still have more than one subject or verb.","vi":"Câu đơn có một mệnh đề độc lập và không có mệnh đề phụ thuộc. Câu vẫn có thể có nhiều chủ ngữ hoặc nhiều động từ."},"examples":[[["My aunt enjoyed taking the hayride with you","IC"]],[["Tom and Mai sing and dance","IC"]]],"exercise":{"type":"classify","prompt":{"en":"Does the sentence have one clause? Choose yes or no.","vi":"Câu có đúng một mệnh đề không? Chọn có hoặc không."},"sample":"The cat slept on the sofa. Answer: yes, it is a simple sentence"}},{"id":"ty-compound","tier":"B","src":"purdue","title":{"en":"Compound sentence","vi":"Câu ghép"},"explain":{"en":"A compound sentence has two or more independent clauses and no dependent clauses. Join them with a comma and a coordinating conjunction (for, and, nor, but, or, yet, so), or with a semicolon.","vi":"Câu ghép có hai hoặc nhiều mệnh đề độc lập và không có mệnh đề phụ thuộc. Nối bằng dấu phẩy và liên từ đẳng lập (for, and, nor, but, or, yet, so), hoặc bằng dấu chấm phẩy."},"examples":[[["The clown frightened the little girl","IC"],[", and","CONJ"],["she ran off screaming","IC"]],[["I missed the bus","IC"],[", so","CONJ"],["I walked to school","IC"]]],"exercise":{"type":"fill","prompt":{"en":"Choose the conjunction that fits.","vi":"Chọn liên từ phù hợp."},"sample":"She was tired, ___ she kept working. Answer: yet (or but)"}},{"id":"ty-complex","tier":"B","src":"purdue","title":{"en":"Complex sentence","vi":"Câu phức"},"explain":{"en":"A complex sentence has one independent clause and at least one dependent clause. A subordinating conjunction such as because, although, when or if starts the dependent clause. Use a comma when the dependent clause comes first.","vi":"Câu phức có một mệnh đề độc lập và ít nhất một mệnh đề phụ thuộc. Liên từ phụ thuộc như because, although, when hoặc if mở đầu mệnh đề phụ thuộc. Dùng dấu phẩy khi mệnh đề phụ thuộc đứng trước."},"examples":[[["After Mary added up all the sales","DC"],[",",""],["she discovered that the lemonade stand was 32 cents short","IC"]],[["I missed the bus","IC"],["because I woke up late","DC"]]],"exercise":{"type":"label","prompt":{"en":"Tap the dependent clause.","vi":"Chạm vào mệnh đề phụ thuộc."},"sample":"We stayed home because it rained. Answer: because it rained"}},{"id":"ty-relative","tier":"B","src":"bc-relative","title":{"en":"Relative clauses","vi":"Mệnh đề quan hệ"},"explain":{"en":"A defining relative clause says which person or thing, and has no commas. A non defining clause adds extra information and uses commas. You can leave out the pronoun in a defining clause when it is the object. You cannot use that in a non defining clause.","vi":"Mệnh đề quan hệ xác định cho biết người hoặc vật nào, và không dùng dấu phẩy. Mệnh đề không xác định thêm thông tin phụ và dùng dấu phẩy. Có thể bỏ đại từ trong mệnh đề xác định khi nó là tân ngữ. Không dùng that trong mệnh đề không xác định."},"examples":[[["Marie Curie is the woman","IC"],["who discovered radium","DC"]],[["Lord Thompson","S"],[", who is 76,","DC"],["has just retired","V"]]],"exercise":{"type":"fill","prompt":{"en":"Choose who, which, that or whose.","vi":"Chọn who, which, that hoặc whose."},"sample":"The woman ___ car was stolen called the police. Answer: whose"}},{"id":"ty-sorter","tier":"B","src":"purdue","title":{"en":"Sentence type sorter","vi":"Phân loại câu theo cấu trúc"},"explain":{"en":"Count the independent and dependent clauses. One independent clause and no dependent clause is simple. Two or more independent clauses and no dependent clause is compound. One independent clause and at least one dependent clause is complex.","vi":"Đếm mệnh đề độc lập và mệnh đề phụ thuộc. Một mệnh đề độc lập và không có mệnh đề phụ thuộc là câu đơn. Hai hoặc nhiều mệnh đề độc lập và không có mệnh đề phụ thuộc là câu ghép. Một mệnh đề độc lập và ít nhất một mệnh đề phụ thuộc là câu phức."},"examples":[[["I missed the bus.","SIMPLE"]],[["I missed the bus, and I walked to school.","COMPOUND"]],[["I missed the bus because I woke up late.","COMPLEX"]]],"exercise":{"type":"sort","prompt":{"en":"Choose: simple, compound or complex.","vi":"Chọn: câu đơn, câu ghép hoặc câu phức."},"sample":"When it rains, we stay inside. Answer: complex"}},{"id":"ty-compound-complex","tier":"C","src":"purdue","title":{"en":"Compound complex sentence","vi":"Câu phức ghép"},"explain":{"en":"A compound complex sentence has two or more independent clauses and at least one dependent clause.","vi":"Câu phức ghép có hai hoặc nhiều mệnh đề độc lập và ít nhất một mệnh đề phụ thuộc."},"examples":[[["Although she was tired","DC"],[",",""],["she finished the report","IC"],[", and","CONJ"],["she sent it to her manager","IC"]],[["I called Nam","IC"],[", but","CONJ"],["he did not answer","IC"],["because his phone was off","DC"]]],"exercise":{"type":"sort","prompt":{"en":"Choose: simple, compound, complex or compound complex.","vi":"Chọn: câu đơn, câu ghép, câu phức hoặc câu phức ghép."},"sample":"Because it was late, we left, and they stayed. Answer: compound complex"}},{"id":"ty-participle","tier":"C","src":"test-english","title":{"en":"Reduced relative and participle clauses","vi":"Rút gọn mệnh đề quan hệ và mệnh đề phân từ"},"explain":{"en":"A past participle clause can replace a passive relative clause. An ing clause can replace an active clause. When a participle clause starts the sentence, its subject must be the same as the subject of the main clause.","vi":"Mệnh đề phân từ quá khứ có thể thay mệnh đề quan hệ bị động. Mệnh đề V ing có thể thay mệnh đề chủ động. Khi mệnh đề phân từ đứng đầu câu, chủ ngữ của nó phải trùng với chủ ngữ của mệnh đề chính."},"examples":[[["The briefcase, which was found in a litter bin, contained classified information.","FULL"]],[["Found in a litter bin, the briefcase contained classified information.","REDUCED"]]],"exercise":{"type":"build","prompt":{"en":"Reduce the relative clause.","vi":"Rút gọn mệnh đề quan hệ."},"sample":"The man who is standing by the door is my uncle. Answer: The man standing by the door is my uncle."}},{"id":"ty-cleft","tier":"C","src":"bc-emphasis","title":{"en":"Cleft sentences","vi":"Câu chẻ"},"explain":{"en":"A cleft sentence puts one part in focus. An it cleft uses it, be and the focus, then a clause. A what cleft starts with a what clause.","vi":"Câu chẻ đặt một phần câu vào tiêu điểm. Câu chẻ với it dùng it, be, phần nhấn mạnh, rồi một mệnh đề. Câu chẻ với what mở đầu bằng một mệnh đề what."},"examples":[[["It was you","FOCUS"],["who invited me to the party","DC"]],[["What I like best about going to the cinema","WH"],["is talking about the film afterwards","IC"]]],"exercise":{"type":"build","prompt":{"en":"Rewrite with an it cleft.","vi":"Viết lại bằng câu chẻ với it."},"sample":"Sam broke the window. Answer: It was Sam who broke the window."}}]},{"id":"classes","en":"Word classes","vi":"Từ loại","topics":[{"id":"cl-basic","tier":"A","src":"bc-adj","title":{"en":"Noun, verb, adjective, adverb","vi":"Danh từ, động từ, tính từ, trạng từ"},"explain":{"en":"A noun names a person, place or thing. A verb shows action or state. An adjective gives more information about a noun or pronoun. An adverb gives more information about a verb, an adjective or another adverb.","vi":"Danh từ gọi tên người, nơi chốn hoặc vật. Động từ chỉ hành động hoặc trạng thái. Tính từ cho thêm thông tin về danh từ hoặc đại từ. Trạng từ cho thêm thông tin về động từ, tính từ hoặc trạng từ khác."},"examples":[[["The","DET"],["quick","ADJ"],["dog","N"],["runs","V"],["fast","ADV"]],[["She","PRON"],["bought","V"],["a","DET"],["new","ADJ"],["car","N"]]],"exercise":{"type":"classify","prompt":{"en":"Choose the word class of the underlined word.","vi":"Chọn từ loại của từ được gạch chân."},"sample":"They walked slowly. (slowly) Answer: adverb"}},{"id":"cl-pron-prep","tier":"A","src":"std","title":{"en":"Pronoun and preposition","vi":"Đại từ và giới từ"},"explain":{"en":"A pronoun replaces a noun. A preposition shows the link between a noun and another word, such as place, time or direction.","vi":"Đại từ thay thế danh từ. Giới từ cho biết mối liên hệ giữa danh từ và từ khác, như nơi chốn, thời gian hoặc hướng."},"examples":[[["She","PRON"],["gave","V"],["it","PRON"],["to","PREP"],["him","PRON"]],[["The book","N"],["is","V"],["on","PREP"],["the table","N"]]],"exercise":{"type":"classify","prompt":{"en":"Choose: pronoun or preposition.","vi":"Chọn: đại từ hoặc giới từ."},"sample":"We met in the park. (in) Answer: preposition"}},{"id":"cl-conj-det","tier":"B","src":"bc-conj","title":{"en":"Conjunction and determiner","vi":"Liên từ và từ hạn định"},"explain":{"en":"A conjunction joins words or clauses, for example and, but, because, although. A determiner comes before a noun, for example a, the, some, this, my.","vi":"Liên từ nối từ hoặc mệnh đề, ví dụ and, but, because, although. Từ hạn định đứng trước danh từ, ví dụ a, the, some, this, my."},"examples":[[["She would like to go","IC"],["but","CONJ"],["she cannot","IC"]],[["Although","CONJ"],["he does not like camping","DC"],[",",""],["he goes to lots of music festivals","IC"]]],"exercise":{"type":"classify","prompt":{"en":"Choose: conjunction or determiner.","vi":"Chọn: liên từ hoặc từ hạn định."},"sample":"I stayed because it was late. (because) Answer: conjunction"}},{"id":"cl-aux-modal","tier":"B","src":"std","title":{"en":"Auxiliary and modal verbs","vi":"Trợ động từ và động từ khuyết thiếu"},"explain":{"en":"Auxiliary verbs (be, do, have) help form tenses, questions and negatives. Modal verbs (can, must, should, might) show ability, obligation or possibility and are followed by the base verb.","vi":"Trợ động từ (be, do, have) giúp tạo thì, câu hỏi và câu phủ định. Động từ khuyết thiếu (can, must, should, might) chỉ khả năng, nghĩa vụ hoặc khả năng xảy ra và đi với động từ nguyên mẫu."},"examples":[[["They","S"],["have","AUX"],["finished","V"]],[["She","S"],["can","MODAL"],["swim","V"]]],"exercise":{"type":"classify","prompt":{"en":"Choose: auxiliary or modal.","vi":"Chọn: trợ động từ hoặc động từ khuyết thiếu."},"sample":"You must wear a helmet. (must) Answer: modal"}},{"id":"cl-conversion","tier":"C","src":"std","title":{"en":"One word, different classes","vi":"Một từ, nhiều từ loại"},"explain":{"en":"Some words keep the same form but change class. The context tells you the class.","vi":"Một số từ giữ nguyên dạng nhưng đổi từ loại. Ngữ cảnh cho biết từ loại."},"examples":[[["Water","N"],["is essential.",""]],[["Please",""],["water","V"],["the plants.",""]]],"exercise":{"type":"classify","prompt":{"en":"Choose the word class in this sentence.","vi":"Chọn từ loại của từ trong câu này."},"sample":"We need to book a table. (book) Answer: verb"}},{"id":"cl-verb-pattern","tier":"C","src":"std","title":{"en":"Verb patterns: V ing or to V","vi":"Mẫu động từ: V ing hoặc to V"},"explain":{"en":"After some verbs we use the ing form. After others we use to and the base verb. A few verbs take both with a change in meaning.","vi":"Sau một số động từ ta dùng dạng ing. Sau số khác ta dùng to và động từ nguyên mẫu. Vài động từ dùng được cả hai nhưng nghĩa đổi."},"examples":[[["I","S"],["enjoy","V"],["reading","V ing"]],[["I","S"],["want","V"],["to read","to V"]]],"exercise":{"type":"fill","prompt":{"en":"Choose the correct form.","vi":"Chọn dạng đúng."},"sample":"She decided ___ abroad. Answer: to study"}}]},{"id":"words","en":"Word formation","vi":"Cấu tạo từ","topics":[{"id":"wf-endings","tier":"A","src":"std","title":{"en":"Endings: s, es, ed, ing","vi":"Đuôi từ: s, es, ed, ing"},"explain":{"en":"Add s or es for plural nouns and for he, she, it in the present simple. Add ed for regular past forms. Add ing for the continuous.","vi":"Thêm s hoặc es cho danh từ số nhiều và cho he, she, it ở thì hiện tại đơn. Thêm ed cho dạng quá khứ có quy tắc. Thêm ing cho thì tiếp diễn."},"examples":[[["cat","BASE"],["cats","s"]],[["watch","BASE"],["watches","es"]],[["walk","BASE"],["walked","ed"],["walking","ing"]]],"exercise":{"type":"fill","prompt":{"en":"Write the correct form.","vi":"Viết dạng đúng."},"sample":"She ___ (watch) TV every night. Answer: watches"}},{"id":"wf-ly","tier":"A","src":"bc-wf","title":{"en":"Adverbs with ly","vi":"Trạng từ với ly"},"explain":{"en":"Many adverbs are made by adding ly to an adjective.","vi":"Nhiều trạng từ được tạo bằng cách thêm ly vào tính từ."},"examples":[[["quick","ADJ"],["quickly","ADV"]],[["careful","ADJ"],["carefully","ADV"]]],"exercise":{"type":"fill","prompt":{"en":"Choose the adjective or the adverb.","vi":"Chọn tính từ hoặc trạng từ."},"sample":"He drives very ___. (careful) Answer: carefully"}},{"id":"wf-suffix","tier":"B","src":"bc-wf","title":{"en":"Suffixes by word class","vi":"Hậu tố theo từ loại"},"explain":{"en":"A suffix at the end of a word often shows its class. Nouns: ment, ion, ness, ity. Person nouns: er, or, ist, ian. Adjectives: able, ible, ive, al, ic. Verbs: ise, ate, en. Adverbs: ly.","vi":"Hậu tố ở cuối từ thường cho biết từ loại. Danh từ: ment, ion, ness, ity. Danh từ chỉ người: er, or, ist, ian. Tính từ: able, ible, ive, al, ic. Động từ: ise, ate, en. Trạng từ: ly."},"examples":[[["decide","V"],["decision","N"],["decisive","ADJ"]],[["sing","V"],["singer","N person"]]],"exercise":{"type":"fill","prompt":{"en":"Change the word to fit the gap.","vi":"Đổi dạng từ cho vừa chỗ trống."},"sample":"The ___ was very nervous. (sing) Answer: singer"}},{"id":"wf-prefix","tier":"B","src":"bc-wf","title":{"en":"Negative prefixes","vi":"Tiền tố phủ định"},"explain":{"en":"Prefixes un, im, in and dis make a word negative. The right prefix depends on the word, so learn them together.","vi":"Tiền tố un, im, in và dis làm từ mang nghĩa phủ định. Tiền tố đúng phụ thuộc vào từ, nên hãy học chúng cùng từ."},"examples":[[["happy","BASE"],["unhappy","un"]],[["polite","BASE"],["impolite","im"]],[["experienced","BASE"],["inexperienced","in"]],[["honest","BASE"],["dishonest","dis"]]],"exercise":{"type":"fill","prompt":{"en":"Choose the correct negative form.","vi":"Chọn dạng phủ định đúng."},"sample":"It is ___ to talk during a film. (polite) Answer: impolite"}},{"id":"wf-family","tier":"C","src":"bc-wf","title":{"en":"Word families across classes","vi":"Họ từ qua các từ loại"},"explain":{"en":"A word family groups words that share a root. Check the gap in the sentence to decide the class, then choose the form.","vi":"Họ từ gồm các từ có chung gốc. Hãy xem chỗ trống trong câu để xác định từ loại, rồi chọn dạng từ."},"examples":[[["decide","V"],["decision","N"],["decisive","ADJ"],["decisively","ADV"]],[["create","V"],["creation","N"],["creative","ADJ"],["creatively","ADV"]]],"exercise":{"type":"fill","prompt":{"en":"Choose the form that fits the gap.","vi":"Chọn dạng từ phù hợp với chỗ trống."},"sample":"She made a ___ choice. (decide) Answer: decisive"}},{"id":"wf-compound","tier":"C","src":"std","title":{"en":"Compound words","vi":"Từ ghép"},"explain":{"en":"Two words can join to make one new word. It may be written as one word, as two words, or with a hyphen, so check a dictionary.","vi":"Hai từ có thể ghép thành một từ mới. Từ ghép có thể viết liền, viết rời hoặc có gạch nối, nên cần tra từ điển."},"examples":[[["tooth","N"],["brush","N"],["toothbrush","COMPWORD"]],[["black","ADJ"],["board","N"],["blackboard","COMPWORD"]]],"exercise":{"type":"fill","prompt":{"en":"Join the two words.","vi":"Ghép hai từ."},"sample":"sun + flower. Answer: sunflower"}}]}],"sources":{"purdue":{"apa":"Purdue Online Writing Lab. (n.d.). Sentence types. Purdue University. https://owl.purdue.edu/owl/general_writing/academic_writing/sentence_variety/sentence_types.html","note":"Definitions and examples of the four sentence types come from this page."},"bc-clause":{"apa":"British Council. (n.d.). Clause structure and verb patterns. LearnEnglish. https://learnenglish.britishcouncil.org/grammar/english-grammar-reference/clause-structure-verb-patterns","note":"Subject, verb, object, complement, adverbial and dummy subjects."},"bc-relative":{"apa":"British Council. (n.d.). Relative pronouns and relative clauses. LearnEnglish. https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference/relative-pronouns-relative-clauses","note":"Defining and non defining clauses, omission of the pronoun."},"bc-conj":{"apa":"British Council. (n.d.). Conjunctions: and, or, but, so, because and although. LearnEnglish Teens. https://learnenglishteens.britishcouncil.org/grammar/a1-a2-grammar/conjunctions-or-so-because-although","note":"Uses and examples of common conjunctions."},"bc-emphasis":{"apa":"British Council. (n.d.). Emphasis: cleft sentences, inversion and auxiliaries. LearnEnglish. https://learnenglish.britishcouncil.org/free-resources/grammar/c1/emphasis-cleft-sentences-inversion-auxiliaries","note":"Cleft sentences and inversion after negative adverbials."},"bc-wf":{"apa":"British Council. (n.d.). Word formation. LearnEnglish Teens. https://learnenglishteens.britishcouncil.org/exams/grammar-vocabulary-exams/word-formation","note":"Suffix and prefix lists and the singer example."},"bc-adj":{"apa":"British Council. (n.d.). Adjectives. LearnEnglish. https://learnenglish.britishcouncil.org/grammar/english-grammar-reference/adjectives","note":"Definition of adjectives."},"test-english":{"apa":"Test English. (n.d.). Participle clauses. https://test-english.com/explanation/b2/participle-clauses/","note":"Participle clauses and the same subject rule. This is not a British Council page."},"std":{"apa":"","note":"Standard teaching grammar. I could not confirm this item on a page I fetched, so please check it."}}},"EX":{"el-sv":{"type":"label","prompt":{"en":"Tap the correct part of the sentence.","vi":"Chạm vào đúng phần của câu."},"items":[{"ask":"subject","chunks":["My teacher","smiled"],"answer":0},{"ask":"verb","chunks":["The children","laughed","loudly"],"answer":1},{"ask":"subject","chunks":["The old man","walks","every morning"],"answer":0},{"ask":"verb","chunks":["Birds","fly"],"answer":1}]},"el-svo":{"type":"build","prompt":{"en":"Put the parts in the correct order.","vi":"Sắp xếp các phần theo đúng thứ tự."},"items":[{"pieces":["My sister","loves","books."]},{"pieces":["The boy","kicked","the ball."]},{"pieces":["Students","read","many books."]}]},"el-svca":{"type":"label","prompt":{"en":"Tap the correct part of the sentence.","vi":"Chạm vào đúng phần của câu."},"items":[{"ask":"complement","chunks":["The room","felt","cold","at night"],"answer":2},{"ask":"adverbial","chunks":["She","lives","in Hue"],"answer":2},{"ask":"complement","chunks":["The soup","smells","delicious"],"answer":2},{"ask":"adverbial","chunks":["We","arrived","at noon"],"answer":2}]},"el-svoo":{"type":"label","prompt":{"en":"Tap the correct part of the sentence.","vi":"Chạm vào đúng phần của câu."},"items":[{"ask":"indirect object","chunks":["He","sent","his teacher","an email"],"answer":2},{"ask":"direct object","chunks":["She","gave","me","a book"],"answer":3},{"ask":"object complement","chunks":["They","made","him","captain"],"answer":3},{"ask":"indirect object","chunks":["Mai","showed","her mother","the photo"],"answer":2}]},"el-dummy":{"type":"choice","prompt":{"en":"Choose it or there.","vi":"Chọn it hoặc there."},"items":[{"q":"___ is raining.","options":["it","there"],"answer":0},{"q":"___ are three books on the desk.","options":["it","there"],"answer":1},{"q":"___ was late when we arrived.","options":["it","there"],"answer":0},{"q":"___ is a cafe near my house.","options":["it","there"],"answer":1}]},"el-clause-subject":{"type":"build","prompt":{"en":"Put the parts in the correct order.","vi":"Sắp xếp các phần theo đúng thứ tự."},"items":[{"pieces":["What he did","shocked","us."]},{"pieces":["Whether we win","does not","matter."]},{"pieces":["What she said","surprised","everyone."]},{"pieces":["That he left early","worried","his mother."]}]},"el-inversion":{"type":"build","prompt":{"en":"Put the parts in the correct order.","vi":"Sắp xếp các phần theo đúng thứ tự."},"items":[{"pieces":["Never","have I","seen","such a film."]},{"pieces":["Rarely","do we","eat","out."]},{"pieces":["Not only","did he forget","the keys,","but he also lost his phone."]}]},"ty-clause":{"type":"choice","prompt":{"en":"Choose: independent clause, dependent clause or phrase.","vi":"Chọn: mệnh đề độc lập, mệnh đề phụ thuộc hoặc cụm từ."},"items":[{"q":"[[I missed the bus]]","options":["independent clause","dependent clause","phrase"],"answer":0},{"q":"[[because I woke up late]]","options":["independent clause","dependent clause","phrase"],"answer":1},{"q":"[[after school]]","options":["independent clause","dependent clause","phrase"],"answer":2},{"q":"[[when the bell rang]]","options":["independent clause","dependent clause","phrase"],"answer":1},{"q":"[[The students laughed]]","options":["independent clause","dependent clause","phrase"],"answer":0}]},"ty-simple":{"type":"choice","prompt":{"en":"Does the sentence have only one clause?","vi":"Câu có đúng một mệnh đề không?"},"items":[{"q":"The cat slept on the sofa.","options":["oneClause","manyClauses"],"answer":0},{"q":"Tom and Mai sing and dance.","options":["oneClause","manyClauses"],"answer":0},{"q":"I was tired, so I went to bed.","options":["oneClause","manyClauses"],"answer":1},{"q":"My aunt enjoyed taking the hayride with you.","options":["oneClause","manyClauses"],"answer":0}]},"ty-compound":{"type":"choice","prompt":{"en":"Choose the conjunction that fits.","vi":"Chọn liên từ phù hợp."},"items":[{"q":"She was tired, ___ she kept working.","options":["but","so","because"],"answer":0},{"q":"It was raining, ___ we stayed inside.","options":["but","so","or"],"answer":1},{"q":"You can take the bus, ___ you can walk.","options":["and","so","or"],"answer":2},{"q":"He studied hard, ___ he passed the exam.","options":["and","but","or"],"answer":0}]},"ty-complex":{"type":"label","prompt":{"en":"Tap the dependent clause.","vi":"Chạm vào mệnh đề phụ thuộc."},"items":[{"ask":"dependent clause","chunks":["We stayed home","because it rained"],"answer":1},{"ask":"dependent clause","chunks":["Although he was tired","he finished the work"],"answer":0},{"ask":"dependent clause","chunks":["I will call you","when I arrive"],"answer":1},{"ask":"dependent clause","chunks":["If you study hard","you will pass"],"answer":0}]},"ty-relative":{"type":"choice","prompt":{"en":"Choose the correct relative pronoun.","vi":"Chọn đại từ quan hệ đúng."},"items":[{"q":"The woman ___ car was stolen called the police.","options":["who","which","whose"],"answer":2},{"q":"This is the book ___ I told you about.","options":["who","which","whose"],"answer":1},{"q":"The man ___ lives next door is a doctor.","options":["who","which","whose"],"answer":0},{"q":"Lord Thompson, ___ is 76, has just retired.","options":["who","that","which"],"answer":0}]},"ty-sorter":{"type":"choice","prompt":{"en":"Choose: simple, compound or complex.","vi":"Chọn: câu đơn, câu ghép hoặc câu phức."},"items":[{"q":"I missed the bus.","options":["simple","compound","complex"],"answer":0},{"q":"I missed the bus, and I walked to school.","options":["simple","compound","complex"],"answer":1},{"q":"When it rains, we stay inside.","options":["simple","compound","complex"],"answer":2},{"q":"She likes tea, but he likes coffee.","options":["simple","compound","complex"],"answer":1},{"q":"The students who study hard usually pass.","options":["simple","compound","complex"],"answer":2}]},"ty-compound-complex":{"type":"choice","prompt":{"en":"Choose the sentence type.","vi":"Chọn loại câu."},"items":[{"q":"Because it was late, we left, and they stayed.","options":["simple","compound","complex","compound complex"],"answer":3},{"q":"I called Nam, but he did not answer because his phone was off.","options":["simple","compound","complex","compound complex"],"answer":3},{"q":"She smiled.","options":["simple","compound","complex","compound complex"],"answer":0},{"q":"We stayed home because it rained.","options":["simple","compound","complex","compound complex"],"answer":2},{"q":"I like tea, and she likes coffee.","options":["simple","compound","complex","compound complex"],"answer":1}]},"ty-participle":{"type":"choice","prompt":{"en":"Choose the correct reduced sentence.","vi":"Chọn câu rút gọn đúng."},"items":[{"q":"The man who is standing by the door is my uncle.","options":["The man standing by the door is my uncle.","The man stood by the door is my uncle.","The man who standing by the door is my uncle."],"answer":0},{"q":"The books that were written by Orwell are famous.","options":["The books writing by Orwell are famous.","The books written by Orwell are famous.","The books wrote by Orwell are famous."],"answer":1},{"q":"The girl who is wearing a red dress is my cousin.","options":["The girl wore a red dress is my cousin.","The girl worn a red dress is my cousin.","The girl wearing a red dress is my cousin."],"answer":2}]},"ty-cleft":{"type":"build","prompt":{"en":"Put the parts in the correct order.","vi":"Sắp xếp các phần theo đúng thứ tự."},"items":[{"pieces":["It was","Sam","who","broke the window."]},{"pieces":["What I need","is","a long holiday."]},{"pieces":["It was","yesterday","that","we met."]},{"pieces":["What she wants","is","more time."]}]},"cl-basic":{"type":"choice","prompt":{"en":"Choose the word class of the underlined word.","vi":"Chọn từ loại của từ được gạch chân."},"items":[{"q":"They walked [[slowly]].","options":["noun","verb","adjective","adverb"],"answer":3},{"q":"The [[quick]] dog runs.","options":["noun","verb","adjective","adverb"],"answer":2},{"q":"She bought a new [[car]].","options":["noun","verb","adjective","adverb"],"answer":0},{"q":"Birds [[fly]] south.","options":["noun","verb","adjective","adverb"],"answer":1}]},"cl-pron-prep":{"type":"choice","prompt":{"en":"Choose: pronoun or preposition.","vi":"Chọn: đại từ hoặc giới từ."},"items":[{"q":"We met [[in]] the park.","options":["pronoun","preposition"],"answer":1},{"q":"[[She]] gave it to him.","options":["pronoun","preposition"],"answer":0},{"q":"The book is [[on]] the table.","options":["pronoun","preposition"],"answer":1},{"q":"I saw [[them]] yesterday.","options":["pronoun","preposition"],"answer":0}]},"cl-conj-det":{"type":"choice","prompt":{"en":"Choose: conjunction or determiner.","vi":"Chọn: liên từ hoặc từ hạn định."},"items":[{"q":"I stayed [[because]] it was late.","options":["conjunction","determiner"],"answer":0},{"q":"[[Some]] students were late.","options":["conjunction","determiner"],"answer":1},{"q":"She wanted to go, [[but]] she was ill.","options":["conjunction","determiner"],"answer":0},{"q":"[[My]] brother plays football.","options":["conjunction","determiner"],"answer":1}]},"cl-aux-modal":{"type":"choice","prompt":{"en":"Choose: auxiliary verb or modal verb.","vi":"Chọn: trợ động từ hoặc động từ khuyết thiếu."},"items":[{"q":"You [[must]] wear a helmet.","options":["auxiliary","modal"],"answer":1},{"q":"They [[have]] finished.","options":["auxiliary","modal"],"answer":0},{"q":"She [[can]] swim.","options":["auxiliary","modal"],"answer":1},{"q":"He [[does]] not like tea.","options":["auxiliary","modal"],"answer":0}]},"cl-conversion":{"type":"choice","prompt":{"en":"Choose the word class in this sentence.","vi":"Chọn từ loại của từ trong câu này."},"items":[{"q":"We need to [[book]] a table.","options":["noun","verb","adjective"],"answer":1},{"q":"I read a good [[book]].","options":["noun","verb","adjective"],"answer":0},{"q":"Please [[water]] the plants.","options":["noun","verb","adjective"],"answer":1},{"q":"[[Water]] is essential.","options":["noun","verb","adjective"],"answer":0},{"q":"The room is [[light]].","options":["noun","verb","adjective"],"answer":2}]},"cl-verb-pattern":{"type":"choice","prompt":{"en":"Choose the correct form.","vi":"Chọn dạng đúng."},"items":[{"q":"She decided ___ abroad.","options":["to study","studying"],"answer":0},{"q":"I enjoy ___ to music.","options":["listening","to listen"],"answer":0},{"q":"He wants ___ a doctor.","options":["to be","being"],"answer":0},{"q":"They finished ___ the report.","options":["writing","to write"],"answer":0}]},"wf-endings":{"type":"choice","prompt":{"en":"Choose the correct form.","vi":"Chọn dạng đúng."},"items":[{"q":"She ___ TV every night. (watch)","options":["watchs","watches","watching"],"answer":1},{"q":"They ___ to school yesterday. (walk)","options":["walk","walked","walking"],"answer":1},{"q":"Two ___ are on the table. (box)","options":["boxs","boxes","boxies"],"answer":1},{"q":"He is ___ now. (run)","options":["runing","running","runned"],"answer":1}]},"wf-ly":{"type":"choice","prompt":{"en":"Choose the adjective or the adverb.","vi":"Chọn tính từ hoặc trạng từ."},"items":[{"q":"He drives very ___. (careful)","options":["careful","carefully","carefulness"],"answer":1},{"q":"She speaks ___. (quick)","options":["quick","quickly","quickness"],"answer":1},{"q":"It was a ___ answer. (quick)","options":["quick","quickly","quickness"],"answer":0}]},"wf-suffix":{"type":"choice","prompt":{"en":"Change the word to fit the gap.","vi":"Đổi dạng từ cho vừa chỗ trống."},"items":[{"q":"The ___ was very nervous. (sing)","options":["singer","singist","singment"],"answer":0},{"q":"Her ___ surprised everyone. (decide)","options":["decision","decisive","decided"],"answer":0},{"q":"We need to ___ the system. (modern)","options":["modernise","modernment","modernly"],"answer":0},{"q":"He is a famous ___. (science)","options":["scientist","scientor","scienceer"],"answer":0}]},"wf-prefix":{"type":"choice","prompt":{"en":"Choose the correct negative form.","vi":"Chọn dạng phủ định đúng."},"items":[{"q":"It is ___ to talk during a film. (polite)","options":["unpolite","impolite","dispolite"],"answer":1},{"q":"She felt ___ about the test. (happy)","options":["unhappy","inhappy","imhappy"],"answer":0},{"q":"It was ___ to lie about it. (honest)","options":["unhonest","dishonest","inhonest"],"answer":1},{"q":"The new teacher was ___. (experienced)","options":["unexperienced","inexperienced","disexperienced"],"answer":1}]},"wf-family":{"type":"choice","prompt":{"en":"Choose the form that fits the gap.","vi":"Chọn dạng từ phù hợp với chỗ trống."},"items":[{"q":"She made a ___ choice. (decide)","options":["decide","decision","decisive","decisively"],"answer":2},{"q":"He answered ___. (decide)","options":["decide","decision","decisive","decisively"],"answer":3},{"q":"Her ___ was praised by the critics. (create)","options":["create","creation","creative","creatively"],"answer":1},{"q":"She is a very ___ writer. (create)","options":["create","creation","creative","creatively"],"answer":2}]},"wf-compound":{"type":"choice","prompt":{"en":"Choose the word made by joining the two words.","vi":"Chọn từ được tạo bằng cách ghép hai từ."},"items":[{"q":"sun + flower","options":["sunflower","flowersun","sunning"],"answer":0},{"q":"tooth + brush","options":["brushtooth","toothbrush","toothing"],"answer":1},{"q":"black + board","options":["boardblack","blackening","blackboard"],"answer":2},{"q":"book + shop","options":["bookshop","shopbook","booking"],"answer":0}]}}}</script>
<script id="ttData" type="application/json">{"DATA":[{"id":"present-simple","name":"Present simple","zone":"present","aspect":"simple","form":"subject + base verb (add s for he, she, it). Negative: do not or does not + base verb.","use":"Habits, facts and fixed schedules.","examples":["The class starts at 8 o'clock every morning.","Water boils at 100 degrees Celsius."],"signals":["always","usually","often","every day","never"],"mistake":{"wrong":"She go to class every day.","right":"She goes to class every day.","why":"With he, she or it, the present simple verb takes s."},"quiz":{"q":"My brother ___ coffee every morning.","options":["drinks","is drinking","drank"],"answer":0,"why":"A daily habit takes the present simple."}},{"id":"present-continuous","name":"Present continuous","zone":"present","aspect":"continuous","form":"am, is or are + verb with ing.","use":"Actions happening now, temporary situations, and arranged future plans.","examples":["The students are writing an essay now.","I am meeting my advisor on Friday."],"signals":["now","at the moment","today","this week","currently"],"mistake":{"wrong":"I am knowing the answer.","right":"I know the answer.","why":"Know is a stative verb, which is not normally used in the continuous."},"quiz":{"q":"Be quiet! The baby ___.","options":["sleeps","is sleeping","slept"],"answer":1,"why":"The action is happening at the moment of speaking."}},{"id":"present-perfect","name":"Present perfect","zone":"present","aspect":"perfect","form":"have or has + past participle.","use":"Life experience, recent actions with a result now, and situations that began in the past and continue now.","examples":["I have visited Da Nang twice.","She has lost her keys, so she cannot get in."],"signals":["ever","never","already","yet","just","so far","recently","for","since"],"mistake":{"wrong":"I have seen him yesterday.","right":"I saw him yesterday.","why":"Yesterday is a finished time, so English uses the past simple."},"quiz":{"q":"She ___ in Hanoi since 2020.","options":["lives","has lived","lived"],"answer":1,"why":"Since links a past start to now."}},{"id":"present-perfect-continuous","name":"Present perfect continuous","zone":"present","aspect":"perfectContinuous","form":"have or has + been + verb with ing.","use":"An activity that continues up to now, or a recent activity with a visible result. It stresses the activity and how long it lasted.","examples":["They have been studying for two hours.","It has been raining, so the ground is wet."],"signals":["for","since","how long","lately","recently","all day"],"mistake":{"wrong":"I am studying English since 2019.","right":"I have been studying English since 2019.","why":"An activity that started in the past and continues now, with since, takes the present perfect continuous."},"quiz":{"q":"Her eyes are red. She ___.","options":["cried","has been crying","will cry"],"answer":1,"why":"A recent activity explains the result we can see now."}},{"id":"past-simple","name":"Past simple","zone":"past","aspect":"simple","form":"subject + past form (ed for regular verbs, special forms for irregular verbs). Negative: did not + base verb.","use":"Finished actions at a finished time.","examples":["We finished the lesson ten minutes ago.","She went to Hue last summer."],"signals":["yesterday","last week","ago","in 2020","when I was a child"],"mistake":{"wrong":"She didn't went to class.","right":"She didn't go to class.","why":"After did not, the main verb stays in the base form."},"quiz":{"q":"They ___ the exam last Friday.","options":["take","took","have taken"],"answer":1,"why":"Last Friday is a finished time."}},{"id":"past-continuous","name":"Past continuous","zone":"past","aspect":"continuous","form":"was or were + verb with ing.","use":"An action in progress at a past moment, often as the background to a shorter action in the past simple.","examples":["I was cooking when the phone rang.","At 8 o'clock last night, we were watching a film."],"signals":["while","when","at that time","at 8 o'clock last night","all evening"],"mistake":{"wrong":"I watched TV when you called.","right":"I was watching TV when you called.","why":"The longer background action takes the past continuous. The interrupting action takes the past simple."},"quiz":{"q":"The students ___ when the fire alarm rang.","options":["study","were studying","have studied"],"answer":1,"why":"The studying was in progress when the alarm interrupted it."}},{"id":"past-perfect","name":"Past perfect","zone":"past","aspect":"perfect","form":"had + past participle.","use":"An action that was completed before another moment or event in the past.","examples":["When I arrived, the lesson had already started.","She had never seen snow before 2019."],"signals":["before","after","by the time","already","just","never before"],"mistake":{"wrong":"When we arrived, the film already started.","right":"When we arrived, the film had already started.","why":"The film started first, so the earlier action takes the past perfect."},"quiz":{"q":"By the time she called, I ___ home.","options":["left","had left","was leaving"],"answer":1,"why":"Leaving happened before the call, so it is the earlier past action."}},{"id":"past-perfect-continuous","name":"Past perfect continuous","zone":"past","aspect":"perfectContinuous","form":"had + been + verb with ing.","use":"An activity that continued up to a moment in the past. It stresses how long the activity lasted.","examples":["He had been waiting for an hour when the bus came.","Her hands were dirty because she had been gardening."],"signals":["for","since","how long","before","until then","by the time"],"mistake":{"wrong":"They were waiting for two hours before the teacher arrived.","right":"They had been waiting for two hours before the teacher arrived.","why":"The duration lasted up to a past moment, so use the past perfect continuous."},"quiz":{"q":"When I met him in 2020, he ___ English for five years.","options":["studied","had been studying","has been studying"],"answer":1,"why":"The studying lasted up to a past moment, 2020."}},{"id":"future-simple","name":"Future simple","zone":"future","aspect":"simple","form":"will + base verb.","use":"Spontaneous decisions, predictions and promises. For plans made before speaking, English often uses be going to instead.","examples":["I think it will rain tomorrow.","I'll help you with your homework."],"signals":["tomorrow","next week","soon","I think","probably","in 2030"],"mistake":{"wrong":"If it will rain tomorrow, we will stay home.","right":"If it rains tomorrow, we will stay home.","why":"After if, when, before and unless, English uses the present simple for the future."},"quiz":{"q":"The phone is ringing. I ___ it.","options":["answered","will answer","have answered"],"answer":1,"why":"A decision made at the moment of speaking takes will."}},{"id":"future-continuous","name":"Future continuous","zone":"future","aspect":"continuous","form":"will + be + verb with ing.","use":"An action that will be in progress at a certain moment in the future.","examples":["This time tomorrow, I will be flying to Seoul.","Next week we will be taking the final exam."],"signals":["this time tomorrow","at 8 o'clock tonight","next week"],"mistake":{"wrong":"This time next week, I will lie on the beach.","right":"This time next week, I will be lying on the beach.","why":"An action in progress at a future moment takes the future continuous."},"quiz":{"q":"Don't call me at 7 tonight. I ___ dinner.","options":["had","will be having","have had"],"answer":1,"why":"Dinner will be in progress at 7."}},{"id":"future-perfect","name":"Future perfect","zone":"future","aspect":"perfect","form":"will + have + past participle.","use":"An action that will be completed before a certain point in the future.","examples":["By Friday, I will have finished the report.","By 2030, she will have worked here for ten years."],"signals":["by","by the time","by next week","before"],"mistake":{"wrong":"By next year, I will study English for ten years.","right":"By next year, I will have studied English for ten years.","why":"A total that is complete by a future point takes the future perfect."},"quiz":{"q":"By the time you wake up, I ___ the house.","options":["leave","will have left","am leaving"],"answer":1,"why":"Leaving will be finished before the future moment."}},{"id":"future-perfect-continuous","name":"Future perfect continuous","zone":"future","aspect":"perfectContinuous","form":"will + have + been + verb with ing.","use":"An activity that will have lasted a certain time by a point in the future. It stresses the duration.","examples":["By June, I will have been teaching for five years.","In March, they will have been living here for a decade."],"signals":["by","by the time","for","in March"],"mistake":{"wrong":"By June, I will be teaching for five years.","right":"By June, I will have been teaching for five years.","why":"Duration up to a future point takes the future perfect continuous."},"quiz":{"q":"By 5 pm, she ___ for six hours.","options":["will study","will have been studying","studies"],"answer":1,"why":"The studying will have lasted six hours by 5 pm."}}],"REL":[{"a":"present-perfect","b":"past-simple","type":"confused","note":"Use the past simple for a finished time, such as yesterday or in 2020. Use the present perfect when the time is not given or still connects to now."},{"a":"present-simple","b":"present-continuous","type":"confused","note":"Use the present simple for habits and facts. Use the present continuous for what is happening now or is temporary."},{"a":"past-simple","b":"past-continuous","type":"confused","note":"Use the past simple for a finished event. Use the past continuous for the action in progress around it."},{"a":"future-simple","b":"future-continuous","type":"confused","note":"Use the future simple for a decision, prediction or promise. Use the future continuous for an action in progress at a future moment."},{"a":"present-perfect","b":"present-perfect-continuous","type":"confused","note":"Use the present perfect for the result or the number done. Use the present perfect continuous for the activity and how long it lasted."},{"a":"past-perfect","b":"past-perfect-continuous","type":"confused","note":"Use the past perfect for an action completed before a past moment. Use the past perfect continuous for an activity that lasted up to that moment."},{"a":"future-perfect","b":"future-perfect-continuous","type":"confused","note":"Use the future perfect for an action finished by a future point. Use the future perfect continuous for how long an activity will have lasted by then."},{"a":"past-perfect","b":"past-simple","type":"order","directed":true,"note":"The past perfect action happened first. The past simple action came after it. When I arrived, the lesson had already started."},{"a":"past-perfect-continuous","b":"past-simple","type":"order","directed":true,"note":"The activity went on up to a later past event. He had been waiting for an hour when the bus came."},{"a":"future-perfect","b":"present-simple","type":"order","directed":true,"note":"The future perfect action will be finished before a later moment. A time clause with by the time takes the present simple. By the time you wake up, I will have left."},{"a":"past-simple","b":"present-simple","type":"aspect","note":"Same aspect, different time. The past form changes to the base form (add s for he, she or it)."},{"a":"present-simple","b":"future-simple","type":"aspect","note":"Same aspect, different time. The future adds will before the base verb."},{"a":"past-continuous","b":"present-continuous","type":"aspect","note":"Same aspect, different time. Was or were becomes am, is or are."},{"a":"present-continuous","b":"future-continuous","type":"aspect","note":"Same aspect, different time. Am, is or are becomes will be."},{"a":"past-perfect","b":"present-perfect","type":"aspect","note":"Same aspect, different time. Had becomes have or has."},{"a":"present-perfect","b":"future-perfect","type":"aspect","note":"Same aspect, different time. Have or has becomes will have."},{"a":"past-perfect-continuous","b":"present-perfect-continuous","type":"aspect","note":"Same aspect, different time. Had been becomes have been or has been."},{"a":"present-perfect-continuous","b":"future-perfect-continuous","type":"aspect","note":"Same aspect, different time. Have been or has been becomes will have been."},{"a":"present-simple","b":"present-continuous","type":"build","directed":true,"note":"Add am, is or are before the verb and add ing to the verb."},{"a":"past-simple","b":"past-continuous","type":"build","directed":true,"note":"Add was or were before the verb and add ing to the verb."},{"a":"future-simple","b":"future-continuous","type":"build","directed":true,"note":"Add be after will and add ing to the verb."},{"a":"present-perfect","b":"present-perfect-continuous","type":"build","directed":true,"note":"Add been after have or has and add ing to the verb."},{"a":"past-perfect","b":"past-perfect-continuous","type":"build","directed":true,"note":"Add been after had and add ing to the verb."},{"a":"future-perfect","b":"future-perfect-continuous","type":"build","directed":true,"note":"Add been after will have and add ing to the verb."}],"VI":{"tenses":{"present-simple":{"name":"Hiện tại đơn","form":"chủ ngữ + động từ nguyên mẫu (thêm s với he, she, it). Phủ định: do not hoặc does not + động từ nguyên mẫu.","use":"Thói quen, sự thật và lịch trình cố định.","mistakeWhy":"Với he, she hoặc it, động từ ở thì hiện tại đơn thêm s.","quizWhy":"Thói quen hằng ngày dùng thì hiện tại đơn."},"present-continuous":{"name":"Hiện tại tiếp diễn","form":"am, is hoặc are + động từ thêm ing.","use":"Hành động đang diễn ra lúc này, tình huống tạm thời và kế hoạch đã sắp xếp cho tương lai.","mistakeWhy":"Know là động từ trạng thái (stative verb), thường không dùng ở dạng tiếp diễn.","quizWhy":"Hành động đang diễn ra ngay lúc nói."},"present-perfect":{"name":"Hiện tại hoàn thành","form":"have hoặc has + quá khứ phân từ.","use":"Kinh nghiệm sống, hành động vừa xảy ra có kết quả ở hiện tại, và tình huống bắt đầu trong quá khứ và còn tiếp tục đến nay.","mistakeWhy":"Yesterday là thời gian đã kết thúc, nên tiếng Anh dùng thì quá khứ đơn.","quizWhy":"Since nối điểm bắt đầu trong quá khứ với hiện tại."},"present-perfect-continuous":{"name":"Hiện tại hoàn thành tiếp diễn","form":"have hoặc has + been + động từ thêm ing.","use":"Hoạt động kéo dài đến hiện tại, hoặc hoạt động vừa xảy ra có kết quả nhìn thấy được. Thì này nhấn mạnh hoạt động và khoảng thời gian kéo dài.","mistakeWhy":"Hoạt động bắt đầu trong quá khứ và còn tiếp tục đến nay, đi với since, dùng thì hiện tại hoàn thành tiếp diễn.","quizWhy":"Hoạt động vừa xảy ra giải thích kết quả ta thấy bây giờ."},"past-simple":{"name":"Quá khứ đơn","form":"chủ ngữ + động từ dạng quá khứ (thêm ed với động từ có quy tắc, dạng đặc biệt với động từ bất quy tắc). Phủ định: did not + động từ nguyên mẫu.","use":"Hành động đã kết thúc tại một thời điểm đã qua.","mistakeWhy":"Sau did not, động từ chính giữ nguyên mẫu.","quizWhy":"Last Friday là thời gian đã kết thúc."},"past-continuous":{"name":"Quá khứ tiếp diễn","form":"was hoặc were + động từ thêm ing.","use":"Hành động đang diễn ra tại một thời điểm trong quá khứ, thường làm bối cảnh cho một hành động ngắn hơn ở thì quá khứ đơn.","mistakeWhy":"Hành động nền kéo dài hơn dùng thì quá khứ tiếp diễn. Hành động xen vào dùng thì quá khứ đơn.","quizWhy":"Việc học đang diễn ra thì chuông báo cháy cắt ngang."},"past-perfect":{"name":"Quá khứ hoàn thành","form":"had + quá khứ phân từ.","use":"Hành động đã hoàn tất trước một thời điểm hoặc sự kiện khác trong quá khứ.","mistakeWhy":"Bộ phim bắt đầu trước, nên hành động xảy ra trước dùng thì quá khứ hoàn thành.","quizWhy":"Việc rời đi xảy ra trước cuộc gọi, nên đó là hành động quá khứ xảy ra trước."},"past-perfect-continuous":{"name":"Quá khứ hoàn thành tiếp diễn","form":"had + been + động từ thêm ing.","use":"Hoạt động kéo dài đến một thời điểm trong quá khứ. Thì này nhấn mạnh hoạt động đó kéo dài bao lâu.","mistakeWhy":"Khoảng thời gian kéo dài đến một thời điểm trong quá khứ, nên dùng thì quá khứ hoàn thành tiếp diễn.","quizWhy":"Việc học kéo dài đến một thời điểm trong quá khứ, năm 2020."},"future-simple":{"name":"Tương lai đơn","form":"will + động từ nguyên mẫu.","use":"Quyết định tức thời, dự đoán và lời hứa. Với kế hoạch đã có trước khi nói, tiếng Anh thường dùng be going to.","mistakeWhy":"Sau if, when, before và unless, tiếng Anh dùng thì hiện tại đơn cho tương lai.","quizWhy":"Quyết định đưa ra ngay lúc nói dùng will."},"future-continuous":{"name":"Tương lai tiếp diễn","form":"will + be + động từ thêm ing.","use":"Hành động sẽ đang diễn ra tại một thời điểm nhất định trong tương lai.","mistakeWhy":"Hành động đang diễn ra tại một thời điểm tương lai dùng thì tương lai tiếp diễn.","quizWhy":"Bữa tối sẽ đang diễn ra lúc 7 giờ."},"future-perfect":{"name":"Tương lai hoàn thành","form":"will + have + quá khứ phân từ.","use":"Hành động sẽ hoàn tất trước một thời điểm nhất định trong tương lai.","mistakeWhy":"Tổng thời gian đã hoàn thành tính đến một thời điểm tương lai dùng thì tương lai hoàn thành.","quizWhy":"Việc rời đi sẽ hoàn tất trước thời điểm trong tương lai."},"future-perfect-continuous":{"name":"Tương lai hoàn thành tiếp diễn","form":"will + have + been + động từ thêm ing.","use":"Hoạt động sẽ kéo dài được một khoảng thời gian nhất định tính đến một thời điểm trong tương lai. Thì này nhấn mạnh khoảng thời gian.","mistakeWhy":"Khoảng thời gian kéo dài đến một thời điểm tương lai dùng thì tương lai hoàn thành tiếp diễn.","quizWhy":"Việc học sẽ kéo dài sáu giờ tính đến 5 giờ chiều."}},"rels":["Dùng quá khứ đơn cho thời gian đã kết thúc, như yesterday hoặc in 2020. Dùng hiện tại hoàn thành khi không nêu thời gian hoặc sự việc còn liên quan đến hiện tại.","Dùng hiện tại đơn cho thói quen và sự thật. Dùng hiện tại tiếp diễn cho việc đang diễn ra lúc này hoặc mang tính tạm thời.","Dùng quá khứ đơn cho sự kiện đã kết thúc. Dùng quá khứ tiếp diễn cho hành động đang diễn ra xung quanh sự kiện đó.","Dùng tương lai đơn cho quyết định, dự đoán hoặc lời hứa. Dùng tương lai tiếp diễn cho hành động đang diễn ra tại một thời điểm trong tương lai.","Dùng hiện tại hoàn thành cho kết quả hoặc số lượng đã làm. Dùng hiện tại hoàn thành tiếp diễn cho hoạt động và khoảng thời gian nó kéo dài.","Dùng quá khứ hoàn thành cho hành động hoàn tất trước một thời điểm trong quá khứ. Dùng quá khứ hoàn thành tiếp diễn cho hoạt động kéo dài đến thời điểm đó.","Dùng tương lai hoàn thành cho hành động xong trước một thời điểm trong tương lai. Dùng tương lai hoàn thành tiếp diễn cho việc hoạt động đã kéo dài bao lâu tính đến lúc đó.","Hành động ở quá khứ hoàn thành xảy ra trước. Hành động ở quá khứ đơn xảy ra sau. When I arrived, the lesson had already started.","Hoạt động kéo dài đến một sự kiện quá khứ xảy ra sau. He had been waiting for an hour when the bus came.","Hành động ở tương lai hoàn thành sẽ xong trước một thời điểm sau đó. Mệnh đề thời gian với by the time dùng hiện tại đơn. By the time you wake up, I will have left.","Cùng dạng, khác thời. Dạng quá khứ chuyển thành dạng nguyên mẫu (thêm s với he, she hoặc it).","Cùng dạng, khác thời. Tương lai thêm will trước động từ nguyên mẫu.","Cùng dạng, khác thời. Was hoặc were chuyển thành am, is hoặc are.","Cùng dạng, khác thời. Am, is hoặc are chuyển thành will be.","Cùng dạng, khác thời. Had chuyển thành have hoặc has.","Cùng dạng, khác thời. Have hoặc has chuyển thành will have.","Cùng dạng, khác thời. Had been chuyển thành have been hoặc has been.","Cùng dạng, khác thời. Have been hoặc has been chuyển thành will have been.","Thêm am, is hoặc are trước động từ và thêm ing vào động từ.","Thêm was hoặc were trước động từ và thêm ing vào động từ.","Thêm be sau will và thêm ing vào động từ.","Thêm been sau have hoặc has và thêm ing vào động từ.","Thêm been sau had và thêm ing vào động từ.","Thêm been sau will have và thêm ing vào động từ."]}}</script>

// 12x11 pose -> 24x22: upscale, chamfer the silhouette, round + sparkle the eyes, blush, round beak, belly
function hires(fr, mad) {
  const g = []; fr.forEach(r => { const row = r.split('').map(ch => ch + ch); g.push(row, row.slice()); });
  const s = g.map(r => r.map(ch => (EYE.includes(ch) ? 'E' : ch)));
  const sa = (r, c) => (s[r] && s[r][c]) || '.';
  const H = g.length, W = g[0].length;
  const seen = {}; const groups = [];
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) if (s[r][c] === 'E' && !seen[r + ',' + c]) {
    const st = [[r, c]]; seen[r + ',' + c] = 1; const cells = [];
    while (st.length) { const [y, x] = st.pop(); cells.push([y, x]); [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dy, dx]) => { const k = (y + dy) + ',' + (x + dx); if (sa(y + dy, x + dx) === 'E' && !seen[k]) { seen[k] = 1; st.push([y + dy, x + dx]); } }); }
    const ys = cells.map(a => a[0]), xs = cells.map(a => a[1]);
    groups.push({ cells, top: Math.min(...ys), bot: Math.max(...ys), left: Math.min(...xs), right: Math.max(...xs) });
  }
  const out = s.map(r => r.slice());
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) if (s[r][c] === 'X') {
    const u = sa(r - 1, c) === '.', d = sa(r + 1, c) === '.', l = sa(r, c - 1) === '.', rt = sa(r, c + 1) === '.';
    if ((u && l) || (u && rt) || (d && l) || (d && rt)) out[r][c] = '.';
  }
  groups.forEach(o => {
    const big = o.bot - o.top >= 3;
    o.cells.forEach(([r, c]) => {
      const u = sa(r - 1, c) !== 'E', d = sa(r + 1, c) !== 'E', l = sa(r, c - 1) !== 'E', rt = sa(r, c + 1) !== 'E';
      if (big && ((u && l) || (u && rt) || (d && l) || (d && rt))) out[r][c] = 'X';
      else out[r][c] = d ? 'N' : 'E';
    });
    if (big) {
      out[o.top + 1][o.left + 1] = 'K';
      if (!mad) [[o.bot - 1, o.left - 3], [o.bot - 1, o.left - 2], [o.bot, o.left - 3], [o.bot, o.left - 2], [o.bot - 1, o.right + 2], [o.bot - 1, o.right + 3], [o.bot, o.right + 2], [o.bot, o.right + 3]].forEach(([r, c]) => { if (out[r] && out[r][c] === 'X') out[r][c] = 'P'; });
    }
  });
  for (let r = 0; r < H - 1; r++) for (let c = 1; c < W - 3; c++) {
    if (s[r][c] === 'A' && s[r][c + 1] === 'A' && s[r][c + 2] === 'A' && s[r][c + 3] === 'A' && s[r][c - 1] === 'X' && s[r][c + 4] === 'X' && s[r + 1][c] === 'A' && sa(r + 2, c) === 'X') { out[r + 1][c] = 'X'; out[r + 1][c + 3] = 'X'; }
  }
  if (!mad) [[16, 9, 14], [17, 8, 15], [18, 8, 15], [19, 9, 14]].forEach(([r, a, b]) => { for (let c = a; c <= b; c++) if (out[r] && out[r][c] === 'X') out[r][c] = 'B'; });
  return out.map(r => r.join(''));
}

function makeOwl(host, size, opts){
  // drawn on one <canvas> instead of 528 grid cells: far fewer page elements, same pixels
  opts = opts || {};
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const probe = document.createElement("span"); host.replaceChildren(probe);
  const resolve = v => { probe.style.color = ""; probe.style.color = v; return getComputedStyle(probe).color; };
  const C = {body:resolve("var(--coral)"), accent:resolve("var(--amber)"), detail:resolve("var(--ink)"), belly:resolve("color-mix(in oklch, var(--coral), white 38%)"), blush:resolve("oklch(0.8 0.1 18)")};
  if (!C.belly || C.belly==="rgba(0, 0, 0, 0)") C.belly = "#ebb4a1";
  const dpr = Math.min(3, window.devicePixelRatio || 1), px = size/24;
  const root = document.createElement("canvas");
  root.width = Math.round(size*dpr); root.height = Math.round(px*22*dpr);
  root.setAttribute("role","img"); root.setAttribute("aria-label", opts.label || "Chiioo the owl");
  root.className = "owl";
  root.style.cssText = `display:block;width:${size}px;height:${px*22}px;--pxc:${size/12}px;flex:none;cursor:pointer;image-rendering:pixelated`;
  host.replaceChildren(root);
  const ctx = root.getContext("2d"), cell = root.width/24;
  let pose = opts.pose || "default", frame = 0, closed = false, flap = false, frameT = null, lastKey = "", onScreen = true;
  const cache = {};
  const framesFor = p => cache[p] || (cache[p] = ((POSES[p].frames) || [POSES[p].grid]).map(fr => hires(keepWings(fr, fr.slice()), false).join("")));
  function colour(ch){
    if (ch==="X"||ch==="L"||ch==="R") return C.body;
    if (ch==="A"||ch==="S") return C.accent;
    if (ch==="G") return C.detail;
    if (ch==="B") return C.belly;
    if (ch==="P") return C.blush;
    if (ch==="W") return flap ? null : C.body;
    if (ch==="U") return flap ? C.body : null;
    if ("abcde".includes(ch)) return closed ? C.body : null;
    return null;
  }
  function paint(){
    const fr = framesFor(pose), grid = fr[frame % fr.length];
    const key = pose+"|"+(frame % fr.length)+"|"+closed+"|"+flap;
    if (key === lastKey) return; lastKey = key;   // nothing changed, skip drawing
    ctx.clearRect(0,0,root.width,root.height);
    for (let i=0;i<grid.length;i++){ const c = colour(grid[i]); if (!c) continue;
      ctx.fillStyle = c; const x=i%24, y=(i/24)|0;
      ctx.fillRect(Math.floor(x*cell), Math.floor(y*cell), Math.ceil(cell), Math.ceil(cell)); }
    const an = reduced ? "none" : `owl-bob ${POSES[pose].bob||2.4}s steps(2,jump-none) infinite`; if (root.dataset.an !== an){ root.style.animation = an; root.dataset.an = an; }
  }
  const tick = fn => () => { if (onScreen && !document.hidden) fn(); };   // no work while hidden or off screen
  if ("IntersectionObserver" in window) new IntersectionObserver(es => es.forEach(e => { onScreen = e.isIntersecting; })).observe(root);
  function setPose(p){
    if (!POSES[p]) p = "default"; pose = p; frame = 0; clearInterval(frameT);
    const P = POSES[p]; if (P.frames && !reduced) frameT = setInterval(tick(()=>{ frame++; paint(); }), P.ms || 320);
    paint();
  }
  if (!reduced){
    setInterval(tick(()=>{ if (!POSES[pose].blink) return; closed = true; paint(); setTimeout(()=>{ closed=false; paint(); }, 160); }), 3800);
  }
  function flapBurst(n){ if (reduced) return; let k=0; const t=setInterval(()=>{ flap=!flap; paint(); if(++k>=n){ clearInterval(t); flap=false; paint(); } }, 110); }
  root.addEventListener("click", ()=>{ flapBurst(6); if (!reduced) root.animate([{transform:"translateY(0)"},{transform:`translateY(-${size/8}px)`},{transform:"translateY(0)"}],{duration:260}); });
  setPose(pose);
  return { setPose, flapBurst, el: root };
}

  for (const d of ORDER) if (state.tt.quiz[d.id]===0) out.push(["tt",d.id]);

  const lists = {ss:ssOrdered().map(t=>t.id), tt:ORDER.map(d=>d.id)};

    const start = state.last && state.last.tool===tool ? Math.max(0, list.indexOf(state.last.id)) : 0;

}

function ctInit(){

  function parseTopics(text){

/* keep the reader's place when a language switch rebuilds the page */
function placeOf(sel){ const bar=document.querySelector(".sitebar"), b0=bar?bar.offsetHeight:0, off=b0+Math.min(100,(innerHeight-b0)*0.3), list=[...document.querySelectorAll(sel)];
  if (scrollY<40) return null; let i=-1;
  list.forEach((n,k)=>{ const r=n.getBoundingClientRect(); if (r.top<=off && r.bottom>off) i=k; });
  if (i<0) i=list.findIndex(n=>n.getBoundingClientRect().top>off); if (i<0) return null;
  const top=list[i].getBoundingClientRect().top; return top<innerHeight*0.6 ? {sel, i, top} : null; }
function keepPlace(a){ if (!a) return; const n=document.querySelectorAll(a.sel)[a.i]; if (n) window.scrollTo({top:scrollY + n.getBoundingClientRect().top - a.top, behavior:"instant"}); }
function holdPlace(ms){ // after a rebuild, sections settle to their real height over the next frames; keep the reading line still meanwhile
  const bar=document.querySelector(".sitebar"), b0=bar?bar.offsetHeight:0, ref=scrollY>40 ? document.elementFromPoint(innerWidth/2, b0+Math.min(100,(innerHeight-b0)*0.3)) : null;
  if (!ref || ref===document.documentElement || ref===document.body) return;
  const t=ref.getBoundingClientRect().top, root=document.documentElement; root.style.overflowAnchor="none";
  const stop=()=>{ ro.disconnect(); root.style.overflowAnchor=""; ["wheel","touchstart","keydown","pointerdown"].forEach(e=>removeEventListener(e, stop, true)); };
  const ro=new ResizeObserver(()=>{ if (!ref.isConnected) return stop(); const d=ref.getBoundingClientRect().top-t; if (Math.abs(d)>0.5) window.scrollTo({top:scrollY+d, behavior:"instant"}); });
  ro.observe(document.body); ["wheel","touchstart","keydown","pointerdown"].forEach(e=>addEventListener(e, stop, {capture:true, passive:true})); setTimeout(stop, ms||900);
}

const navT = document.getElementById("navToggle"), navL = document.getElementById("navList"), topBar = document.querySelector(".top");
function syncNavH(){ if (topBar && topBar.classList.contains("sitebar")) document.documentElement.style.setProperty("--navh", topBar.offsetHeight+"px"); }
function setNav(open){ if (!navT) return; navL.classList.toggle("open", open); navT.setAttribute("aria-expanded", String(open)); navT.setAttribute("aria-label", open ? L().navClose : L().navMenu); navT.textContent = open ? "×" : "☰"; if (open) rise(navL,0,-6,200); }
if (navT){
  navT.onclick = () => setNav(!navL.classList.contains("open"));
  navL.addEventListener("click", e => { if (e.target.closest("a")) setNav(false); });
  document.addEventListener("keydown", e => { if (e.key==="Escape" && navL.classList.contains("open")){ setNav(false); navT.focus(); } });
  document.addEventListener("click", e => { if (navL.classList.contains("open") && !e.target.closest(".sitebar")) setNav(false); });
  addEventListener("resize", syncNavH); syncNavH(); setNav(false);
}
