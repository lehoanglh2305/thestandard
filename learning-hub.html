<style>
/* Chiioo lesson design system: one deliberate cream look */
:root{
  --coral:#d97757; --coral-active:#c6613f; --coral-text:#b65436; --teal:#5db8a6; --amber:#e8a55a;
  --ink:#141413; --body-strong:#252523; --body:#3d3d3a; --muted:#6c6a64; --muted-soft:#87867f;
  --canvas:#f0eee6; --surface-soft:#f5e3c7; --surface-card:#faf9f5; --cream-strong:#e3dacc;
  --hairline:#cccbc8; --hairline-soft:#e3dacc;
  --dark:#141413; --dark-elevated:#3d3d3a; --dark-soft:#1f1e1c; --on-dark:#faf9f5; --on-dark-soft:#b0aea5;
  --success:#5db872; --error:#c64545;
  --on-primary:#faf9f5; --panel:#141413; --on-panel:#faf9f5; --on-panel-soft:#b0aea5;
  --btn-dk:#3d3d3a; --btn-dk-soft:#1f1e1c; --ok-text:#3c8a4f; --err-text:#c64545;
  --formula-soft:rgba(20,20,19,.06); --backdrop:rgba(20,20,19,.55);
  --serif:"Copernicus","Source Serif 4","Tiempos Headline",Garamond,"Times New Roman",serif;
  --sans:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.2,0,0,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ink:#faf9f5; --body-strong:#e8e6df; --body:#cfccc3; --muted:#a09d96; --muted-soft:#8e8b82;
  --canvas:#141413; --surface-soft:#2d2620; --surface-card:#1f1e1c; --cream-strong:#33312d;
  --hairline:#4a4843; --hairline-soft:#33312d; --coral-text:#e8906f;
  --panel:#262420; --btn-dk:#3d3a36; --btn-dk-soft:#2b2926; --ok-text:#7fcf92; --err-text:#ee7d7d;
  --formula-soft:rgba(250,249,245,.07); --backdrop:rgba(0,0,0,.65);
  color-scheme:dark;
} }
:root[data-theme="dark"]{
  --ink:#faf9f5; --body-strong:#e8e6df; --body:#cfccc3; --muted:#a09d96; --muted-soft:#8e8b82;
  --canvas:#141413; --surface-soft:#2d2620; --surface-card:#1f1e1c; --cream-strong:#33312d;
  --hairline:#4a4843; --hairline-soft:#33312d; --coral-text:#e8906f;
  --panel:#262420; --btn-dk:#3d3a36; --btn-dk-soft:#2b2926; --ok-text:#7fcf92; --err-text:#ee7d7d;
  --formula-soft:rgba(250,249,245,.07); --backdrop:rgba(0,0,0,.65);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--canvas); color:var(--body); transition:background 200ms var(--ease); font-family:var(--sans); font-size:16px; line-height:1.55; margin:0; -webkit-font-smoothing:antialiased}
.wrap{max-width:1200px; margin:0 auto; padding-inline:clamp(16px,4vw,48px); padding-block:20px 72px}
h1,h2,h3,h4{font-family:var(--serif); font-weight:400; color:var(--ink); text-wrap:balance; margin:0}
p{text-wrap:pretty; margin:0}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:none; box-shadow:0 0 0 3px rgba(217,119,87,.35); border-radius:8px}
.eyebrow{font:500 12px/1.4 var(--sans); letter-spacing:1.5px; text-transform:uppercase; color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.coral{color:var(--coral-text)}

/* buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; height:40px; padding:0 18px; border-radius:0 0 8px 8px; border:1px solid var(--coral); background:var(--coral); color:var(--on-primary); font:500 14px/1 var(--sans); white-space:nowrap; transition:background 120ms var(--ease)}
.btn:active{background:var(--coral-active); border-color:var(--coral-active)}
.btn.sec{background:var(--canvas); color:var(--ink); border-color:var(--hairline); border-radius:12px}
.btn.sec:active{background:var(--surface-soft)}
.btn.dk{background:var(--btn-dk); border-color:var(--btn-dk); color:var(--on-panel); border-radius:12px}
.btn.dk:active{background:var(--btn-dk-soft)}
.btn.txt{background:transparent; border-color:transparent; color:var(--ink); padding:0 6px}
.btn:disabled{background:var(--cream-strong); border-color:var(--cream-strong); color:var(--muted); cursor:not-allowed}
.btn.dk:disabled{background:var(--btn-dk-soft); border-color:var(--btn-dk-soft); color:var(--muted-soft)}

/* top bar */
.top{display:flex; align-items:center; justify-content:space-between; gap:16px; padding-bottom:20px; border-bottom:1px solid var(--hairline-soft)}
.mark{font:400 26px/1 var(--serif); letter-spacing:-.4px; color:var(--ink); white-space:nowrap}
@media (max-width:360px){.mark{font-size:20px}.themeb{padding:8px 10px}.lang button{padding:6px 10px}.top{gap:8px}}
.mark b{color:var(--coral); font-weight:400}
.lang{display:inline-flex; background:var(--cream-strong); border-radius:9999px; padding:3px}
.lang button{border:0; background:transparent; border-radius:9999px; padding:6px 14px; font:500 13px/1 var(--sans); color:var(--muted); letter-spacing:.5px}
.lang button[aria-pressed="true"]{background:var(--surface-card); color:var(--ink)}
.themeb{display:inline-flex; align-items:center; gap:6px; border:0; background:var(--cream-strong); color:var(--ink); border-radius:9999px; padding:8px 14px; font:500 13px/1 var(--sans)}
.themeb svg{width:14px; height:14px}

/* hero */
.hero{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:24px 48px; align-items:center; padding-block:48px 32px}
.hero h1{font-size:clamp(40px,6.2vw,64px); line-height:1.05; letter-spacing:-1.5px; margin:12px 0 16px}
.hero .lede{font-size:18px; color:var(--body-strong); max-width:60ch}
.owlbox{width:190px; height:190px; border-radius:24px; background:var(--surface-soft); display:grid; place-items:center; overflow:hidden}
.owlscale{transform-origin:center}
.stats{display:flex; flex-wrap:wrap; gap:16px 48px; margin-top:28px}
.stat b{display:block; font:400 36px/1.1 var(--serif); letter-spacing:-.5px; color:var(--ink)}
.stat span{font-size:14px; color:var(--muted)}
.bar{height:6px; background:var(--cream-strong); border-radius:3px; overflow:hidden; margin-top:24px; max-width:640px}
.bar i{display:block; height:100%; width:0; background:var(--coral); transition:width 200ms var(--ease)}

/* continue card */
.next{background:var(--panel); color:var(--on-panel); border-radius:16px; padding:28px 32px; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:20px 32px; align-items:center}
.next .eyebrow{color:var(--on-panel-soft)}
.next h2{color:var(--on-panel); font-size:clamp(26px,3.2vw,34px); letter-spacing:-.5px; line-height:1.15; margin:8px 0 6px}
.next p{color:var(--on-panel-soft); font-size:15px}
.next .acts{display:flex; flex-wrap:wrap; gap:10px}

/* timeline */
.tl{margin-top:48px}
.tlhead{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap}
.tlhead h2{font-size:28px; letter-spacing:-.3px}
.pacetot{font-size:14px; color:var(--muted); margin-top:8px}
.pace{margin-top:16px; background:var(--surface-card); border:1px solid var(--hairline-soft); border-radius:16px; padding:18px 20px; max-width:640px}
.pacehead{display:flex; justify-content:space-between; align-items:baseline; gap:12px}
.pacehead label{font:500 12px/1.4 var(--sans); letter-spacing:1.5px; text-transform:uppercase; color:var(--muted)}
.pacehead output{font:400 28px/1 var(--serif); letter-spacing:-.4px; color:var(--coral-text)}
@media (max-width:420px){.pacehead{flex-direction:column; gap:6px}.pacehead output{font-size:24px}}
#pace{width:100%; margin:14px 0 4px; accent-color:var(--coral); height:24px; cursor:pointer}
.paceticks{display:flex; justify-content:space-between; font-size:12px; color:var(--muted-soft)}
.proj{margin-top:12px; font-size:15px; color:var(--body-strong)}
.proj b{font-weight:600}
.stop .hrs{font-size:12.5px; color:var(--coral-text); margin-top:6px; font-weight:500}
.time{margin-top:14px; background:var(--surface-card); border:1px solid var(--hairline-soft); border-radius:12px; padding:12px 14px}
.time b{display:block; font:400 26px/1.1 var(--serif); letter-spacing:-.3px; color:var(--ink)}
.time span{display:block; font-size:13px; color:var(--muted); margin-top:4px; line-height:1.45}
.tlscroll{overflow-x:auto; padding:8px 4px 4px; margin-top:12px}
.track{position:relative; display:grid; grid-template-columns:repeat(6,minmax(120px,1fr)); min-width:760px}
.stop{position:relative; display:flex; flex-direction:column; align-items:center; text-align:center; background:none; border:0; padding:0 6px 8px; color:var(--ink)}
.stop .nm{font-size:13px; color:var(--muted); height:34px; display:flex; align-items:flex-end; line-height:1.25}
.stop .code{font:400 40px/1.1 var(--serif); letter-spacing:-.5px; margin-top:2px}
.stop .lane{position:relative; width:100%; height:44px; display:flex; align-items:center; justify-content:center}
.seg{position:absolute; top:50%; height:0}
.seg.l{left:0; right:50%}.seg.r{left:50%; right:0}
.seg.done{border-top:4px solid var(--coral); margin-top:-2px}
.seg.todo{border-top:3px dashed var(--hairline); margin-top:-1.5px}
.stop:first-child .seg.l,.stop:last-child .seg.r{display:none}
.dot{position:relative; z-index:1; width:22px; height:22px; border-radius:50%; background:var(--canvas); border:4px solid var(--ink)}
.stop.full .dot{background:var(--coral); border-color:var(--coral)}
.stop[aria-pressed="true"] .dot{width:30px; height:30px; background:var(--coral); border-color:var(--coral); box-shadow:0 0 0 10px rgba(217,119,87,.2)}
.stop[aria-pressed="true"] .code{color:var(--coral-text)}
.stop .ct{font-size:13px; color:var(--muted)}
.stop .mini{width:64px; height:4px; background:var(--cream-strong); border-radius:2px; margin-top:6px; overflow:hidden}
.stop .mini i{display:block; height:100%; background:var(--coral)}

/* filters */
.filters{position:sticky; top:calc(var(--navh,0px) + env(safe-area-inset-top,0px)); z-index:5; background:var(--canvas); border-block:1px solid var(--hairline-soft); margin-top:28px; padding-block:10px; display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center}
.tabs{display:flex; flex-wrap:wrap; gap:4px}
.tabs button{padding:8px 14px; border-radius:8px; border:0; background:transparent; font:500 14px/1.4 var(--sans); color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface-card); color:var(--ink)}
.tools{display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; margin-left:auto}
.field{height:40px; border:1px solid var(--hairline); background:var(--surface-card); border-radius:8px; padding:0 12px; font-size:14px; color:var(--ink)}
.field:focus{outline:none; border-color:var(--coral); box-shadow:0 0 0 3px rgba(217,119,87,.2)}
input.field{width:200px}
.chk{display:inline-flex; gap:8px; align-items:center; font-size:14px; color:var(--body)}
.chk input{accent-color:var(--coral); width:16px; height:16px}

/* level sections */
.level{content-visibility:auto; contain-intrinsic-size:auto 1400px; display:grid; grid-template-columns:240px minmax(0,1fr); gap:24px 40px; padding-block:48px; border-bottom:1px solid var(--hairline-soft)}
.lvside{position:relative}
.lvside .big{font:400 72px/1 var(--serif); letter-spacing:-2px; color:var(--coral-text)}
.lvside h2{font-size:26px; letter-spacing:-.3px; line-height:1.15; margin-top:8px}
.lvside p{font-size:14.5px; color:var(--muted); margin-top:10px}
.lvside .prog{font-size:14px; color:var(--body-strong); margin-top:14px}
.lvside .btn{margin-top:14px}
.group + .group{margin-top:28px}
.ghead{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px}
.list{list-style:none; margin:0; padding:0; background:var(--surface-card); border:1px solid var(--hairline-soft); border-radius:16px; overflow:hidden}
.item{display:flex; align-items:center; gap:14px; padding-left:16px; border-top:1px solid var(--hairline-soft)}
.item:first-child{border-top:0}
.tick{flex:none; width:24px; height:24px; border-radius:6px; border:1.5px solid var(--hairline); background:var(--canvas); display:grid; place-items:center; padding:0}
.tick svg{opacity:0}
.tick[aria-checked="true"]{background:var(--coral); border-color:var(--coral)}
.tick[aria-checked="true"] svg{opacity:1}
.open{flex:1; min-width:0; display:flex; align-items:center; gap:12px; text-align:left; background:none; border:0; padding:14px 16px 14px 0}
.open .t{display:block; font-weight:500; color:var(--ink); line-height:1.35}
.open .m{display:block; font-size:13px; color:var(--muted); line-height:1.4; margin-top:2px}
.item.done .t{color:var(--muted)}
.dots{flex:none; display:flex; gap:4px; margin-left:auto}
.dots i{width:7px; height:7px; border-radius:50%; background:var(--cream-strong)}
.dots i.ok{background:var(--success)}
.dots i.no{background:var(--error)}
.chev{flex:none; color:var(--muted-soft); font-size:18px}
.empty{padding:16px; color:var(--muted); font-size:14px}

/* sheet */
dialog{border:0; border-radius:16px; padding:0; width:min(760px, calc(100vw - 32px)); max-height:calc(100dvh - 40px); background:var(--surface-card); color:var(--body); overflow:auto}
dialog::backdrop{background:var(--backdrop)}
.shead{position:sticky; top:0; z-index:2; background:var(--surface-card); padding:22px 28px 0; border-bottom:1px solid var(--hairline-soft)}
.shead .row{display:flex; align-items:flex-start; gap:16px}
.shead .meta{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.pill{display:inline-flex; align-items:center; padding:4px 12px; border-radius:9999px; background:var(--coral); color:var(--on-primary); font:500 12px/1.4 var(--sans); letter-spacing:1.5px; text-transform:uppercase}
.pill.out{background:transparent; color:var(--muted); box-shadow:inset 0 0 0 1px var(--hairline); letter-spacing:.3px; text-transform:none; font-size:13px}
.shead h3{font-size:clamp(26px,4vw,34px); line-height:1.15; letter-spacing:-.5px; margin:12px 0 4px}
.shead .sub{font-size:14px; color:var(--muted); margin-bottom:12px}
.sowl{margin-left:auto; flex:none; display:flex; gap:10px; align-items:flex-start}
.x{width:36px; height:36px; border-radius:50%; border:1px solid var(--hairline); background:var(--canvas); font-size:18px; line-height:1; color:var(--ink)}
.stabs{display:flex; gap:4px; margin-top:4px}
.stabs button{border:0; background:transparent; padding:10px 14px; border-radius:8px 8px 0 0; font:500 14px/1 var(--sans); color:var(--muted)}
.stabs button[aria-selected="true"]{background:var(--canvas); color:var(--ink)}
.sbody{padding:24px 28px 8px}
.sbody h4{font:500 12px/1.4 var(--sans); letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); margin:22px 0 8px}
.sbody h4:first-child{margin-top:0}
.sbody .lead{font-size:17px; color:var(--body-strong)}
.formula{font:400 14px/1.7 var(--mono); background:var(--canvas); border-radius:8px; padding:12px 16px; color:var(--ink)}
.eg{margin:0; padding-left:20px}
.eg li{margin:4px 0; color:var(--body-strong)}
.fix{display:grid; gap:8px}
.fix div{display:flex; gap:12px; align-items:baseline; padding:10px 14px; border-radius:8px}
.fix .w{background:rgba(198,69,69,.10)}
.fix .w span:last-child{text-decoration:line-through; text-decoration-color:var(--error)}
.fix .r{background:rgba(93,184,114,.12)}
.fix b{flex:none; width:16px; font-weight:600}
.fix .w b{color:var(--err-text)}.fix .r b{color:var(--ok-text)}
.note{font-size:14px; color:var(--muted); background:var(--canvas); border-radius:8px; padding:10px 14px; margin-top:20px}
.sfoot{position:sticky; bottom:0; background:var(--surface-card); border-top:1px solid var(--hairline-soft); padding:14px 28px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between}
.sfoot .grp{display:flex; flex-wrap:wrap; gap:8px}

/* quiz */
.q{background:var(--canvas); border-radius:16px; padding:18px 20px; margin-bottom:16px}
.q .qq{font:400 21px/1.35 var(--serif); color:var(--ink); margin:6px 0 14px; letter-spacing:-.2px}
.opts{display:grid; gap:8px}
.opt{display:flex; gap:12px; align-items:baseline; text-align:left; background:var(--surface-card); border:1px solid var(--hairline-soft); border-radius:12px; padding:11px 14px; color:var(--body-strong)}
.opt .k{font:500 13px/1 var(--mono); color:var(--muted); flex:none}
.opt:disabled{cursor:default}
.opt.right{background:rgba(93,184,114,.14); border-color:var(--success)}
.opt.wrong{background:rgba(198,69,69,.10); border-color:var(--error)}
.fb{margin-top:12px; font-size:15px; color:var(--body-strong)}
.fb b{font-weight:600}
.fb.ok b{color:var(--ok-text)}.fb.no b{color:var(--err-text)}
.qprog{height:4px; background:var(--cream-strong); border-radius:2px; margin-bottom:16px; overflow:hidden}
.qprog i{display:block; height:100%; background:var(--coral); transition:width 200ms var(--ease)}
.score{font:400 64px/1 var(--serif); letter-spacing:-1.5px; color:var(--ink)}

/* flashcards */
.fc{perspective:1400px}
.fcin{position:relative; min-height:340px; transition:transform 420ms var(--ease); transform-style:preserve-3d}
.fc.flip .fcin{transform:rotateY(180deg)}
.face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:24px; padding:28px 30px; overflow:auto}
.face.front{background:var(--surface-soft)}
.face.back{background:var(--panel); color:var(--on-panel); transform:rotateY(180deg)}
.face h3{font-size:clamp(28px,4.4vw,40px); letter-spacing:-.8px; line-height:1.1; margin:10px 0 14px}
.face.back h4{color:var(--on-panel-soft); font:500 12px/1.4 var(--sans); letter-spacing:1.5px; text-transform:uppercase; margin:18px 0 8px}
.face.back h4:first-child{margin-top:0}
.face.back li{color:var(--on-panel)}
.face.back .fix .w{background:rgba(198,69,69,.22)}.face.back .fix .r{background:rgba(93,184,114,.2)}
.face.back .fix .r b{color:#8fd6a0}.face.back .fix .w b{color:#f08a8a}
.face .formula{background:var(--formula-soft); margin-top:14px}
.fchint{font-size:13px; color:var(--muted); text-align:center; margin-top:10px}

/* footer */
footer{margin-top:64px; display:grid; gap:32px; grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
footer h2{font-size:24px; letter-spacing:-.3px; margin-bottom:10px}
footer p, footer li{font-size:14.5px; color:var(--body)}
.refs{list-style:none; padding:0; margin:0}
.refs li{padding-left:2em; text-indent:-2em; margin-bottom:10px; overflow-wrap:anywhere}
.refs a{color:var(--body); text-underline-offset:3px}
textarea{width:100%; min-height:72px; border:1px solid var(--hairline); border-radius:8px; background:var(--surface-card); padding:10px; font:400 12px/1.5 var(--mono)}
.row8{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
.msg{font-size:14px; color:var(--coral-text); min-height:1.3em; margin-top:8px}

/* motion: calm and short; everything is skipped when reduced motion is on */
@keyframes backdrop-in{from{opacity:0}to{opacity:1}}
dialog[open]::backdrop{animation:backdrop-in 240ms var(--ease)}
dialog.closing::backdrop{opacity:0; transition:opacity 170ms ease-in}
.opt{transition:background 200ms var(--ease), border-color 200ms var(--ease), transform 120ms var(--ease)}
.opt:not(:disabled):active{transform:scale(.99)}
.stabs button,.tabs button{transition:background 200ms var(--ease), color 200ms var(--ease)}
.item{transition:background 200ms var(--ease)}
.open .t{transition:color 200ms var(--ease)}
.tick{transition:background 200ms var(--ease), border-color 200ms var(--ease)}
.bar i{transition:width 700ms var(--ease)}
@keyframes owl-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(calc(var(--pxc) * -1))}}

@media (max-width:800px){
  .hero{grid-template-columns:1fr}
  .owlbox{width:120px; height:120px; border-radius:16px; order:-1}
  .owlscale{transform:scale(.64)}
  .next{grid-template-columns:1fr; padding:24px}
  .level{grid-template-columns:1fr; gap:18px; padding-block:36px}
  .lvside .big{font-size:56px}
  .tools{margin-left:0; width:100%}
  .filters{position:relative; top:auto}
  input.field{flex:1; width:auto; min-width:0}
  select.field{max-width:100%}
}
@media (max-width:600px){
  dialog{width:100vw; max-width:100vw; height:100dvh; max-height:100dvh; border-radius:0; margin:0}
  .shead,.sbody,.sfoot{padding-inline:18px}
  .stats{gap:12px 28px}
  .stat b{font-size:30px}
}
/* short screens (phones held sideways): full screen sheet, header scrolls away */
@media (max-height:520px){
  dialog{width:100vw; max-width:100vw; height:100dvh; max-height:100dvh; border-radius:0; margin:0}
  .shead{position:static; padding-top:12px}
  .shead h3{font-size:24px; margin:6px 0 2px}
  .shead .sub{margin-bottom:6px}
  #sheetOwl{display:none}
  .sbody{padding-top:16px}
  .sfoot{padding-block:8px}
  .fcin{min-height:240px}
}
/* touch screens: larger targets */
@media (pointer:coarse){
  .tick{width:30px; height:30px; border-radius:8px}
  .chk input{width:20px; height:20px}
  .tabs button{padding:10px 14px}
  .stabs button{padding:12px 14px}
  .x{width:40px; height:40px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after,dialog::backdrop{transition:none!important; animation:none!important}}

/* site menu, website build */
.sitebar{position:sticky; top:0; z-index:8; background:var(--canvas); padding-top:14px; padding-bottom:14px; gap:20px}
.mark{text-decoration:none}
.sitenav{flex:1; min-width:0; display:flex; justify-content:center}
.sitenav ul{list-style:none; margin:0; padding:0; display:flex; align-items:center; gap:4px}
.sitenav a{display:block; padding:8px 12px; border-radius:8px; font:500 14px/1.2 var(--sans); color:var(--muted); text-decoration:none; white-space:nowrap; transition:background 200ms var(--ease), color 200ms var(--ease)}
.sitenav a:hover{color:var(--ink); background:var(--cream-strong)}
.sitenav a[aria-current="page"]{color:var(--ink); background:var(--surface-card); box-shadow:inset 0 0 0 1px var(--hairline-soft)}
.sitenav a.navapply{background:var(--coral); color:var(--on-primary); border-radius:0 0 8px 8px; margin-left:6px}
.sitenav a.navapply:hover{background:var(--coral-active); color:var(--on-primary)}
.navtoggle{display:none; width:40px; height:40px; border-radius:9999px; border:0; background:var(--cream-strong); color:var(--ink); font-size:18px; line-height:1}
@media (max-width:1100px){
  .sitebar{position:sticky}
  .sitenav{position:absolute; left:0; right:0; top:100%; display:block; flex:none}
  .sitenav ul{display:none; flex-direction:column; align-items:stretch; gap:2px; background:var(--surface-card); border:1px solid var(--hairline-soft); border-radius:16px; padding:8px; margin-top:8px}
  .sitenav ul.open{display:flex}
  .sitenav a{padding:12px 14px; font-size:15px}
  .sitenav a.navapply{margin:6px 0 0; text-align:center}
  .navtoggle{display:inline-grid; place-items:center}
}
@media (min-width:1101px) and (max-width:1320px){ .sitebar{gap:12px} .sitenav ul{gap:2px} .sitenav a{padding:8px 9px} .themeb{font-size:0; gap:0; padding:8px 10px} .themeb svg{width:16px; height:16px} }
@media (max-width:420px){ .themeb{padding:8px 10px; font-size:0; gap:0} .themeb svg{width:16px; height:16px} }
@media (max-width:360px){ .sitebar{gap:8px} .navtoggle{width:36px; height:36px} .themeb{padding:8px} .lang button{padding:6px 9px} }

/* ===== Learning hub additions (built on the route map design system) ===== */
.toolnav{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-top:48px}
.toolbtn{display:flex; flex-direction:column; align-items:flex-start; gap:6px; text-align:left; background:var(--surface-card); border:1px solid var(--hairline-soft); border-radius:16px; padding:18px 20px; color:var(--body); min-width:0; transition:background 200ms var(--ease), border-color 200ms var(--ease)}
.toolbtn .n{font:500 12px/1.4 var(--mono); color:var(--coral-text)}
.toolbtn .h{font:400 24px/1.15 var(--serif); letter-spacing:-.3px; color:var(--ink)}
.toolbtn .d{font-size:14px; color:var(--muted); line-height:1.45}
.toolbtn .c{font-size:13px; color:var(--muted); margin-top:6px}
.toolbtn[aria-selected="true"]{background:var(--panel); border-color:var(--panel)}
.toolbtn[aria-selected="true"] .h{color:var(--on-panel)}
.toolbtn[aria-selected="true"] .d,.toolbtn[aria-selected="true"] .c{color:var(--on-panel-soft)}
.toolbtn[aria-selected="true"] .n{color:var(--amber)}
.toolhead{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:12px 24px; padding-top:44px}
.toolhead h2{font-size:clamp(28px,3.4vw,36px); letter-spacing:-.5px; line-height:1.1; margin-top:8px}
.toolhead p{color:var(--muted); font-size:15px; max-width:62ch; margin-top:8px}
.tool .filters{margin-top:20px}
.tool .level{content-visibility:visible}

/* example segments: one colour per sentence part */
.k1{--kc:#2f7d6d}.k2{--kc:#c6613f}.k3{--kc:#a86b12}.k4{--kc:#8a4f8c}.k5{--kc:#b0476a}.k6{--kc:#3f7f3a}.k7{--kc:#6c6a64}.k8{--kc:#3f6aa0}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .k1{--kc:#6cc4b0} :root:not([data-theme="light"]) .k2{--kc:#e8906f} :root:not([data-theme="light"]) .k3{--kc:#e8b25a} :root:not([data-theme="light"]) .k4{--kc:#c79bd0} :root:not([data-theme="light"]) .k5{--kc:#ec8fae} :root:not([data-theme="light"]) .k6{--kc:#8fcf86} :root:not([data-theme="light"]) .k7{--kc:#a09d96} :root:not([data-theme="light"]) .k8{--kc:#8fb0e0} }
:root[data-theme="dark"] .k1{--kc:#6cc4b0} :root[data-theme="dark"] .k2{--kc:#e8906f} :root[data-theme="dark"] .k3{--kc:#e8b25a} :root[data-theme="dark"] .k4{--kc:#c79bd0} :root[data-theme="dark"] .k5{--kc:#ec8fae} :root[data-theme="dark"] .k6{--kc:#8fcf86} :root[data-theme="dark"] .k7{--kc:#a09d96} :root[data-theme="dark"] .k8{--kc:#8fb0e0}
.exrow{font:400 19px/2.3 var(--serif); color:var(--ink); margin:0 0 4px}
.sg{font:inherit; line-height:1.4; color:var(--ink); background:color-mix(in srgb, var(--kc) 14%, transparent); border:0; border-bottom:3px solid var(--kc); border-radius:6px 6px 2px 2px; padding:1px 8px; margin:0 1px; transition:background 200ms var(--ease), color 200ms var(--ease)}
.sg[aria-pressed="true"]{background:var(--kc); color:var(--canvas)}
.legend{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px}
.lg{font:500 13px/1 var(--sans); padding:7px 11px; border-radius:9999px; box-shadow:inset 0 0 0 1.5px var(--kc); background:color-mix(in srgb, var(--kc) 12%, transparent); color:var(--ink); transition:background 200ms var(--ease), color 200ms var(--ease)}
.lg.on{background:var(--kc); color:var(--canvas)}
.cap{font-size:13.5px; color:var(--muted); margin-top:6px}

/* exercises */
.qp{font-size:14px; color:var(--muted); margin-top:4px}
.qq u{text-decoration-thickness:2px; text-underline-offset:4px; text-decoration-color:var(--coral)}
.chunks{display:flex; flex-wrap:wrap; gap:8px}
.chunk,.piece{background:var(--surface-card); border:1px solid var(--hairline-soft); border-radius:12px; padding:10px 14px; font:400 17px/1.3 var(--serif); color:var(--ink); text-align:left; transition:background 200ms var(--ease), border-color 200ms var(--ease), opacity 200ms var(--ease)}
.chunk:disabled,.piece:disabled{cursor:default}
.chunk.right{background:rgba(93,184,114,.14); border-color:var(--success)}
.chunk.wrong{background:rgba(198,69,69,.10); border-color:var(--error)}
.piece{cursor:grab; touch-action:manipulation}
.piece.dragging{opacity:.35}
.lbl{font:500 12px/1.4 var(--sans); letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); margin:14px 0 6px}
.lbl:first-child{margin-top:0}
.bank,.ans{display:flex; flex-wrap:wrap; gap:8px; min-height:60px; padding:8px; border-radius:12px; border:1.5px dashed var(--hairline); align-content:flex-start; transition:border-color 200ms var(--ease)}
.ans{border-style:solid; border-color:var(--hairline-soft); background:var(--surface-card)}
.ans:empty::before{content:attr(data-ph); color:var(--muted-soft); font-size:14px; align-self:center; padding-left:6px}
.bank.over,.ans.over{border-color:var(--coral)}
.ans.right{border-color:var(--success)} .ans.wrong{border-color:var(--error)}
.qacts{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
.srcline{font-size:13.5px; color:var(--muted); margin-top:18px}

/* tense board */
.tboard{margin-top:24px}
.tgrid{display:grid; grid-template-columns:190px repeat(3,minmax(0,1fr)); gap:10px}
.tzh{grid-row:1; grid-column:var(--c); text-align:center; font:400 24px/1.2 var(--serif); letter-spacing:-.3px; color:var(--ink)}
.tline{grid-row:2; grid-column:2 / 5; position:relative; height:36px}
.tline::before{content:""; position:absolute; left:4px; right:14px; top:50%; border-top:3px solid var(--ink); margin-top:-1.5px}
.tline::after{content:""; position:absolute; right:2px; top:50%; margin-top:-8px; border-left:14px solid var(--ink); border-top:8px solid transparent; border-bottom:8px solid transparent}
.tnow{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:1}
.tah{grid-column:1; grid-row:var(--r); display:flex; flex-direction:column; justify-content:center; gap:4px; padding-right:6px}
.tah b{display:flex; align-items:center; gap:8px; font:500 15px/1.3 var(--sans); color:var(--ink)}
.tah span{font-size:13px; color:var(--muted); line-height:1.4}
.ico{width:18px; height:18px; flex:none}
.ico .f{fill:var(--coral)} .ico .s{fill:none; stroke:var(--coral); stroke-width:2.6}
.tcard{grid-column:var(--c); grid-row:var(--r); display:flex; flex-direction:column; align-items:flex-start; gap:6px; text-align:left; min-width:0; min-height:112px; background:var(--surface-card); border:1px solid var(--hairline-soft); border-radius:16px; padding:14px 16px; color:var(--body); transition:opacity 240ms var(--ease), border-color 200ms var(--ease), box-shadow 200ms var(--ease), transform 120ms var(--ease)}
.tcard:active{transform:scale(.99)}
.tcard .asp{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted)}
.tcard .nm{font:400 19px/1.2 var(--serif); letter-spacing:-.2px; color:var(--ink)}
.tcard .en{font-size:12.5px; color:var(--muted); margin-top:-2px}
.tcard .st{margin-top:auto; display:flex; gap:8px; align-items:center; font-size:12.5px; color:var(--muted)}
.tcard .st i{width:7px; height:7px; border-radius:50%; background:var(--cream-strong)}
.tcard .st i.ok{background:var(--success)} .tcard .st i.no{background:var(--error)}
.tcard .st .lrn{color:var(--coral-text); font-weight:500}
.tcard.dim{opacity:.3}
.tcard.hit{border-color:var(--coral); box-shadow:0 0 0 3px rgba(217,119,87,.18)}
.ttstatus{font-size:14.5px; color:var(--body-strong); min-height:1.5em; margin-top:16px}
.tdia{background:var(--canvas); border-radius:12px; padding:6px 8px; margin-bottom:6px}
.tdia svg{display:block; width:100%; height:auto}
.dg-ax{stroke:var(--muted-soft); stroke-width:2} .dg-axh{fill:var(--muted-soft)}
.dg-now{stroke:var(--ink); stroke-width:2.5} .dg-ref{stroke:var(--ink); stroke-width:2.5; stroke-dasharray:4 4}
.dg-ev{fill:none; stroke:var(--coral); stroke-width:3.5; stroke-linecap:round} .dg-dot{fill:var(--coral)}
.dg-t{font:500 13px var(--sans); fill:var(--muted)} .dg-tn{font:600 13px var(--sans); fill:var(--ink)}
.chipset{display:flex; flex-wrap:wrap; gap:6px}
.chipb{border:1px solid var(--hairline); background:var(--canvas); color:var(--ink); border-radius:9999px; padding:7px 12px; font:400 14px/1 var(--mono); transition:background 200ms var(--ease), color 200ms var(--ease)}
.chipb[aria-pressed="true"]{background:var(--coral); border-color:var(--coral); color:var(--on-primary)}
.rel{border-left:4px solid var(--rc); padding:4px 0 4px 14px; margin:16px 0}
.rel p{margin-top:6px; color:var(--body-strong)}
.relk{display:flex; flex-wrap:wrap; align-items:center; gap:8px; font:500 12px/1.4 var(--sans); letter-spacing:1px; text-transform:uppercase; color:var(--muted)}
.relk button{text-transform:none; letter-spacing:0; font:500 14px/1 var(--sans); padding:8px 12px; border-radius:9999px; border:1px solid var(--hairline); background:var(--canvas); color:var(--ink)}
.r-confused{--rc:var(--coral)} .r-order{--rc:var(--ink)} .r-aspect{--rc:var(--muted-soft)} .r-build{--rc:var(--teal)}

/* class tools */
.ctsub{margin-top:20px}
.ct-stage{display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:32px; align-items:start; margin-top:24px}
.ct-head{margin-top:28px}
.ct-head h3{font-size:28px; letter-spacing:-.4px}
.ct-head p{color:var(--muted); margin-top:6px}
.wheelbox{position:relative; width:100%; max-width:560px; margin-inline:auto; padding-top:14px}
.wheelbox canvas{display:block; width:100%; aspect-ratio:1; cursor:pointer}
.pointer{position:absolute; top:0; left:50%; transform:translateX(-50%); z-index:2; width:0; height:0; border-left:16px solid transparent; border-right:16px solid transparent; border-top:30px solid var(--coral)}
.cpanel{display:grid; gap:18px; min-width:0}
.crow{display:flex; flex-wrap:wrap; align-items:center; gap:10px 12px}
.segb{display:inline-flex; flex-wrap:wrap; background:var(--cream-strong); border-radius:20px; padding:3px}
.segb button{border:0; background:transparent; border-radius:9999px; padding:8px 14px; font:500 14px/1.2 var(--sans); color:var(--muted)}
.segb button[aria-pressed="true"]{background:var(--surface-card); color:var(--ink)}
.chk2{display:inline-flex; align-items:center; gap:8px; font-size:15px; color:var(--body)}
.chk2 input{accent-color:var(--coral); width:18px; height:18px}
.spinb{width:100%; height:56px; font:400 24px/1 var(--serif); letter-spacing:-.3px}
.chint{font-size:15px; color:var(--muted)}
.chint b{color:var(--ink); font-weight:600}
.qcard{background:var(--surface-card); border:1px solid var(--hairline-soft); border-radius:16px; padding:20px 22px; min-height:170px; display:grid; align-content:start; gap:10px}
.qcard .qt{font:400 clamp(24px,3vw,32px)/1.2 var(--serif); letter-spacing:-.4px; color:var(--ink)}
.qcard .ph{color:var(--muted)}
.clock{font:400 44px/1 var(--serif); letter-spacing:-1px; color:var(--ink); min-width:3.6ch}
.clock.done{color:var(--coral-text)}
.hlist{list-style:none; margin:8px 0 0; padding:0}
.hlist li{display:grid; grid-template-columns:auto minmax(0,1fr); gap:12px; padding:8px 0; border-top:1px solid var(--hairline-soft); font-size:15px; color:var(--body-strong)}
.hlist li.none{border-top:0; color:var(--muted)}
.hlist .tag{font:500 13px/1.5 var(--mono); color:var(--coral-text)}
.hmeta{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:8px}
.hmeta span{font-size:14px; color:var(--muted)}
.ctcard{background:var(--surface-card); border:1px solid var(--hairline-soft); border-radius:16px; padding:18px; display:grid; gap:12px; min-width:0}
.ctcard h3,.ctcard h4{font-size:21px; letter-spacing:-.3px}
.ctcard .hint{font-size:14px; color:var(--muted)}
.ctx textarea{font:400 15px/1.45 var(--sans); min-height:150px; resize:vertical; color:var(--ink)}
.ctx details summary{cursor:pointer; color:var(--coral-text); font-weight:500; padding:4px 0}
.ctx details[open] summary{margin-bottom:8px}
.ctx .field{font-size:15px}
.ctx label.hint{display:block; margin-top:4px}
.roster{list-style:none; margin:0; padding:0}
.roster li{border-top:1px solid var(--hairline-soft)}
.roster label{display:flex; align-items:center; gap:10px; padding:8px 2px; cursor:pointer; font-size:15.5px; color:var(--ink)}
.roster input{accent-color:var(--coral); width:18px; height:18px; flex:none}
.roster li.off span{color:var(--muted); text-decoration:line-through}
.ct-pairs{grid-template-columns:minmax(260px,340px) minmax(0,1fr)}
.groups{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr)); gap:14px}
.pair{background:var(--surface-card); border:1px solid var(--hairline-soft); border-radius:16px; padding:16px 18px; display:grid; gap:10px; align-content:start; min-width:0}
.pair.trio{box-shadow:inset 0 0 0 1.5px var(--coral); border-color:var(--coral)}
.pair .eyebrow{color:var(--coral-text)}
.pair ul{list-style:none; margin:0; padding:0; display:grid; gap:6px}
.pair li{font:400 20px/1.25 var(--serif); color:var(--ink); overflow-wrap:anywhere}
.pair li + li{padding-top:6px; border-top:1px dashed var(--hairline)}
.pair .tp{font-size:14px; color:var(--body); font-weight:500}
.round{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 14px}
.round h4{font-size:26px; letter-spacing:-.4px}
.round span{color:var(--muted); font-size:14px}
.cnote{font-size:14.5px; color:var(--body-strong); min-height:1.5em}
.ct-seats{grid-template-columns:minmax(0,1fr) minmax(280px,350px)}
.sizes label{display:inline-flex; align-items:center; gap:8px; font-size:14px; color:var(--body)}
.sizes input{width:4.4ch; text-align:center; padding:0 6px}
.board{background:var(--panel); color:var(--on-panel); border-radius:12px; text-align:center; padding:10px 16px; font:500 13px/1.4 var(--sans); letter-spacing:3px; text-transform:uppercase}
.seatwrap{overflow-x:auto; padding-bottom:4px}
.seats{--aisle:clamp(24px,5vw,56px); display:grid; gap:10px}
.aisle{background:linear-gradient(var(--hairline),var(--hairline)) center / 2px 100% no-repeat}
.rowlabel{align-self:center; color:var(--muted); font-size:13px; white-space:nowrap; padding-right:2px}
.seat{position:relative; background:var(--surface-card); border:1.5px solid var(--hairline-soft); border-radius:12px; min-height:88px; display:grid; transition:border-color 200ms var(--ease), background 200ms var(--ease)}
.seat.empty{background:transparent; border-style:dashed; border-color:var(--hairline)}
.seat.locked{border-color:var(--coral)}
.seat.sel{box-shadow:0 0 0 3px rgba(217,119,87,.4)}
.seat.warn{border-color:var(--error); border-style:dashed}
.seat.over{background:var(--surface-soft)}
.seatbtn{background:transparent; border:0; padding:10px 30px 10px 12px; text-align:left; font:400 16.5px/1.25 var(--serif); color:var(--ink); overflow-wrap:anywhere; display:flex; align-items:center; min-width:0}
.seat.empty .seatbtn{color:var(--muted-soft); font:400 14px/1.3 var(--sans)}
.lock{position:absolute; top:4px; right:4px; width:28px; height:28px; border:0; border-radius:8px; background:transparent; color:var(--muted-soft); display:grid; place-items:center; padding:0}
.seat.locked .lock{color:var(--coral-text)}
.lock svg{width:17px; height:17px}
.schips{display:flex; flex-wrap:wrap; gap:8px}
.schip{background:var(--cream-strong); border:1.5px solid transparent; border-radius:9999px; padding:6px 12px; font-size:14.5px; color:var(--ink); cursor:grab}
.schip.sel{border-color:var(--coral)}
.rlist{list-style:none; margin:0; padding:0}
.rlist li{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; align-items:center; padding:8px 0; border-top:1px solid var(--hairline-soft); font-size:14.5px}
.rlist li.none{border-top:0; color:var(--muted); display:block}
.rlist .ok{color:var(--ok-text); font-weight:600} .rlist .bad{color:var(--err-text); font-weight:600}
.btn.sm{height:32px; padding:0 12px; font-size:13px}
.exitb{display:none; position:fixed; right:16px; top:calc(12px + env(safe-area-inset-top,0px)); z-index:20}
