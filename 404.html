    mad: { glance: 0, blink: 0, flap: 0, bob: 2.4, ms: 200, frames: [['M.L......R..','.MXX....XX..','..XXXXXXXX..','.XGGXXXXGGX.','.XXeGXXGeXX.','.XXeXXXXeXX.','.XXXXXXXXXX.','XXXXXAAXXXXX','XXXXXAAXXXXX','.XXXXXXXXXX.','...A....A...'],['..L......R.M','..XX....XXM.','..XXXXXXXX..','.XGGXXXXGGX.','.XXeGXXGeXX.','.XXeXXXXeXX.','.XXXXXXXXXX.','XXXXXAAXXXXX','XXXXXAAXXXXX','.XXXXXXXXXX.','...A....A...']] }

      const dots = document.createElement('span'); dots.style.cssText = 'display:inline-flex;gap:' + fs * 0.25 + 'px;padding:0 ' + fs * 0.2 + 'px';
      for (let k = 0; k < 3; k++) { const d = document.createElement('span'); d.style.cssText = 'width:' + fs * 0.3 + 'px;height:' + fs * 0.3 + 'px;border-radius:50%;background:' + bTone.dot + ';animation:pxav-dot 900ms ' + k * 150 + 'ms infinite ' + EASE_OUT; dots.append(d); }
      body.append(dots);
      T.say.push(setTimeout(() => {
        dots.remove(); body.append(shown, hidden); let n = 0; typeText(0);
        const iv = setInterval(() => { n += 1; typeText(n); if (n >= text.length) clearInterval(iv); }, 28); T.say.push(iv);
      }, 750));
      T.say.push(setTimeout(() => closeBubble(), 750 + text.length * 28 + stay));
    }
    function startTalk() {
      clearAll(T.loop); if (!bubbleOn || !onScreen) { clearAll(T.say); closeBubble(true); return; }
      const every = opts.sayEveryMs || 12000, jit = opts.sayJitter == null ? 0.2 : opts.sayJitter;
      const next = ms => T.loop.push(setTimeout(() => { if (live()) say(); next(every * (1 - jit + Math.random() * jit * 2)); }, ms));
      next(opts.sayDelayMs != null ? opts.sayDelayMs : 1400 + Math.random() * 1200);
    }

    // poke it 5 times quickly and it gets mad for a moment
    let clicks = [];
    function getMad() { clearTimeout(T.madT); mad = true; lastKey = ''; startFrames(); paint(); if (bubbleOn) say(madLine()); T.madT = setTimeout(() => { mad = false; clicks = []; lastKey = ''; startFrames(); paint(); }, 3200); }
    if (opts.interactive !== false) root.addEventListener('click', () => {
      if (mad) { getMad(); return; }
      const now = Date.now(); clicks = clicks.filter(t => now - t < 2500).concat(now);
      if (temper > 0 && clicks.length >= temper) { clicks = []; getMad(); }
      else { hop(260, true); if (bubbleOn && !bubble) say(); }
    });

    // only animate while on screen
    function wake() { startFrames(); startBlink(); startIdle(); startCycle(); startTalk(); paint(); }
    function sleep() { clearInterval(T.frame); clearInterval(T.act); clearAll(T.blink); clearAll(T.idle); clearAll(T.loop); clearAll(T.say); closeBubble(true); look = 'center'; twitch = null; paint(); }
    if ('IntersectionObserver' in window) new IntersectionObserver(es => es.forEach(e => { const was = onScreen; onScreen = e.isIntersecting; if (onScreen && !was) wake(); else if (!onScreen && was) sleep(); })).observe(root);
    paint(); wake();
    return { el: root, wrap, setPose, flapBurst, hop, say, setLabel: t => root.setAttribute('aria-label', t), get pose() { return curPose(); } };
  }
  window.makeOwl = makeOwl;
  window.OWL_LINES = LINES;
})();
