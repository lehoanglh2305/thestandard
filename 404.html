  mad: { glance: 0, blink: 0, flap: 0, bob: 2.4, ms: 200, frames: [['M.L......R..','.MXX....XX..','..XXXXXXXX..','.XGGXXXXGGX.','.XXeGXXGeXX.','.XXeXXXXeXX.','.XXXXXXXXXX.','XXXXXAAXXXXX','XXXXXAAXXXXX','.XXXXXXXXXX.','...A....A...'],['..L......R.M','..XX....XXM.','..XXXXXXXX..','.XGGXXXXGGX.','.XXeGXXGeXX.','.XXeXXXXeXX.','.XXXXXXXXXX.','XXXXXAAXXXXX','XXXXXAAXXXXX','.XXXXXXXXXX.','...A....A...']] },
};
const keepWings = (src, g) => g.map((row, r) => row.split('').map((ch, c) => ('WU'.includes(src[r][c]) ? src[r][c] : ch)).join(''));
const EYE = 'eabcd';
// 12x11 pose -> 24x22: upscale, chamfer the silhouette, round + sparkle the eyes, blush, round beak, belly
function hires(fr, mad) {
  const g = []; fr.forEach(r => { const row = r.split('').map(ch => ch + ch); g.push(row, row.slice()); });
  const s = g.map(r => r.map(ch => (EYE.includes(ch) ? 'E' : ch)));
  const sa = (r, c) => (s[r] && s[r][c]) || '.';
  const H = g.length, W = g[0].length;
  const seen = {}; const groups = [];
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) if (s[r][c] === 'E' && !seen[r + ',' + c]) {
    const st = [[r, c]]; seen[r + ',' + c] = 1; const cells = [];
    while (st.length) { const [y, x] = st.pop(); cells.push([y, x]); [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dy, dx]) => { const k = (y + dy) + ',' + (x + dx); if (sa(y + dy, x + dx) === 'E' && !seen[k]) { seen[k] = 1; st.push([y + dy, x + dx]); } }); }
    const ys = cells.map(a => a[0]), xs = cells.map(a => a[1]);
    groups.push({ cells, top: Math.min(...ys), bot: Math.max(...ys), left: Math.min(...xs), right: Math.max(...xs) });
  }
  const out = s.map(r => r.slice());
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) if (s[r][c] === 'X') {
    const u = sa(r - 1, c) === '.', d = sa(r + 1, c) === '.', l = sa(r, c - 1) === '.', rt = sa(r, c + 1) === '.';
    if ((u && l) || (u && rt) || (d && l) || (d && rt)) out[r][c] = '.';
  }
  groups.forEach(o => {
    const big = o.bot - o.top >= 3;
    o.cells.forEach(([r, c]) => {
      const u = sa(r - 1, c) !== 'E', d = sa(r + 1, c) !== 'E', l = sa(r, c - 1) !== 'E', rt = sa(r, c + 1) !== 'E';
      if (big && ((u && l) || (u && rt) || (d && l) || (d && rt))) out[r][c] = 'X';
      else out[r][c] = d ? 'N' : 'E';
    });
    if (big) {
      out[o.top + 1][o.left + 1] = 'K';
      if (!mad) [[o.bot - 1, o.left - 3], [o.bot - 1, o.left - 2], [o.bot, o.left - 3], [o.bot, o.left - 2], [o.bot - 1, o.right + 2], [o.bot - 1, o.right + 3], [o.bot, o.right + 2], [o.bot, o.right + 3]].forEach(([r, c]) => { if (out[r] && out[r][c] === 'X') out[r][c] = 'P'; });
    }
  });
  for (let r = 0; r < H - 1; r++) for (let c = 1; c < W - 3; c++) {
    if (s[r][c] === 'A' && s[r][c + 1] === 'A' && s[r][c + 2] === 'A' && s[r][c + 3] === 'A' && s[r][c - 1] === 'X' && s[r][c + 4] === 'X' && s[r + 1][c] === 'A' && sa(r + 2, c) === 'X') { out[r + 1][c] = 'X'; out[r + 1][c + 3] = 'X'; }
  }
  if (!mad) [[16, 9, 14], [17, 8, 15], [18, 8, 15], [19, 9, 14]].forEach(([r, a, b]) => { for (let c = a; c <= b; c++) if (out[r] && out[r][c] === 'X') out[r][c] = 'B'; });
  return out.map(r => r.join(''));
}

/* Chiioo owl, vanilla port of components/brand/Chiioo.jsx (classic style, coral tone) */
function makeOwl(host, size, opts){
  // drawn on one <canvas> instead of 528 grid cells: far fewer page elements, same pixels
  opts = opts || {};
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const probe = document.createElement("span"); host.replaceChildren(probe);
  const resolve = v => { probe.style.color = ""; probe.style.color = v; return getComputedStyle(probe).color; };
  const C = {body:resolve("var(--coral)"), accent:resolve("var(--amber)"), detail:resolve("var(--ink)"), belly:resolve("color-mix(in oklch, var(--coral), white 38%)"), blush:resolve("oklch(0.8 0.1 18)")};
  if (!C.belly || C.belly==="rgba(0, 0, 0, 0)") C.belly = "#ebb4a1";
  const dpr = Math.min(3, window.devicePixelRatio || 1), px = size/24;
  const root = document.createElement("canvas");
  root.width = Math.round(size*dpr); root.height = Math.round(px*22*dpr);
  root.setAttribute("role","img"); root.setAttribute("aria-label", opts.label || "Chiioo the owl");
  root.className = "owl";
  root.style.cssText = `display:block;width:${size}px;height:${px*22}px;--pxc:${size/12}px;flex:none;cursor:pointer;image-rendering:pixelated`;
  host.replaceChildren(root);
  const ctx = root.getContext("2d"), cell = root.width/24;
  let pose = opts.pose || "default", frame = 0, closed = false, flap = false, frameT = null, lastKey = "", onScreen = true;
  const cache = {};
  const framesFor = p => cache[p] || (cache[p] = ((POSES[p].frames) || [POSES[p].grid]).map(fr => hires(keepWings(fr, fr.slice()), false).join("")));
  function colour(ch){
    if (ch==="X"||ch==="L"||ch==="R") return C.body;
    if (ch==="A"||ch==="S") return C.accent;
    if (ch==="G") return C.detail;
    if (ch==="B") return C.belly;
    if (ch==="P") return C.blush;
    if (ch==="W") return flap ? null : C.body;
    if (ch==="U") return flap ? C.body : null;
    if ("abcde".includes(ch)) return closed ? C.body : null;
    return null;
  }
  function paint(){
    const fr = framesFor(pose), grid = fr[frame % fr.length];
    const key = pose+"|"+(frame % fr.length)+"|"+closed+"|"+flap;
    if (key === lastKey) return; lastKey = key;   // nothing changed, skip drawing
    ctx.clearRect(0,0,root.width,root.height);
    for (let i=0;i<grid.length;i++){ const c = colour(grid[i]); if (!c) continue;
      ctx.fillStyle = c; const x=i%24, y=(i/24)|0;
      ctx.fillRect(Math.floor(x*cell), Math.floor(y*cell), Math.ceil(cell), Math.ceil(cell)); }
    const an = reduced ? "none" : `owl-bob ${POSES[pose].bob||2.4}s steps(2,jump-none) infinite`; if (root.dataset.an !== an){ root.style.animation = an; root.dataset.an = an; }
  }
  const tick = fn => () => { if (onScreen && !document.hidden) fn(); };   // no work while hidden or off screen
  if ("IntersectionObserver" in window) new IntersectionObserver(es => es.forEach(e => { onScreen = e.isIntersecting; })).observe(root);
  function setPose(p){
    if (!POSES[p]) p = "default"; pose = p; frame = 0; clearInterval(frameT);
    const P = POSES[p]; if (P.frames && !reduced) frameT = setInterval(tick(()=>{ frame++; paint(); }), P.ms || 320);
    paint();
  }
  if (!reduced){
    setInterval(tick(()=>{ if (!POSES[pose].blink) return; closed = true; paint(); setTimeout(()=>{ closed=false; paint(); }, 160); }), 3800);
  }
  function flapBurst(n){ if (reduced) return; let k=0; const t=setInterval(()=>{ flap=!flap; paint(); if(++k>=n){ clearInterval(t); flap=false; paint(); } }, 110); }
  root.addEventListener("click", ()=>{ flapBurst(6); if (!reduced) root.animate([{transform:"translateY(0)"},{transform:`translateY(-${size/8}px)`},{transform:"translateY(0)"}],{duration:260}); });
  setPose(pose);
  return { setPose, flapBurst, el: root };
}
