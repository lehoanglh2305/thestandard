<title>Công cụ lớp học · The Standard</title>

<meta name="theme-color" content="#f5f2ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121d33" media="(prefers-color-scheme: dark)">

<style>
/* Chiioo lesson design system: one deliberate cream look */
:root{
  --coral:#d97757; --coral-active:#a44a2e; --coral-text:#ad4f31; --coral-fill:#b65436; --on-cream:#5f5d58; --teal:#5db8a6; --amber:#e8a55a;
  --ink:#141413; --body-strong:#252523; --body:#3d3d3a; --muted:#6c6a64; --muted-soft:#87867f;
  --canvas:#f0eee6; --surface-soft:#f5e3c7; --surface-card:#faf9f5; --cream-strong:#e3dacc;
  --hairline:#cccbc8; --hairline-soft:#e3dacc;
  --dark:#141413; --dark-elevated:#3d3d3a; --dark-soft:#1f1e1c; --on-dark:#faf9f5; --on-dark-soft:#b0aea5;
  --success:#5db872; --error:#c64545;
  --on-primary:#faf9f5; --panel:#141413; --on-panel:#faf9f5; --on-panel-soft:#b0aea5;
  --btn-dk:#3d3d3a; --btn-dk-soft:#1f1e1c; --ok-text:#3c8a4f; --err-text:#c64545;
  --formula-soft:rgba(20,20,19,.06); --backdrop:rgba(20,20,19,.55);
  --serif:"Copernicus","Source Serif 4","Tiempos Headline",Garamond,"Times New Roman",serif;
  --sans:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.2,0,0,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --on-cream:#a09d96;
  --ink:#faf9f5; --body-strong:#e8e6df; --body:#cfccc3; --muted:#a09d96; --muted-soft:#8e8b82;
  --canvas:#141413; --surface-soft:#2d2620; --surface-card:#1f1e1c; --cream-strong:#33312d;
  --hairline:#4a4843; --hairline-soft:#33312d; --coral-text:#e8906f;
  --panel:#262420; --btn-dk:#3d3a36; --btn-dk-soft:#2b2926; --ok-text:#7fcf92; --err-text:#ee7d7d;
  --formula-soft:rgba(250,249,245,.07); --backdrop:rgba(0,0,0,.65);
  color-scheme:dark;
} }
:root[data-theme="dark"]{
  --on-cream:#a09d96;
  --ink:#faf9f5; --body-strong:#e8e6df; --body:#cfccc3; --muted:#a09d96; --muted-soft:#8e8b82;
  --canvas:#141413; --surface-soft:#2d2620; --surface-card:#1f1e1c; --cream-strong:#33312d;
  --hairline:#4a4843; --hairline-soft:#33312d; --coral-text:#e8906f;
  --panel:#262420; --btn-dk:#3d3a36; --btn-dk-soft:#2b2926; --ok-text:#7fcf92; --err-text:#ee7d7d;
  --formula-soft:rgba(250,249,245,.07); --backdrop:rgba(0,0,0,.65);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--canvas); color:var(--body); transition:background 200ms var(--ease); font-family:var(--sans); font-size:16px; line-height:1.55; margin:0; -webkit-font-smoothing:antialiased}
.wrap{max-width:1200px; margin:0 auto; padding-inline:clamp(16px,4vw,48px); padding-block:20px 72px}
h1,h2,h3,h4{font-family:var(--serif); font-weight:700; color:var(--ink); text-wrap:balance; margin:0}
p{text-wrap:pretty; margin:0}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:none; box-shadow:0 0 0 3px rgba(217,119,87,.35); border-radius:8px}
.eyebrow{font:500 12px/1.4 var(--sans); letter-spacing:1.5px; text-transform:uppercase; color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.coral{color:var(--coral-text)}

/* buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; height:40px; padding:0 18px; border-radius:0 0 8px 8px; border:1px solid var(--coral-fill); background:var(--coral-fill); color:var(--on-primary); font:500 14px/1 var(--sans); white-space:nowrap; transition:background 120ms var(--ease)}
.btn:active{background:var(--coral-active); border-color:var(--coral-active)}
.btn.sec{background:var(--canvas); color:var(--ink); border-color:var(--hairline); border-radius:12px}
.btn.sec:active{background:var(--surface-soft)}
.btn.dk{background:var(--btn-dk); border-color:var(--btn-dk); color:var(--on-panel); border-radius:12px}
.btn.dk:active{background:var(--btn-dk-soft)}
.btn.txt{background:transparent; border-color:transparent; color:var(--ink); padding:0 6px}
.btn:disabled{background:var(--cream-strong); border-color:var(--cream-strong); color:var(--muted); cursor:not-allowed}
.btn.dk:disabled{background:var(--btn-dk-soft); border-color:var(--btn-dk-soft); color:var(--muted-soft)}

/* top bar */
.top{display:flex; align-items:center; justify-content:space-between; gap:16px; padding-bottom:20px; border-bottom:1px solid var(--hairline-soft)}
.mark{font:700 26px/1 var(--serif); letter-spacing:-.4px; color:var(--ink); white-space:nowrap}
@media (max-width:360px){.mark{font-size:20px}.themeb{padding:8px 10px}.lang button{padding:6px 10px}.top{gap:8px}}
.mark b{color:var(--coral); font-weight:400}
.lang{display:inline-flex; background:var(--cream-strong); border-radius:9999px; padding:3px}
.lang button{border:0; background:transparent; border-radius:9999px; padding:6px 14px; font:500 13px/1 var(--sans); color:var(--on-cream); letter-spacing:.5px}
.lang button[aria-pressed="true"]{background:var(--surface-card); color:var(--ink)}
.themeb{display:inline-flex; align-items:center; gap:6px; border:0; background:var(--cream-strong); color:var(--ink); border-radius:9999px; padding:8px 14px; font:500 13px/1 var(--sans)}
.themeb svg{width:14px; height:14px}

/* hero */
.hero{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:24px 48px; align-items:center; padding-block:48px 32px}
.hero h1{font-size:clamp(40px,6.2vw,64px); line-height:1.05; letter-spacing:-1.5px; margin:12px 0 16px}
.hero .lede{font-size:18px; color:var(--body-strong); max-width:60ch}
.owlbox{width:190px; height:190px; border-radius:24px; background:var(--surface-soft); display:grid; place-items:center; overflow:hidden}
.owlscale{transform-origin:center}
.stats{display:flex; flex-wrap:wrap; gap:16px 48px; margin-top:28px}
.stat b{display:block; font:700 36px/1.1 var(--serif); letter-spacing:-.5px; color:var(--ink)}
.stat span{font-size:14px; color:var(--muted)}
.bar{height:6px; background:var(--cream-strong); border-radius:3px; overflow:hidden; margin-top:24px; max-width:640px}
.bar i{display:block; height:100%; width:0; background:var(--coral); transition:width 200ms var(--ease)}

/* continue card */
.next{background:var(--panel); color:var(--on-panel); border-radius:16px; padding:28px 32px; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:20px 32px; align-items:center}
.next .eyebrow{color:var(--on-panel-soft)}
.next h2{color:var(--on-panel); font-size:clamp(26px,3.2vw,34px); letter-spacing:-.5px; line-height:1.15; margin:8px 0 6px}
.next p{color:var(--on-panel-soft); font-size:15px}
.next .acts{display:flex; flex-wrap:wrap; gap:10px}

/* timeline */
.tl{margin-top:48px}
.tlhead{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap}
.tlhead h2{font-size:28px; letter-spacing:-.3px}
.pacetot{font-size:14px; color:var(--muted); margin-top:8px}
.pace{margin-top:16px; background:var(--surface-card); border:1px solid var(--hairline-soft); border-radius:16px; padding:18px 20px; max-width:640px}
.pacehead{display:flex; justify-content:space-between; align-items:baseline; gap:12px}
.pacehead label{font:500 12px/1.4 var(--sans); letter-spacing:1.5px; text-transform:uppercase; color:var(--muted)}
.pacehead output{font:700 28px/1 var(--serif); letter-spacing:-.4px; color:var(--coral-text)}
@media (max-width:420px){.pacehead{flex-direction:column; gap:6px}.pacehead output{font-size:24px}}
#pace{width:100%; margin:14px 0 4px; accent-color:var(--coral); height:24px; cursor:pointer}
.paceticks{display:flex; justify-content:space-between; font-size:12px; color:var(--muted)}
.proj{margin-top:12px; font-size:15px; color:var(--body-strong)}
.proj b{font-weight:600}
.stop .hrs{font-size:12.5px; color:var(--coral-text); margin-top:6px; font-weight:500}
.time{margin-top:14px; background:var(--surface-card); border:1px solid var(--hairline-soft); border-radius:12px; padding:12px 14px}
.time b{display:block; font:700 26px/1.1 var(--serif); letter-spacing:-.3px; color:var(--ink)}
.time span{display:block; font-size:13px; color:var(--muted); margin-top:4px; line-height:1.45}
.tlscroll{overflow-x:auto; padding:8px 4px 4px; margin-top:12px}
.track{position:relative; display:grid; grid-template-columns:repeat(6,minmax(120px,1fr)); min-width:760px}
.stop{position:relative; display:flex; flex-direction:column; align-items:center; text-align:center; background:none; border:0; padding:0 6px 8px; color:var(--ink)}
.stop .nm{font-size:13px; color:var(--muted); height:34px; display:flex; align-items:flex-end; line-height:1.25}
.stop .code{font:700 40px/1.1 var(--serif); letter-spacing:-.5px; margin-top:2px}
.stop .lane{position:relative; width:100%; height:44px; display:flex; align-items:center; justify-content:center}
.seg{position:absolute; top:50%; height:0}
.seg.l{left:0; right:50%}.seg.r{left:50%; right:0}
.seg.done{border-top:4px solid var(--coral); margin-top:-2px}
.seg.todo{border-top:3px dashed var(--hairline); margin-top:-1.5px}
.stop:first-child .seg.l,.stop:last-child .seg.r{display:none}
.dot{position:relative; z-index:1; width:22px; height:22px; border-radius:50%; background:var(--canvas); border:4px solid var(--ink)}
.stop.full .dot{background:var(--coral); border-color:var(--coral)}
.stop[aria-pressed="true"] .dot{width:30px; height:30px; background:var(--coral); border-color:var(--coral); box-shadow:0 0 0 10px rgba(217,119,87,.2)}
.stop[aria-pressed="true"] .code{color:var(--coral-text)}
.stop .ct{font-size:13px; color:var(--muted)}
.stop .mini{width:64px; height:4px; background:var(--cream-strong); border-radius:2px; margin-top:6px; overflow:hidden}
.stop .mini i{display:block; height:100%; background:var(--coral)}

/* filters */
.filters{position:sticky; top:calc(var(--navh,0px) + env(safe-area-inset-top,0px)); z-index:5; background:var(--canvas); border-block:1px solid var(--hairline-soft); margin-top:28px; padding-block:10px; display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center}
.tabs{display:flex; flex-wrap:wrap; gap:4px}
.tabs button{padding:8px 14px; border-radius:8px; border:0; background:transparent; font:500 14px/1.4 var(--sans); color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface-card); color:var(--ink)}
.tools{display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; margin-left:auto}
.field{height:40px; border:1px solid var(--hairline); background:var(--surface-card); border-radius:8px; padding:0 12px; font-size:14px; color:var(--ink)}
.field:focus{outline:none; border-color:var(--coral); box-shadow:0 0 0 3px rgba(217,119,87,.2)}
input.field{width:200px}
.chk{display:inline-flex; gap:8px; align-items:center; font-size:14px; color:var(--body)}
.chk input{accent-color:var(--coral); width:16px; height:16px}

/* level sections */
.level{content-visibility:auto; contain-intrinsic-size:auto 1400px; display:grid; grid-template-columns:240px minmax(0,1fr); gap:24px 40px; padding-block:48px; border-bottom:1px solid var(--hairline-soft)}
.lvside{position:relative}
.lvside .big{font:700 72px/1 var(--serif); letter-spacing:-2px; color:var(--coral-text)}
.lvside h2{font-size:26px; letter-spacing:-.3px; line-height:1.15; margin-top:8px}
.lvside p{font-size:14.5px; color:var(--muted); margin-top:10px}
.lvside .prog{font-size:14px; color:var(--body-strong); margin-top:14px}
.lvside .btn{margin-top:14px}
.group + .group{margin-top:28px}
.ghead{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px}
.list{list-style:none; margin:0; padding:0; background:var(--surface-card); border:1px solid var(--hairline-soft); border-radius:16px; overflow:hidden}
.item{display:flex; align-items:center; gap:14px; padding-left:16px; border-top:1px solid var(--hairline-soft)}
.item:first-child{border-top:0}
.tick{flex:none; width:24px; height:24px; border-radius:6px; border:1.5px solid var(--hairline); background:var(--canvas); display:grid; place-items:center; padding:0}
.tick svg{opacity:0}
.tick[aria-checked="true"]{background:var(--coral-fill); border-color:var(--coral-fill)}
.tick[aria-checked="true"] svg{opacity:1}
.open{flex:1; min-width:0; display:flex; align-items:center; gap:12px; text-align:left; background:none; border:0; padding:14px 16px 14px 0}
.open .t{display:block; font-weight:500; color:var(--ink); line-height:1.35}
.open .m{display:block; font-size:13px; color:var(--muted); line-height:1.4; margin-top:2px}
.item.done .t{color:var(--muted)}
.dots{flex:none; display:flex; gap:4px; margin-left:auto}
.dots i{width:7px; height:7px; border-radius:50%; background:var(--cream-strong)}
.dots i.ok{background:var(--success)}
.dots i.no{background:var(--error)}
.chev{flex:none; color:var(--muted-soft); font-size:18px}
.empty{padding:16px; color:var(--muted); font-size:14px}

/* sheet */
dialog{border:0; border-radius:16px; padding:0; width:min(760px, calc(100vw - 32px)); max-height:calc(100dvh - 40px); background:var(--surface-card); color:var(--body); overflow:auto}
dialog::backdrop{background:var(--backdrop)}
.shead{position:sticky; top:0; z-index:2; background:var(--surface-card); padding:22px 28px 0; border-bottom:1px solid var(--hairline-soft)}
.shead .row{display:flex; align-items:flex-start; gap:16px}
.shead .meta{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.pill{display:inline-flex; align-items:center; padding:4px 12px; border-radius:9999px; background:var(--coral-fill); color:var(--on-primary); font:500 12px/1.4 var(--sans); letter-spacing:1.5px; text-transform:uppercase}
.pill.out{background:transparent; color:var(--muted); box-shadow:inset 0 0 0 1px var(--hairline); letter-spacing:.3px; text-transform:none; font-size:13px}
.shead h3{font-size:clamp(26px,4vw,34px); line-height:1.15; letter-spacing:-.5px; margin:12px 0 4px}
.shead .sub{font-size:14px; color:var(--muted); margin-bottom:12px}
.sowl{margin-left:auto; flex:none; display:flex; gap:10px; align-items:flex-start}
.x{width:36px; height:36px; border-radius:50%; border:1px solid var(--hairline); background:var(--canvas); font-size:18px; line-height:1; color:var(--ink)}
.stabs{display:flex; gap:4px; margin-top:4px}
.stabs button{border:0; background:transparent; padding:10px 14px; border-radius:8px 8px 0 0; font:500 14px/1 var(--sans); color:var(--muted)}
.stabs button[aria-selected="true"]{background:var(--canvas); color:var(--ink)}
.sbody{padding:24px 28px 8px}
.sbody h4{font:500 12px/1.4 var(--sans); letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); margin:22px 0 8px}
.sbody h4:first-child{margin-top:0}
.sbody .lead{font-size:17px; color:var(--body-strong)}
.formula{font:400 14px/1.7 var(--mono); background:var(--canvas); border-radius:8px; padding:12px 16px; color:var(--ink)}
.eg{margin:0; padding-left:20px}
.eg li{margin:4px 0; color:var(--body-strong)}
.fix{display:grid; gap:8px}
.fix div{display:flex; gap:12px; align-items:baseline; padding:10px 14px; border-radius:8px}
.fix .w{background:rgba(198,69,69,.10)}
.fix .w span:last-child{text-decoration:line-through; text-decoration-color:var(--error)}
.fix .r{background:rgba(93,184,114,.12)}
.fix b{flex:none; width:16px; font-weight:600}
.fix .w b{color:var(--err-text)}.fix .r b{color:var(--ok-text)}
.note{font-size:14px; color:var(--muted); background:var(--canvas); border-radius:8px; padding:10px 14px; margin-top:20px}
.sfoot{position:sticky; bottom:0; background:var(--surface-card); border-top:1px solid var(--hairline-soft); padding:14px 28px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between}
.sfoot .grp{display:flex; flex-wrap:wrap; gap:8px}

/* quiz */
.q{background:var(--canvas); border-radius:16px; padding:18px 20px; margin-bottom:16px}
.q .qq{font:500 21px/1.35 var(--serif); color:var(--ink); margin:6px 0 14px; letter-spacing:-.2px}
.opts{display:grid; gap:8px}
.opt{display:flex; gap:12px; align-items:baseline; text-align:left; background:var(--surface-card); border:1px solid var(--hairline-soft); border-radius:12px; padding:11px 14px; color:var(--body-strong)}
.opt .k{font:500 13px/1 var(--mono); color:var(--muted); flex:none}
.opt:disabled{cursor:default}
.opt.right{background:rgba(93,184,114,.14); border-color:var(--success)}
.opt.wrong{background:rgba(198,69,69,.10); border-color:var(--error)}
.fb{margin-top:12px; font-size:15px; color:var(--body-strong)}
.fb b{font-weight:600}
.fb.ok b{color:var(--ok-text)}.fb.no b{color:var(--err-text)}
.qprog{height:4px; background:var(--cream-strong); border-radius:2px; margin-bottom:16px; overflow:hidden}
.qprog i{display:block; height:100%; background:var(--coral); transition:width 200ms var(--ease)}
.score{font:700 64px/1 var(--serif); letter-spacing:-1.5px; color:var(--ink)}

/* flashcards */
.fc{perspective:1400px}
.fcin{position:relative; min-height:340px; transition:transform 420ms var(--ease); transform-style:preserve-3d}
.fc.flip .fcin{transform:rotateY(180deg)}
.face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:24px; padding:28px 30px; overflow:auto}
.face.front{background:var(--surface-soft)}
.face.back{background:var(--panel); color:var(--on-panel); transform:rotateY(180deg)}
.face h3{font-size:clamp(28px,4.4vw,40px); letter-spacing:-.8px; line-height:1.1; margin:10px 0 14px}
.face.back h4{color:var(--on-panel-soft); font:500 12px/1.4 var(--sans); letter-spacing:1.5px; text-transform:uppercase; margin:18px 0 8px}
.face.back h4:first-child{margin-top:0}
.face.back li{color:var(--on-panel)}
.face.back .fix .w{background:rgba(198,69,69,.22)}.face.back .fix .r{background:rgba(93,184,114,.2)}
.face.back .fix .r b{color:#8fd6a0}.face.back .fix .w b{color:#f08a8a}
.face .formula{background:var(--formula-soft); margin-top:14px}
.fchint{font-size:13px; color:var(--muted); text-align:center; margin-top:10px}

/* footer */
footer{margin-top:64px; display:grid; gap:32px; grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
footer h2{font-size:24px; letter-spacing:-.3px; margin-bottom:10px}
footer p, footer li{font-size:14.5px; color:var(--body)}
.refs{list-style:none; padding:0; margin:0}
.refs li{padding-left:2em; text-indent:-2em; margin-bottom:10px; overflow-wrap:anywhere}
.refs a{color:var(--body); text-underline-offset:3px}

/* route timeline motion: draw in when seen, owl walks to your level, live feedback */
.tlscroll{position:relative}
.stop .code,.stop .nm,.stop .ct,.stop .hrs{transition:transform 200ms var(--ease), opacity 200ms var(--ease)}
.stop .dot{transition:transform 200ms var(--ease), background 200ms var(--ease), border-color 200ms var(--ease)}
.seg.done{transform-origin:left center}
@media (hover:hover){ .stop:hover .code{transform:translateY(-3px)} .stop:hover .dot{transform:scale(1.12)} }
.stop:active .dot{transform:scale(.92)}
.track.tl-pre .code,.track.tl-pre .nm,.track.tl-pre .ct,.track.tl-pre .hrs{opacity:0; transform:translateY(8px)}
.track.tl-pre .dot{transform:scale(0)}
.track.tl-pre .seg.done{transform:scaleX(0)}
.track.tl-pre .mini i{width:0!important}
.track.tl-in .nm{transition:opacity 420ms var(--ease) calc(var(--i)*80ms), transform 420ms var(--ease) calc(var(--i)*80ms)}
.track.tl-in .code{transition:opacity 420ms var(--ease) calc(60ms + var(--i)*80ms), transform 420ms var(--ease) calc(60ms + var(--i)*80ms)}
.track.tl-in .dot{transition:transform 380ms var(--ease) calc(120ms + var(--i)*110ms)}
.track.tl-in .seg.done{transition:transform 520ms var(--ease) calc(160ms + var(--i)*110ms)}
.track.tl-in .ct,.track.tl-in .hrs{transition:opacity 420ms var(--ease) calc(240ms + var(--i)*80ms), transform 420ms var(--ease) calc(240ms + var(--i)*80ms)}
.track.tl-in .mini i{transition:width 700ms var(--ease) calc(300ms + var(--i)*90ms)}
.routeowl{position:absolute; left:0; top:0; z-index:2; pointer-events:none; opacity:0; transition:opacity 300ms var(--ease)}
.routeowl.on{opacity:1}
.routeowl .ro-in{transform-origin:50% 100%}

/* listen, links, placement */
.say{display:inline-grid; place-items:center; width:30px; height:30px; margin-left:8px; vertical-align:-8px; border:0; border-radius:50%; background:var(--cream-strong); color:var(--ink); padding:0; flex:none; transition:background 200ms var(--ease), color 200ms var(--ease)}

.xlinks{display:flex; flex-wrap:wrap; gap:8px}
.xlink{display:inline-flex; align-items:center; gap:8px; min-height:40px; padding:8px 14px; border-radius:12px; border:1px solid var(--hairline); background:var(--canvas); color:var(--ink); text-decoration:none; font:500 14px/1.3 var(--sans); transition:background 200ms var(--ease)}

.plist li.pl-pass b{color:var(--ok-text)} .plist li.pl-fail b{color:var(--err-text)}
.plist b{font-weight:600}
.confirm{margin-top:14px; padding:14px 16px; border-radius:12px; background:var(--canvas)}

@media (pointer:coarse){ .say{width:40px; height:40px; vertical-align:-12px} }

/* motion: calm and short; everything is skipped when reduced motion is on */
@keyframes backdrop-in{from{opacity:0}to{opacity:1}}
dialog[open]::backdrop{animation:backdrop-in 240ms var(--ease)}
dialog.closing::backdrop{opacity:0; transition:opacity 170ms ease-in}
.opt{transition:background 200ms var(--ease), border-color 200ms var(--ease), transform 120ms var(--ease)}
.opt:not(:disabled):active{transform:scale(.99)}
.stabs button,.tabs button{transition:background 200ms var(--ease), color 200ms var(--ease)}
.item{transition:background 200ms var(--ease)}
.open .t{transition:color 200ms var(--ease)}
.tick{transition:background 200ms var(--ease), border-color 200ms var(--ease)}
.bar i{transition:width 700ms var(--ease)}
@keyframes owl-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(calc(var(--pxc) * -1))}}

:root[data-theme="dark"] .k1{--kc:#6cc4b0} :root[data-theme="dark"] .k2{--kc:#e8906f} :root[data-theme="dark"] .k3{--kc:#e8b25a} :root[data-theme="dark"] .k4{--kc:#c79bd0} :root[data-theme="dark"] .k5{--kc:#ec8fae} :root[data-theme="dark"] .k6{--kc:#8fcf86} :root[data-theme="dark"] .k7{--kc:#a09d96} :root[data-theme="dark"] .k8{--kc:#8fb0e0}

/* tense board */
.tboard{margin-top:24px}
.tgrid{display:grid; grid-template-columns:190px repeat(3,minmax(0,1fr)); gap:10px}
.tzh{grid-row:1; grid-column:var(--c); text-align:center; font:700 24px/1.2 var(--serif); letter-spacing:-.3px; color:var(--ink)}
.tline{grid-row:2; grid-column:2 / 5; position:relative; height:36px}
.tline::before{content:""; position:absolute; left:4px; right:14px; top:50%; border-top:3px solid var(--ink); margin-top:-1.5px}
.tline::after{content:""; position:absolute; right:2px; top:50%; margin-top:-8px; border-left:14px solid var(--ink); border-top:8px solid transparent; border-bottom:8px solid transparent}
.tnow{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:1}
.tah{grid-column:1; grid-row:var(--r); display:flex; flex-direction:column; justify-content:center; gap:4px; padding-right:6px}

.ico .f{fill:var(--coral)} .ico .s{fill:none; stroke:var(--coral); stroke-width:2.6}
.tcard{grid-column:var(--c); grid-row:var(--r); display:flex; flex-direction:column; align-items:flex-start; gap:6px; text-align:left; min-width:0; min-height:112px; background:var(--surface-card); border:1px solid var(--hairline-soft); border-radius:16px; padding:14px 16px; color:var(--body); transition:opacity 240ms var(--ease), border-color 200ms var(--ease), box-shadow 200ms var(--ease), transform 200ms var(--ease)}
.tcard:active{transform:scale(.99); transition-duration:240ms,200ms,200ms,100ms}
.tcard .asp{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted)}
.tcard .nm{font:600 19px/1.2 var(--serif); letter-spacing:-.2px; color:var(--ink)}
.tcard .en{font-size:12.5px; color:var(--muted); margin-top:-2px}
.tcard .st{margin-top:auto; display:flex; gap:8px; align-items:center; font-size:12.5px; color:var(--muted)}
.tcard .st i{width:7px; height:7px; border-radius:50%; background:var(--cream-strong)}
.tcard .st i.ok{background:var(--success)} .tcard .st i.no{background:var(--error)}
.tcard .st .lrn{color:var(--coral-text); font-weight:500}
.tcard.dim{opacity:.3}
.tcard.hit{border-color:var(--coral); box-shadow:0 0 0 3px rgba(217,119,87,.18)}
.ttstatus{font-size:14.5px; color:var(--body-strong); min-height:1.5em; margin-top:16px}
/* tense timeline motion: draw in once, calm hover, NOW pulse */
.tline::before{transform-origin:left center}
.tnow::after{content:""; position:absolute; inset:0; border-radius:inherit; box-shadow:0 0 0 2px var(--coral); opacity:0; pointer-events:none; animation:nowPulse 3.2s var(--ease) 1.6s infinite}
@keyframes nowPulse{0%{opacity:.5; transform:scale(1)} 60%,100%{opacity:0; transform:scale(1.18,1.6)}}
.tgrid.tg-pre .tline::before{transform:scaleX(0)}
.tgrid.tg-pre .tline::after{opacity:0}
.tgrid.tg-pre .tnow{opacity:0; transform:translate(-50%,-50%) scale(.7)}
.tgrid.tg-pre .tzh,.tgrid.tg-pre .tah{opacity:0; transform:translateY(8px)}
.tgrid.tg-pre .tcard{opacity:0; transform:translateY(10px)}
.tgrid.tg-in .tline::before{transition:transform 700ms var(--ease)}
.tgrid.tg-in .tline::after{transition:opacity 240ms var(--ease) 560ms}
.tgrid.tg-in .tnow{transition:opacity 300ms var(--ease) 360ms, transform 380ms var(--ease) 360ms}
.tgrid.tg-in .tzh{transition:opacity 420ms var(--ease) calc((var(--c) - 2)*90ms), transform 420ms var(--ease) calc((var(--c) - 2)*90ms)}
.tgrid.tg-in .tah{transition:opacity 420ms var(--ease) calc(80ms + (var(--r) - 3)*70ms), transform 420ms var(--ease) calc(80ms + (var(--r) - 3)*70ms)}
.tgrid.tg-in .tcard{transition:opacity 440ms var(--ease) calc(220ms + (var(--c) - 2)*90ms + (var(--r) - 3)*60ms), transform 440ms var(--ease) calc(220ms + (var(--c) - 2)*90ms + (var(--r) - 3)*60ms)}
@media (hover:hover){ .tcard:hover{transform:translateY(-2px); border-color:var(--hairline); box-shadow:0 6px 18px rgba(20,20,19,.06)} .tcard.hit:hover{border-color:var(--coral); box-shadow:0 0 0 3px rgba(217,119,87,.18), 0 6px 18px rgba(20,20,19,.06)} }

/* class tools */

/* ---------- storage (this browser only) ---------- */
// same keys as the learning hub, so class lists, topics and plans saved there still open here
const KEY = "standardHub.v1";
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }, del(k){ try { localStorage.removeItem(k); } catch(e){} } };
const view = {ct:"wheel", lang:"en"};
const readView = () => { try { const v = JSON.parse(store.get(KEY+".view")||"null"); return v && typeof v==="object" && !Array.isArray(v) ? v : {}; } catch(e) { return {}; } };
{ const v = readView(); for (const k of Object.keys(view)) if (typeof v[k]===typeof view[k]) view[k]=v[k]; }
// keep the learning hub's own settings when saving
const saveView = () => store.set(KEY+".view", JSON.stringify(Object.assign(readView(), view)));
view.lang = "vi"; // the website always opens in Vietnamese; the EN button switches this page
if (!has(UI, view.lang)) view.lang = "en";
if (!["wheel","pairs","seats"].includes(view.ct)) view.ct = "wheel";
const L = () => UI[view.lang];
const vi = () => view.lang==="vi";
const li = () => vi() ? 1 : 0;

/* ---------- motion ---------- */
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const EASE = "cubic-bezier(.2,0,0,1)";
function anim(n, frames, opts){ if (RM || !n || !n.animate) return null; return n.animate(frames, Object.assign({duration:240, easing:EASE, fill:"backwards"}, opts||{})); }
const rise = (n, delay=0, dist=8, dur=260) => anim(n, [{opacity:0, transform:`translateY(${dist}px)`},{opacity:1, transform:"none"}], {delay, duration:dur});
const slide = (n, dir) => anim(n, [{opacity:0, transform:`translateX(${dir*18}px)`},{opacity:1, transform:"none"}], {duration:240});
let firstPaint = true, sheetAnim = null, lastPoint = null, lastNextTitle = "";
document.addEventListener("pointerdown", e => { lastPoint = {x:e.clientX, y:e.clientY}; }, true);

/* ---------- class tools ---------- */
let ctReady = false, ct = null;
function ctShow(){
  if (!ctReady){ ct = ctInit(); ctReady = true; }
  ["wheel","pairs","seats"].forEach(k => { const on = view.ct===k, b=$("#ctb-"+k); b.setAttribute("aria-selected", String(on)); b.tabIndex = on?0:-1; $("#ct-"+k).hidden = !on; });
  ct.show(view.ct);
}
function setCt(k, focus){ if (view.ct===k) return; view.ct=k; saveView(); ctShow(); try { history.replaceState(null, "", "#"+k); } catch(e) {} rise($("#ct-"+k),0,8,260); if (focus) $("#ctb-"+k).focus(); }
const CTK = ["wheel","pairs","seats"];
CTK.forEach((k,i) => { const b=$("#ctb-"+k); b.onclick = () => setCt(k); b.addEventListener("keydown", e => { if (e.key==="ArrowRight"||e.key==="ArrowLeft"){ e.preventDefault(); setCt(CTK[(i+(e.key==="ArrowRight"?1:2))%3], true); } }); });
function copyText(text, ok, fail){
  const fallback = () => { const ta=el("textarea"); ta.value=text; document.body.append(ta); ta.select(); let r=false; try { r=document.execCommand("copy"); } catch(e){} ta.remove(); (r?ok:fail)(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
}

function ctInit(){
  /* --- speaking wheel --- */
  const SAMPLE = [
    {n:1, name:"Personality", qs:[["Best friend","Are you and your best friend similar in personality?"],["Role model","Who was someone you looked up to when you were a child?"],["Change","Is there a part of your personality you’d like to change? Why?"]]},
    {n:2, name:"Media", qs:[["News","Do you usually follow the news on TV or online?"],["Last book","What’s the most recent book you’ve read?"],["Movie character","If you could become a movie character, who would you choose to be?"]]},
    {n:3, name:"Around Town", qs:[["Public transport","Do you often use buses, trains, or other public transport?"],["Famous place","When was the last time you went to a famous place in your country?"],["Dream city","If you could move to any city in the world, which one would you choose?"]]},
    {n:4, name:"Art and Music", qs:[["Live music","Have you ever seen live music or gone to a concert?"],["Last film","Can you remember the last film you watched at the cinema?"],["Singer genre","If you became a singer, what music genre would you perform?"]]},
    {n:5, name:"Technology", qs:[["Top tech","Which piece of technology do you use the most?"],["First computer","When did you first start using a computer or laptop?"],["Robot job","If you invented a robot, what job would you want it to do?"]]}];
  const validTopics = arr => Array.isArray(arr) && arr.length>0 && arr.length<=60 && arr.every(t => t && typeof t.name==="string" && typeof t.n==="number" && Array.isArray(t.qs) && t.qs.length>0 && t.qs.every(q => Array.isArray(q) && typeof q[0]==="string" && typeof q[1]==="string")) && arr.reduce((s,t)=>s+t.qs.length,0)<=60;
  let TOPS = SAMPLE;
  try { const sv = JSON.parse(store.get(KEY+".wheel")||"null"); if (validTopics(sv)) TOPS = sv; } catch(e) {}
  const autoLabel = q => { const w=q.replace(/[?.!]+$/,"").split(/\s+/); let lb=w.slice(0,3).join(" "); if (lb.length>18) lb=lb.slice(0,17).trim(); return w.length>3 ? lb+"…" : lb; };
  function parseTopics(text){
    const blocks = text.split(/\n\s*\n/), out=[]; let total=0;
    for (const bl of blocks){
      const lines = bl.split("\n").map(l=>l.replace(/\s+/g," ").trim()).filter(Boolean);
      if (!lines.length) continue;
      if (lines.length<2) return {error:L().wErrBlock(lines[0])};
      let title=lines[0], n=out.length+1, name=title; const m=title.match(/^topic\s*(\d+)\s*[.:]?\s*(.*)$/i);
      if (m && m[2]){ n=parseInt(m[1],10); name=m[2]; }
      while (out.some(t=>t.n===n)) n++;
      const qs = lines.slice(1).map(l => { const b=l.indexOf("|"); if (b>-1 && l.slice(b+1).trim()) return [l.slice(0,b).trim()||autoLabel(l.slice(b+1).trim()), l.slice(b+1).trim()]; return [autoLabel(l), l]; });
      total += qs.length; out.push({n, name, qs});
    }
    if (!out.length) return {error:L().wErrNone};
    if (total>60) return {error:L().wErrMax(total)};
    return {topics:out};
  }
  const toText = tops => tops.map(t => `Topic ${t.n}. ${t.name}\n` + t.qs.map(q=>`${q[0]} | ${q[1]}`).join("\n")).join("\n\n");
  const canvas=$("#wCanvas"), ctx=canvas.getContext("2d"), spinB=$("#wSpin"), skip=$("#wSkip");
  const W = {mode:"two", stage:"topic", topic:null, rot:0, spinning:false, used:{}, history:[], card:{kind:"ph"}};
  let items = [];
  const qkey = (t,q) => t.n+"."+(q+1), isUsed = (t,q) => skip.checked && W.used[qkey(t,q)];
  function buildItems(){
    const out=[];
    if (W.mode==="all") TOPS.forEach(t=>t.qs.forEach((q,qi)=>{ if (!isUsed(t,qi)) out.push({t, qi, label:q[0]}); }));
    else if (W.stage==="topic") TOPS.forEach(t=>{ if (t.qs.some((q,qi)=>!isUsed(t,qi))) out.push({t, label:t.name}); });
    else W.topic.qs.forEach((q,qi)=>{ if (!isUsed(W.topic,qi)) out.push({t:W.topic, qi, label:q[0]}); });
    return out;
  }
  const totalLeft = () => { let c=0; TOPS.forEach(t=>t.qs.forEach((q,qi)=>{ if (!W.used[qkey(t,qi)]) c++; })); return c; };
  function kinds(n){ const k=[]; for (let i=0;i<n;i++){ let c=i%3; if (i===n-1 && i>0) for (let cand=0;cand<3;cand++) if (cand!==k[i-1] && (n===1||cand!==k[0])){ c=cand; break; } k.push(c); } return k; }
  function colors(){ const s=getComputedStyle(document.documentElement), g=n=>s.getPropertyValue(n).trim(); const v=(n,f)=>g(n)||g(f); return {a:v("--wheel-a","--coral-fill"), b:v("--wheel-b","--panel"), c:v("--wheel-c","--cream-strong"), ta:v("--wheel-ta","--on-primary"), tb:v("--wheel-tb","--on-panel"), tc:v("--wheel-tc","--ink"), ring:v("--wheel-ring","--ink"), hub:v("--wheel-hub","--surface-card"), font:g("--serif")}; }
  function draw(){
    const w = canvas.clientWidth; if (!w) return;
    const dpr = Math.min(2, window.devicePixelRatio||1); canvas.width=Math.round(w*dpr); canvas.height=Math.round(w*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,w);
    const K=colors(), cx=w/2, cy=w/2, R=w/2-6, n=items.length;
    if (!n){ ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fillStyle=K.c; ctx.fill(); ctx.lineWidth=5; ctx.strokeStyle=K.ring; ctx.stroke();
      ctx.fillStyle=K.tc; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.font=`600 ${Math.round(w*.055)}px ${K.font}`; ctx.fillText(L().wAllUsed, cx, cy); return; }
    const step=Math.PI*2/n, ks=kinds(n), fills=[K.a,K.b,K.c], texts=[K.ta,K.tb,K.tc], size=(n>10?15:n>6?19:24)*(w/560);
    for (let i=0;i<n;i++){
      const a0 = W.rot + i*step;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,R,a0,a0+step); ctx.closePath(); ctx.fillStyle=fills[ks[i]]; ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle=K.hub; ctx.stroke();
      // labels on the left half are turned the right way up, so no word is ever upside down
      const mid=a0+step/2, flip=Math.cos(mid)<0;
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(flip ? mid+Math.PI : mid); ctx.textAlign=flip ? "left" : "right"; ctx.textBaseline="middle"; ctx.fillStyle=texts[ks[i]];
      let fs=size; ctx.font=`600 ${fs}px ${K.font}`; const maxW=R*.66, tw=ctx.measureText(items[i].label).width;
      if (tw>maxW){ fs=fs*maxW/tw; ctx.font=`600 ${fs}px ${K.font}`; }
      ctx.fillText(items[i].label, flip ? -(R-18) : R-18, 0); ctx.restore();
    }
    ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.lineWidth=5; ctx.strokeStyle=K.ring; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx,cy,R*.1,0,Math.PI*2); ctx.fillStyle=K.hub; ctx.fill(); ctx.lineWidth=4; ctx.strokeStyle=K.ring; ctx.stroke();
  }
  function paintCard(){
    const c=$("#wCard"), k=W.card; c.textContent="";
    if (k.kind==="ph") c.append(el("p",{class:"ph", text:L().wPh}));
    else if (k.kind==="topic") c.append(el("div",{class:"eyebrow coral", text:L().wTopic(k.t.n, k.t.name)}), el("p",{class:"qt", text:L().wNow}));
    else c.append(el("div",{class:"eyebrow coral", text:`${L().wTopic(k.t.n, k.t.name)} · ${L().wQ(k.qi+1)}`}), el("p",{class:"qt", text:k.t.qs[k.qi][1]}));
  }
  function refresh(){
    items = buildItems();
    $("#wHint").innerHTML = W.mode==="all" ? L().wHintAll : W.stage==="topic" ? L().wHint1 : L().wHint2(W.topic.n, W.topic.name.replace(/[<>&]/g,""));
    spinB.textContent = !items.length ? L().wAllUsed : W.mode==="all" ? L().wSpin : W.stage==="topic" ? L().wSpinTopic : L().wSpinQ;
    spinB.disabled = W.spinning || !items.length; canvas.setAttribute("aria-label", L().wAria(items.length));
    const h=$("#wHist"); h.textContent="";
    if (!W.history.length) h.append(el("li",{class:"none", text:L().wNone}));
    else W.history.slice(-6).reverse().forEach(x => h.append(el("li",{}, el("span",{class:"tag", text:x.k}), el("span",{text:x.q}))));
    let all=0; TOPS.forEach(t=>all+=t.qs.length); $("#wLeft").textContent = L().wLeft(totalLeft(), all);
    paintCard(); paintTimer(); draw();
  }
  function spinTo(index){ return new Promise(res => {
    const n=items.length, step=Math.PI*2/n, target=-Math.PI/2-(index+.5)*step, jitter=(Math.random()-.5)*step*.6, from=W.rot, tp=Math.PI*2;
    let delta=(((target+jitter-from)%tp)+tp)%tp; delta += tp*(RM?1:5+Math.floor(Math.random()*3));
    const dur=RM?600:4400; let t0=null;
    const frame = ts => { if (t0===null) t0=ts; const p=Math.min(1,(ts-t0)/dur), e=1-Math.pow(1-p,3); W.rot=from+delta*e; draw(); if (p<1) requestAnimationFrame(frame); else res(); };
    requestAnimationFrame(frame); }); }
  function spin(){
    if (W.spinning || !items.length) return;
    W.spinning=true; spinB.disabled=true;
    const index=Math.floor(Math.random()*items.length), picked=items[index];
    spinTo(index).then(() => {
      W.spinning=false;
      if (W.mode==="two" && W.stage==="topic"){ W.topic=picked.t; W.stage="question"; W.card={kind:"topic", t:picked.t}; W.rot=0; }
      else { const t=picked.t, qi=picked.qi; W.used[qkey(t,qi)]=true; W.history.push({k:qkey(t,qi), q:t.qs[qi][1]}); W.card={kind:"q", t, qi};
        if (W.mode==="two"){ W.stage="topic"; W.topic=null; W.rot=0; } resetTimer(); }
      refresh(); rise($("#wCard").firstChild,0,6,260); if (heroOwl) { heroOwl.setPose("wave"); setTimeout(()=>heroOwl.setPose("default"), 2400); }
    });
  }
  function setMode(m){ if (W.spinning) return; W.mode=m; W.stage="topic"; W.topic=null; W.rot=0; $("#wModeTwo").setAttribute("aria-pressed",String(m==="two")); $("#wModeAll").setAttribute("aria-pressed",String(m==="all")); refresh(); }
  spinB.onclick = spin; canvas.onclick = spin;
  $("#wModeTwo").onclick = () => setMode("two"); $("#wModeAll").onclick = () => setMode("all");
  skip.onchange = () => { if (W.spinning) return; if (W.mode==="two" && W.stage==="question" && !buildItems().length){ W.stage="topic"; W.topic=null; } refresh(); };
  $("#wReset").onclick = () => { if (W.spinning) return; W.used={}; W.history=[]; W.stage="topic"; W.topic=null; W.rot=0; W.card={kind:"ph"}; resetTimer(); refresh(); };

  /* --- classes: one list of names, shared by speaking pairs and the seat plan --- */
  const LOCK_OPEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/></svg>';
  const LOCK_SHUT = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none"/></svg>';
  const clamp8 = v => { v=parseInt(v,10); if (isNaN(v)) v=4; return Math.max(1, Math.min(8, v)); };
  const midAisle = c => c>1 ? Math.floor(c/2) : 0;
  const tidy = x => String(x).replace(/\s+/g," ").trim().slice(0,80);
  const strList = (a, max) => Array.isArray(a) ? [...new Set(a.filter(x=>typeof x==="string" && x.trim()).map(tidy))].slice(0,max) : [];
  const blankSeat = (rows=4, cols=4) => ({rows, cols, aisle:midAisle(cols), seats:Array(rows*cols).fill(null), locked:Array(rows*cols).fill(false), rules:[]});
  function cleanSeat(d, names){
    const set = new Set(names);
    if (!d || typeof d!=="object" || !Array.isArray(d.seats) || !Array.isArray(d.locked)) return blankSeat();
    const rows=clamp8(d.rows), cols=clamp8(d.cols); if (d.seats.length!==rows*cols || d.locked.length!==rows*cols) return blankSeat(rows, cols);
    const ai=parseInt(d.aisle,10), seen={};
    const seats = d.seats.map(n => (typeof n==="string" && set.has(n) && !seen[n]) ? (seen[n]=1, n) : null);
    return {rows, cols, aisle: !isNaN(ai) && ai>=0 && ai<cols ? ai : midAisle(cols), seats,
      locked: d.locked.map((v,i)=>!!v && seats[i]!==null),
      rules: (Array.isArray(d.rules)?d.rules:[]).filter(r=>r && set.has(r.a) && set.has(r.b) && r.a!==r.b && (r.type==="apart"||r.type==="together")).map(r=>({a:r.a, b:r.b, type:r.type}))};
  }
  function cleanClass(c){
    if (!c || typeof c!=="object" || typeof c.id!=="string" || !c.id) return null;
    const names = strList(c.names, 200), set = new Set(names);
    const absent = {}; if (c.absent && typeof c.absent==="object") for (const k of Object.keys(c.absent)) if (set.has(k) && c.absent[k]) absent[k]=true;
    const history = Array.isArray(c.history) ? c.history.filter(r=>Array.isArray(r) && r.every(g=>Array.isArray(g) && g.every(x=>typeof x==="string"))).slice(-200) : [];
    const plans = Array.isArray(c.plans) ? c.plans.filter(p=>p && typeof p.name==="string").slice(0,100).map(p=>({name:tidy(p.name).slice(0,60), seat:cleanSeat(p.seat, names)})) : [];
    return {id:c.id.slice(0,40), name: typeof c.name==="string" && c.name.trim() ? tidy(c.name).slice(0,60) : "Class", sample: !!c.sample, names, absent, history, topicsOn: !!c.topicsOn, seat: cleanSeat(c.seat, names), plans};
  }
  const sampleNames = n => Array.from({length:n}, (_,i)=>L().student(i+1));
  const newId = () => "c" + Date.now().toString(36) + Math.floor(Math.random()*1e4).toString(36);
  const makeClass = (name, names, sample) => ({id:newId(), name, sample:!!sample, names, absent:{}, history:[], topicsOn:false, seat:blankSeat(), plans:[]});
  function rename(c, map){ // swap names everywhere in a class (used to translate the sample class)
    const m = n => map[n] || n;
    c.names = c.names.map(m); const ab={}; Object.keys(c.absent).forEach(k=>{ ab[m(k)]=true; }); c.absent=ab;
    c.history = c.history.map(r=>r.map(g=>g.map(m)));
    c.seat.seats = c.seat.seats.map(n=>n===null?null:m(n)); c.seat.rules.forEach(r=>{ r.a=m(r.a); r.b=m(r.b); });
    c.plans.forEach(p=>{ p.seat.seats=p.seat.seats.map(n=>n===null?null:m(n)); p.seat.rules.forEach(r=>{ r.a=m(r.a); r.b=m(r.b); }); });
  }
  function relabelSample(c){ if (!c.sample) return; const want = sampleNames(c.names.length), map={};
    c.names.forEach((n,i)=>{ if (n!==want[i]) map[n]=want[i]; }); if (Object.keys(map).length) rename(c, map); c.name = L().sampleClass; }
  const sameSet = (a,b) => a.length===b.length && a.every(x=>b.includes(x));
  function migrate(){ // lists saved by the earlier version of this page become classes
    const out=[]; let pairs=null, seats=null, plans=null;
    try { pairs=JSON.parse(store.get(KEY+".pairs")||"null"); } catch(e) {}
    try { seats=JSON.parse(store.get(KEY+".seats")||"null"); } catch(e) {}
    try { plans=JSON.parse(store.get(KEY+".plans")||"null"); } catch(e) {}
    const pn = pairs && typeof pairs==="object" ? strList(pairs.names,200) : [], sn = seats && typeof seats==="object" ? strList(seats.roster,200) : [];
    const oldPlans = names => Array.isArray(plans) ? plans.filter(p=>p && typeof p.name==="string").map(p=>({name:tidy(p.name).slice(0,60), seat:cleanSeat(p, names)})) : [];
    if (pn.length>=2){ const c = cleanClass(Object.assign(makeClass(L().myClass, pn), {absent:pairs.absent, history:pairs.history, topicsOn:pairs.topicsOn}));
      if (sn.length && sameSet(sn,pn)){ c.seat=cleanSeat(seats, pn); c.plans=oldPlans(pn); } out.push(c); }
    if (sn.length && !(out[0] && sameSet(sn, out[0].names))){ const c = makeClass(L().seatClass, sn); c.seat=cleanSeat(seats, sn); c.plans=oldPlans(sn); out.push(c); }
    return out;
  }
  const CL = {list:[], cur:null};
  try { const d=JSON.parse(store.get(KEY+".classes")||"null"); if (d && Array.isArray(d.list)){ CL.list = d.list.map(cleanClass).filter(Boolean).slice(0,50); CL.cur = typeof d.cur==="string" ? d.cur : null; } } catch(e) {}
  if (!CL.list.length) CL.list = migrate();
  if (!CL.list.length) CL.list = [makeClass(L().sampleClass, sampleNames(16), true)];
  CL.list.forEach(relabelSample);
  if (!CL.list.some(c=>c.id===CL.cur)) CL.cur = CL.list[0].id;
  const cls = () => CL.list.find(c=>c.id===CL.cur);
  const saveCL = () => store.set(KEY+".classes", JSON.stringify({cur:CL.cur, list:CL.list}));
  saveCL();

  /* names pasted from a list, Excel or Google Sheets: pick the name column, join split surname and first name columns, drop headers and numbers */
  const HEAD = /^(stt|tt|no\.?|#|số tt|số thứ tự|mã sv|mã số|mã học sinh|mssv|họ và tên|họ tên|họ|tên|họ và tên đệm|họ lót|họ đệm|tên đệm|name|names|full name|first name|last name|given name|surname|student|students|student name|học sinh|sinh viên|giới tính|lớp|class|email|ngày sinh)$/i;
  const isNameCell = v => (v.match(/\p{L}/gu)||[]).length>=2 && !/\d/.test(v) && !/@/.test(v);
  function parseNames(text){
    let rows = String(text).replace(/\r/g,"").split("\n").map(l=>l.split("\t").map(x=>x.replace(/\s+/g," ").trim())).filter(r=>r.some(Boolean));
    if (rows.length && rows[0].some(v=>HEAD.test(v))) rows = rows.slice(1);
    if (!rows.length) return [];
    const ncol = Math.max(...rows.map(r=>r.length));
    let pick = r => r[0]||"";
    if (ncol>1){
      const stats = [...Array(ncol).keys()].map(c => { const vals = rows.map(r=>r[c]||"").filter(Boolean), names = vals.filter(isNameCell);
        const distinct = new Set(names).size, words = names.length ? names.reduce((s,v)=>s+v.split(" ").length,0)/names.length : 0;
        const ok = names.length >= Math.max(2, rows.length*.6) && !(rows.length>4 && distinct < names.length*.4);
        return {c, ok, letters: names.reduce((s,v)=>s+v.length,0), words}; });
      const good = stats.filter(s=>s.ok);
      const pair = good.find(s => { const nx = stats[s.c+1]; return nx && nx.ok && nx.words<=1.3 && s.words>=1; });
      if (pair) pick = r => [r[pair.c]||"", r[pair.c+1]||""].filter(Boolean).join(" ");
      else if (good.length){ const best = good.sort((a,b)=>b.letters-a.letters)[0]; pick = r => r[best.c]||""; }
    }
    const seen = new Set(), out = [];
    rows.forEach(r => { const v = tidy(pick(r).replace(/^\d+\s*[.)]\s*/,"")); if (!v || HEAD.test(v) || !/\p{L}/u.test(v) || seen.has(v)) return; seen.add(v); out.push(v); });
    return out.slice(0,200);
  }

  /* class bar */
  let editing = null; // null, "new" or "edit"
  const clsMsg = t => { $("#clsMsg").textContent = t; };
  function paintClassBar(){

  $("#clsSel").onchange = e => { if (!CL.list.some(c=>c.id===e.target.value)) return; CL.cur = e.target.value; saveCL(); closeEditor(); $("#clsDelBox").hidden=true; classChanged(true); };

  $("#clsDelNo").onclick = () => { $("#clsDelBox").hidden = true; };
  $("#clsDelYes").onclick = () => { const gone = cls().name; CL.list = CL.list.filter(c=>c.id!==CL.cur);
    if (!CL.list.length) CL.list = [makeClass(L().sampleClass, sampleNames(16), true)];

  const flash = t => { if (view.ct==="pairs") $("#pNote").textContent = t; else $("#sNote").textContent = t; };

  /* --- speaking pairs --- */
  const PG = {groups:[], score:0, cid:null};
  const shuffle = a => { a=a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
  const pk = (a,b) => a<b ? a+"|"+b : b+"|"+a;
  const present = () => cls().names.filter(n=>!cls().absent[n]);
  const topicNames = () => TOPS.map(t=>`Topic ${t.n}. ${t.name}`);
  function hist(){ const pairs={}, trio={}; cls().history.forEach(r=>r.forEach(g=>{ for (let i=0;i<g.length;i++) for (let j=i+1;j<g.length;j++) pairs[pk(g[i],g[j])]=true; if (g.length===3) g.forEach(n=>trio[n]=true); })); return {pairs, trio}; }
  function chunk(o){ const out=[], n=o.length; if (n%2===1 && n>=3){ for (let i=0;i<n-3;i+=2) out.push([o[i],o[i+1]]); out.push([o[n-3],o[n-2],o[n-1]]); } else for (let k=0;k<n;k+=2) out.push(o.slice(k,k+2)); return out; }
  function scoreOf(gs,h){ let s=0; gs.forEach(g=>{ for (let i=0;i<g.length;i++) for (let j=i+1;j<g.length;j++) if (h.pairs[pk(g[i],g[j])]) s+=1; if (g.length===3) g.forEach(n=>{ if (h.trio[n]) s+=.25; }); }); return s; }
  function generate(){ const list=present(), h=hist(); let best=null, bs=Infinity;
    if (list.length>=2) for (let t=0;t<600;t++){ const g=chunk(shuffle(list)), sc=scoreOf(g,h); if (sc<bs){ bs=sc; best=g; if (sc===0) break; } }
    const tp=shuffle(topicNames()); PG.groups=(best||[]).map((m,i)=>({members:m, topic:tp[i%tp.length]})); PG.score=best?bs:0; PG.cid=CL.cur; }
  const pNote = t => { $("#pNote").textContent = t; };
  const groupLabel = (g,i) => g.members.length===3 ? L().pGroup3 : L().pPair(i+1);
  function renderPairs(animate){
    const c = cls(); if (PG.cid!==c.id) generate();
    $("#pTopics").checked = c.topicsOn;
    const r=$("#pRoster"); r.textContent="";
    c.names.forEach(name => { const cb=el("input",{type:"checkbox"}); cb.checked=!c.absent[name];
      cb.onchange = () => { if (cb.checked) delete c.absent[name]; else c.absent[name]=true; saveCL(); generate(); renderPairs(true); };
      r.append(el("li",{class:c.absent[name]?"off":""}, el("label",{}, cb, el("span",{text:name})))); });
    const n=present().length;
    $("#pCount").textContent = L().pCount(n, c.names.length); $("#pSummary").textContent = `${c.name} · ${L().pSummary(n)}`;
    $("#pRound").textContent = L().pRound(c.history.length+1); $("#pHist").textContent = L().pHist(c.history.length);
    $("#pClear").disabled = !c.history.length; $("#pShuffle").disabled = n<2;
    ["#pLock","#pCopy","#pPic","#pPrint"].forEach(s => { $(s).disabled = !PG.groups.length; });
    const g=$("#pGroups"); g.textContent="";
    PG.groups.forEach((x,i) => { const card = el("div",{class:"pair"+(x.members.length===3?" trio":"")},
        el("div",{class:"eyebrow", text:groupLabel(x,i)}), el("ul",{}, x.members.map(m=>el("li",{text:m}))), c.topicsOn ? el("div",{class:"tp", text:x.topic}) : null);
      g.append(card); if (animate) rise(card, Math.min(i,12)*35, 10, 300); });
    const msg=[]; if (n<2) msg.push(L().pNeed2); else { if (n%2===1) msg.push(L().pOdd(n)); if (PG.score>=1) msg.push(L().pRepeat(Math.floor(PG.score))); if (!msg.length) msg.push(L().pAllNew); }
    pNote(msg.join(" "));
  }
  const pairsText = () => [`${cls().name} · ${L().pRound(cls().history.length+1)}`, ...PG.groups.map((g,i)=>`${groupLabel(g,i)}: ${g.members.join(L().and)}` + (cls().topicsOn?` (${g.topic})`:""))].join("\n");
  $("#pShuffle").onclick = () => { generate(); renderPairs(true); };
  $("#pLock").onclick = () => { if (!PG.groups.length) return; const c=cls(); c.history.push(PG.groups.map(g=>g.members.slice())); saveCL(); generate(); renderPairs(true); pNote(L().pLocked(c.history.length)); };
  $("#pClear").onclick = () => { cls().history=[]; saveCL(); generate(); renderPairs(true); };
  $("#pAll").onclick = () => { cls().absent={}; saveCL(); generate(); renderPairs(true); };
  $("#pTopics").onchange = e => { cls().topicsOn = e.target.checked; saveCL(); renderPairs(false); };
  $("#pCopy").onclick = () => copyText(pairsText(), ()=>pNote(L().copiedList), ()=>pNote(L().copyFail));

  /* --- seat plan --- */
  let sel = null;
  const S = () => cls().seat;
  const sNote = t => { $("#sNote").textContent = t; };
  const seated = () => S().seats.filter(n=>n!==null);
  const unseated = () => { const s=new Set(seated()); return cls().names.filter(n=>!s.has(n)); };
  const pos = i => ({r:Math.floor(i/S().cols), c:i%S().cols});
  function ruleState(rule, seats){ const ia=seats.indexOf(rule.a), ib=seats.indexOf(rule.b); if (ia<0||ib<0) return "unseated";
    const pa=pos(ia), pb=pos(ib); const dr=Math.abs(pa.r-pb.r); let dc=Math.abs(pa.c-pb.c);
    if (S().aisle>0 && (pa.c<S().aisle)!==(pb.c<S().aisle)) dc=99;
    if (rule.type==="apart") return Math.max(dr,dc)<=1 ? "broken" : "met"; return (dr===0 && dc===1) ? "met" : "broken"; }
  const brokenCount = seats => S().rules.filter(r=>ruleState(r,seats)==="broken").length;
  function swapSeats(a,b){ const s=S(); if (a===b) return; if (s.locked[a]||s.locked[b]){ sNote(L().sReserved); return; } [s.seats[a],s.seats[b]]=[s.seats[b],s.seats[a]]; }
  function placeName(name,to){ const s=S(); if (s.locked[to]){ sNote(L().sReservedTo); return; } const from=s.seats.indexOf(name); if (from>-1){ if (s.locked[from]){ sNote(L().sReserved); return; } s.seats[from]=s.seats[to]; } s.seats[to]=name; }
  const act = fn => { fn(); sel=null; saveCL(); renderSeats(); };
  function randomAssign(){
    const s=S(), names=cls().names; if (!names.length){ sNote(L().sAddFirst); return; }
    const keep={}; s.seats.forEach((n,i)=>{ if (s.locked[i] && n!==null) keep[n]=1; });
    const pool=names.filter(n=>!keep[n]), free=[]; s.seats.forEach((n,i)=>{ if (!(s.locked[i] && n!==null)) free.push(i); });
    let best=null, bs=Infinity;
    for (let t=0;t<800;t++){ const o=shuffle(pool), seats=s.seats.slice(); free.forEach((idx,k)=>{ seats[idx]= k<o.length ? o[k] : null; }); const sc=brokenCount(seats); if (sc<bs){ bs=sc; best=seats; if (!sc) break; } }
    s.seats=best; sel=null; saveCL(); renderSeats(true);
    const left=unseated().length, parts=[]; if (bs>0) parts.push(L().sRulesFail(bs)); else if (s.rules.length) parts.push(L().sRulesOk); if (left>0) parts.push(L().sNoSeat(left));
    sNote(parts.join(" ") || L().sAssigned);
  }
  function resize(rows, cols){ const o=S(), n=blankSeat(rows, cols); if (cols===o.cols) n.aisle=o.aisle;
    for (let r=0;r<Math.min(rows,o.rows);r++) for (let c=0;c<Math.min(cols,o.cols);c++){ n.seats[r*cols+c]=o.seats[r*o.cols+c]; n.locked[r*cols+c]=o.locked[r*o.cols+c]; }
